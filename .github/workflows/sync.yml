name: Đồng bộ & triển khai PM Hub

on:
  push:
    branches: [main, claude/dazzling-ritchie-f99mv9]
  schedule:
    - cron: '17 23 * * *' # 06:17 giờ Việt Nam hằng ngày
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pm-hub
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Đồng bộ Sale guide + sinh chỉ mục tìm kiếm
        run: node tools/build.mjs

      - name: Lưu nội dung đã đồng bộ vào repo
        run: |
          git config user.name "pm-hub-bot"
          git config user.email "pm-hub-bot@users.noreply.github.com"
          git add content/sale-guide data
          git diff --cached --quiet || (git commit -m "chore: đồng bộ nội dung PM Hub" && git push)

      - name: Đóng gói site
        run: |
          mkdir _site
          cp -r index.html assets content data tools _site/
          rm -f _site/tools/*.mjs
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
