<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mindmap giải pháp & hãng · PM Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fb;--surface:#fff;--surface-2:#f7f9fc;--text:#0e1a2b;--muted:#5b6b82;--faint:#8a98ad;--border:#e3e9f2;--border-2:#cfd8e6;--accent:#0b5cad;--accent-soft:rgba(11,92,173,.09);--nts:#0b5cad;--orange:#f37021;--ok:#16a34a;--shadow:0 1px 2px rgba(14,26,43,.06),0 10px 28px -12px rgba(14,26,43,.25);--font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--grid:rgba(14,26,43,.045);color-scheme:light}
:root[data-theme="dark"]{--bg:#070f1d;--surface:#0e1a2e;--surface-2:#0b1627;--text:#e5ecf6;--muted:#93a3bb;--faint:#6b7d97;--border:#1b2a42;--border-2:#253855;--accent:#4d9bf0;--accent-soft:rgba(77,155,240,.14);--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -10px rgba(0,0,0,.6);--grid:rgba(255,255,255,.04);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070f1d;--surface:#0e1a2e;--surface-2:#0b1627;--text:#e5ecf6;--muted:#93a3bb;--faint:#6b7d97;--border:#1b2a42;--border-2:#253855;--accent:#4d9bf0;--accent-soft:rgba(77,155,240,.14);--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -10px rgba(0,0,0,.6);--grid:rgba(255,255,255,.04);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;width:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
.ic{width:18px;height:18px;flex:none}
.wrap{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr)}
/* thanh công cụ */
.bar{min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--border);z-index:5}
.ttl{display:flex;align-items:center;gap:10px;margin-right:6px}
.ttl-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#0b5cad,#06204a);color:#fff}
.ttl b{display:block;font-size:14.5px;line-height:1.2}
.ttl small{display:block;font-size:11.5px;color:var(--muted)}
.views{display:flex;gap:4px;padding:3px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);overflow-x:auto;scrollbar-width:none;max-width:100%}
.views::-webkit-scrollbar{display:none}
.views button{height:32px;padding:0 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.views button.on{background:var(--accent);color:#fff}
.search{position:relative;flex:1;min-width:190px;max-width:380px;display:flex;align-items:center}
.search .ic{position:absolute;left:11px;color:var(--faint);width:16px;height:16px}
.search input{width:100%;height:38px;padding:0 96px 0 34px;border-radius:10px;border:1px solid var(--border-2);background:var(--surface-2);outline:0}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.hits{position:absolute;right:6px;display:flex;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.hits button{width:26px;height:26px;border-radius:7px;display:grid;place-items:center}
.hits button:hover{background:var(--accent-soft);color:var(--accent)}
.hits .ic{width:14px;height:14px}
.tools{display:flex;gap:6px;margin-left:auto}
.tb{height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--border-2);background:var(--surface);display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;white-space:nowrap}
.tb:hover{border-color:var(--accent);color:var(--accent)}
.tb.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.tb .ic{width:16px;height:16px}
/* vùng sơ đồ */
.stage{position:relative;overflow:hidden;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;background-image:radial-gradient(var(--grid) 1.2px,transparent 1.2px);background-size:22px 22px}
#cv.drag{cursor:grabbing}
#cv text{font-family:var(--font);user-select:none;-webkit-user-select:none}
.nd{cursor:pointer}
.nd rect.bx{transition:stroke-width .12s}
.nd:hover rect.bx{stroke-width:2.2}
.zoom{position:absolute;left:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zoom button{width:38px;height:38px;border-radius:11px;background:var(--surface);border:1px solid var(--border-2);display:grid;place-items:center;box-shadow:var(--shadow)}
.zoom button:hover{color:var(--accent);border-color:var(--accent)}
.legend{position:absolute;left:62px;bottom:14px;display:flex;flex-wrap:wrap;gap:6px 12px;padding:8px 12px;border-radius:11px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--border);font-size:11.5px;color:var(--muted);max-width:min(560px,calc(100% - 80px));z-index:2;backdrop-filter:blur(6px)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.stat{position:absolute;right:14px;bottom:14px;font-size:11.5px;color:var(--faint);z-index:2;font-variant-numeric:tabular-nums}
/* bảng bên phải: chi tiết + hỏi nhanh */
.panel{position:absolute;top:12px;right:12px;bottom:12px;width:380px;max-width:calc(100% - 24px);background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;z-index:6;overflow:hidden}
.p-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border)}
.p-head b{flex:1;font-size:14px}
.p-x{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.p-x:hover{background:var(--accent-soft);color:var(--accent)}
.p-body{flex:1;overflow:auto;padding:14px;overscroll-behavior:contain}
.kick{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c,var(--accent))}
.p-body h2{margin:2px 0 6px;font-size:18px;line-height:1.3;text-wrap:balance}
.p-body p{margin:0 0 10px;color:var(--muted);font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;color:var(--c,var(--muted));background:color-mix(in srgb,var(--c,var(--muted)) 13%,transparent);white-space:nowrap}
.chip.nts{--c:#f37021}
dl{margin:0 0 12px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
dt{color:var(--muted);white-space:nowrap}
dd{margin:0;min-width:0}
.sub{margin:14px 0 6px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);margin-bottom:6px;width:100%;text-align:left;background:var(--surface)}
.row:hover{border-color:var(--accent);background:var(--accent-soft)}
.row .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent));flex:none}
.row span{flex:1;min-width:0}
.row b{display:block;font-size:13px;font-weight:600;line-height:1.35}
.row small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ic{width:14px;height:14px;color:var(--faint)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
/* hỏi nhanh */
.ask-log{display:flex;flex-direction:column;gap:10px}
.msg{max-width:100%;overflow-wrap:anywhere;padding:10px 12px;border-radius:13px;font-size:13.5px;line-height:1.55}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px;max-width:88%}
.msg.bot{background:var(--surface-2);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.bot b{font-weight:700}
.msg.bot ul{margin:6px 0 0;padding-left:18px}
.msg.bot li{margin:2px 0}
.msg .acts{margin:8px 0 0}
.msg .tb{height:30px;padding:0 10px;font-size:12px;border-radius:8px}
.snip{overflow-wrap:anywhere;margin-top:8px;padding:8px 10px;border-left:3px solid var(--border-2);background:var(--surface);border-radius:0 8px 8px 0;font-size:12.5px;color:var(--muted)}
.snip a{display:block;font-weight:600;color:var(--accent);margin-bottom:2px}
mark{background:rgba(243,112,33,.28);color:inherit;border-radius:3px;padding:0 1px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sugg button{font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid var(--border-2);color:var(--muted);text-align:left}
.sugg button:hover{border-color:var(--accent);color:var(--accent)}
.ask-in{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border);background:var(--surface)}
.ask-in input{flex:1;height:40px;border-radius:10px;border:1px solid var(--border-2);background:var(--surface-2);padding:0 12px;outline:0;min-width:0}
.ask-in input:focus{border-color:var(--accent)}
.ask-in button{width:40px;height:40px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
/* menu chụp + xem ảnh */
.menu{position:absolute;z-index:20;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:5px;min-width:230px}
.menu button{display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;border-radius:8px;font-size:13px;text-align:left}
.menu button:hover{background:var(--accent-soft);color:var(--accent)}
.ov{position:fixed;inset:0;background:rgba(5,12,24,.6);display:grid;place-items:center;z-index:50;padding:16px}
.ov-card{background:var(--surface);border-radius:16px;max-width:min(900px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.ov-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border)}
.ov-h b{flex:1}.ov-h span{font-size:12px;color:var(--muted)}
.ov-img{overflow:auto;padding:12px;background:var(--surface-2)}
.ov-img img{display:block;max-width:100%;height:auto;border-radius:8px;border:1px solid var(--border)}
.ov-f{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:12px 14px;border-top:1px solid var(--border)}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#0e1a2b;color:#fff;padding:9px 15px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.load{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}
@media (max-width:820px){
  .bar{padding:8px 10px;gap:6px}
  .ttl small{display:none}.ttl b{font-size:13.5px}
  .search{order:5;max-width:none;flex-basis:100%}
  .tools{margin-left:auto}
  .tb span{display:none}.tb{padding:0 11px}
  .panel{top:auto;left:0;right:0;bottom:0;width:auto;max-width:none;height:62%;border-radius:18px 18px 0 0}
  .legend{display:none}
  .views{order:4;flex-basis:100%}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="ttl"><span class="ttl-ic" data-ic="mind"></span><div><b>Mindmap giải pháp & hãng</b><small>Vị trí trong khung Cyber Security · tài liệu PM Hub</small></div></div>
    <div class="views" id="views"></div>
    <label class="search"><span data-ic="search"></span><input id="q" placeholder="Tìm nhanh: PAM, Delinea, DLP, Qualys…" autocomplete="off" spellcheck="false"><span class="hits" id="hits" hidden><span id="hitN"></span><button id="hitP" title="Kết quả trước" data-ic="up"></button><button id="hitX" title="Kết quả sau" data-ic="down"></button></span></label>
    <div class="tools">
      <button class="tb" id="bExp" title="Mở rộng thêm một cấp"><span data-ic="plus" style="display:inline-flex"></span><span>Mở thêm cấp</span></button>
      <button class="tb" id="bCol" title="Thu gọn về cấp đầu"><span data-ic="minus" style="display:inline-flex"></span><span>Thu gọn</span></button>
      <button class="tb" id="bShot" title="Chụp sơ đồ"><span data-ic="camera" style="display:inline-flex"></span><span>Chụp ảnh</span></button>
      <button class="tb pri" id="bAsk" title="Hỏi nhanh"><span data-ic="chat" style="display:inline-flex"></span><span>Hỏi nhanh</span></button>
    </div>
  </header>
  <div class="stage" id="stage">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg"><g id="g"></g></svg>
    <div class="load" id="load">Đang tải dữ liệu…</div>
    <div class="zoom"><button id="zIn" title="Phóng to" data-ic="plus"></button><button id="zOut" title="Thu nhỏ" data-ic="minus"></button><button id="zFit" title="Vừa màn hình" data-ic="fit"></button></div>
    <div class="legend" id="legend"></div>
    <div class="stat" id="stat"></div>
    <aside class="panel" id="panel" hidden>
      <div class="p-head"><span data-ic="info" id="pIc" style="display:inline-flex"></span><b id="pTtl">Chi tiết</b><button class="p-x" id="pX" aria-label="Đóng" data-ic="x"></button></div>
      <div class="p-body" id="pBody"></div>
      <form class="ask-in" id="askForm" hidden><input id="askQ" placeholder="Hỏi: PAM có hãng nào? Ai phân phối Qualys?" autocomplete="off"><button aria-label="Gửi" data-ic="send"></button></form>
    </aside>
  </div>
</div>
<div id="toast"></div>
<script>
'use strict';
/* ---------- tiện ích ---------- */
const P={mind:'<circle cx="5" cy="12" r="2.5"/><circle cx="19" cy="5" r="2.5"/><circle cx="19" cy="12" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M7.5 12h9M7.2 11c3-1 5-5 9.3-6M7.2 13c3 1 5 5 9.3 6"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.5-4.5"/>',plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',fit:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',camera:'<path d="M4 8h3l1.5-2.5h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/>',chat:'<path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-8l-5 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/><path d="M8 10h8M8 13h5"/>',send:'<path d="M4 12 20 4l-6 16-3-7z"/><path d="m11 13 9-9"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/>',up:'<path d="m6 15 6-6 6 6"/>',down:'<path d="m6 9 6 6 6-6"/>',ext:'<path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M19 13.5V19a1.5 1.5 0 0 1-1.5 1.5h-12A1.5 1.5 0 0 1 4 19V6.5A1.5 1.5 0 0 1 5.5 5H11"/>',eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',download:'<path d="M12 4v11M7 10.5l5 5 5-5"/><path d="M4 19.5h16"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>'};
const icon=n=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]||''}</svg>`;
document.querySelectorAll('[data-ic]').forEach(e=>e.innerHTML=icon(e.dataset.ic));
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',2400)};
const inHub=(()=>{try{return parent!==window&&!!parent.location.href}catch(e){return false}})();
try{const t=(inHub?parent.document.documentElement.dataset.theme:null)||localStorage.getItem('pmhub.theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
const isDark=()=>{const t=document.documentElement.dataset.theme;return t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches)};
const LIB='../update-solution/thu-vien-giai-phap-cyber-security.html';
function openHub(id){if(inHub)parent.location.hash='#/v/'+id;else window.open('../../#/v/'+id,'_blank')}
function openHubRoute(h){if(inHub)parent.location.hash=h;else window.open('../../'+h,'_blank')}

/* ---------- dữ liệu ---------- */
let FW,CAT,IDX=[],SOLBY={},LAYBY={};
/* loại giải pháp của Sale guide -> giải pháp trong thư viện */
const CAT2SOL={pam:'pam',nac:'nac',dlp:'dlp',ddos:'ddos',npm:'npm',siem:'siem',backup:'backup',appsec:'sast',data:'encrypt',ot:'diode',cdr:'cdr',pentest:'asv',vm:'vm',adc:'adc',email:'email',itm:'dlp',platform:'email'};
const SOLFIX=[[/dast/i,'dast'],[/sast/i,'sast'],[/data security_proofpoint/i,'dlp'],[/voltage/i,'encrypt'],[/diode|bsg/i,'diode'],[/open xdr|ng-siem/i,'siem']];
const solOfDoc=d=>{for(const [re,id] of SOLFIX)if(re.test(d.solution||''))return id;return CAT2SOL[d.cat]||null};
const TYPEC={'Cẩm nang bán hàng':'#16a34a','Nghiên cứu':'#2563eb','Bài kiểm tra':'#d97706','Presales':'#7c3aed','Khóa học':'#db2777','Infographic':'#0891b2','Bản đồ giải pháp':'#0b5cad','BOM':'#e11d48','Công cụ':'#0f766e'};
const firstTok=v=>norm(v).split(/[ (\/]/)[0];
let HUBV={},DOCS=[],BOMS=[];
function prep(){FW.sol.forEach(s=>SOLBY[s.id]=s);FW.layers.forEach(l=>LAYBY[l.id]=l);
  DOCS=CAT.items.filter(i=>i.section==='sale-guide');BOMS=CAT.items.filter(i=>i.kind==='bom');
  CAT.vendors.forEach(v=>HUBV[firstTok(v.name)]=v)}
const hubVendor=name=>HUBV[firstTok(name)]||(/easy nac|infoexpress/i.test(name)?HUBV.infoexpress:null);
const docsOf=(solId,vendor)=>DOCS.filter(d=>solOfDoc(d)===solId&&(!vendor||firstTok(d.vendor)===firstTok(vendor)||(/infoexpress/i.test(d.vendor)&&/easy nac|infoexpress/i.test(vendor))));
const isNts=row=>row[2].includes('nts');

/* ---------- dựng cây ---------- */
const VIEWS=[['nist','Theo NIST CSF 2.0'],['layer','Theo lớp kỹ thuật'],['hub','Hãng trong PM Hub'],['az','Tất cả hãng A–Z'],['dist','Theo nhà phân phối'],['site','Nội dung PM Hub']];
let uid=0;
const N=(t,type,c,x)=>Object.assign({id:'n'+(uid++),t,type,c,ch:[]},x||{});
const docNode=d=>N(d.title,'doc',TYPEC[d.type]||'#64748b',{doc:d,sub:d.type});
function vendorNodes(s){const m=new Map();s.v.forEach(r=>{const k=r[0];if(!m.has(k))m.set(k,{name:k,prod:[],dist:new Set()});const o=m.get(k);o.prod.push(r[1]);r[2].forEach(d=>o.dist.add(d))});
  const docs=docsOf(s.id);const extra=[...new Set(docs.map(d=>d.vendor))].filter(v=>![...m.keys()].some(k=>firstTok(k)===firstTok(v)||(/infoexpress/i.test(v)&&/easy nac|infoexpress/i.test(k))));
  extra.forEach(v=>m.set(v,{name:v,prod:[],dist:new Set(['nts'])}));
  return [...m.values()].sort((a,b)=>(b.dist.has('nts')-a.dist.has('nts'))||a.name.localeCompare(b.name)).map(o=>{const n=N(o.name,'vendor',o.dist.has('nts')?'#f37021':'#64748b',{vendor:o.name,sol:s.id,prod:o.prod.join(' · '),dist:[...o.dist],nts:o.dist.has('nts')});

  const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="ov-card"><div class="ov-h"><b>Ảnh chụp sơ đồ</b><span>${fn} · ${Math.round(blob.size/1024)} KB</span><button class="p-x" data-x aria-label="Đóng">${icon('x')}</button></div><div class="ov-img"><img src="${url}" alt="Ảnh chụp sơ đồ"></div><div class="ov-f">${canShare?`<button class="tb" data-sh>Chia sẻ</button>`:''}<button class="tb" data-cp>Sao chép ảnh</button><a class="tb pri" href="${url}" download="${fn}">${icon('download')}Tải ảnh PNG</a></div></div>`;
  document.body.appendChild(o);o.onclick=async e=>{if(e.target===o||e.target.closest('[data-x]')){o.remove();URL.revokeObjectURL(url)}else if(e.target.closest('[data-sh]')){try{await navigator.share({files:[file()],title:'Mindmap PM Hub'})}catch(err){}}else if(e.target.closest('[data-cp]')){try{await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);toast('Đã sao chép ảnh')}catch(err){toast('Trình duyệt không cho sao chép ảnh – hãy dùng Tải ảnh')}}}}
$('#bShot').onclick=e=>{let m=$('#shotMenu');if(m){m.remove();return}m=document.createElement('div');m.id='shotMenu';m.className='menu';m.innerHTML=`<button data-s="v">${icon('eye')}Vùng đang xem</button><button data-s="f">${icon('mind')}Toàn bộ sơ đồ đang mở</button>`;document.body.appendChild(m);
  const r=e.currentTarget.getBoundingClientRect();m.style.top=(r.bottom+6)+'px';m.style.left=Math.max(8,Math.min(r.right-230,innerWidth-238))+'px';
  m.onclick=ev=>{const b=ev.target.closest('[data-s]');if(!b)return;m.remove();exportPng(b.dataset.s==='f')};
  setTimeout(()=>document.addEventListener('pointerdown',function f(ev){if(!ev.target.closest('#shotMenu')){m.remove();document.removeEventListener('pointerdown',f)}}),0)};

/* ---------- khởi động ---------- */
(async()=>{try{const [fw,cat]=await Promise.all([fetch('framework.json').then(r=>r.json()),fetch('../../data/catalog.json').then(r=>r.json())]);FW=fw;CAT=cat;prep();$('#load').remove();
    setView(VIEWS.some(v=>v[0]===M.view)?M.view:'nist');
    const hq=new URLSearchParams(location.hash.slice(1)).get('q');if(hq){$('#q').value=hq;search(hq)}
    fetch('../../data/search-index.json').then(r=>r.json()).then(d=>IDX=d).catch(()=>{});
    addEventListener('resize',()=>{apply()});
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{draw()});
  }catch(e){$('#load').textContent='Không tải được dữ liệu sơ đồ. Hãy mở trang này từ PM Hub.'}})();
</script>
</body>
</html>
