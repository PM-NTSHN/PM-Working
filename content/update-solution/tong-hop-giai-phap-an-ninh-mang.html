S({
id:'patch',g:'sw',no:35,folder:'35. Patch Management - Quan ly ban va',abbr:'Patch Management',
name:'Giải pháp quản lý bản vá và an ninh an toàn – Patch Management',layer:'Endpoint, máy chủ & workload',csf:['PR','ID'],
nts:'HCLSoftware BigFix Patch (BigFix Lifecycle/Compliance), SecPod SanerNow Patch, Qualys Patch Management',
list2:[[2,'Giải pháp quản lý bản vá và an ninh an toàn','HCLSoftware','BigFix Patch']],
src:{f:'Phát hiện, tải, kiểm thử, phân phối và xác nhận cài đặt bản vá cho hệ điều hành và ứng dụng trên máy chủ, máy trạm; báo cáo tuân thủ bản vá'},
what:`<p><b>Patch Management</b> tự động hoá vòng đời vá lỗi: <b>kiểm kê</b> phần mềm & bản vá thiếu → <b>tải & kiểm thử</b> → <b>triển khai theo lịch/ nhóm</b> (có cửa sổ bảo trì, khởi động lại có kiểm soát) → <b>xác minh</b> cài đặt thành công → <b>báo cáo</b> tuân thủ. Đây là "cánh tay thực thi" của quản lý lỗ hổng (VM – mục 20): VM tìm lỗ hổng, patch management khắc phục. NIST SP 800-40r4 coi vá lỗi là hoạt động bảo trì phòng ngừa bắt buộc.</p>
<p><b>HCL BigFix</b> (trước đây IBM BigFix) dùng <b>một agent nhẹ</b> trên mỗi thiết bị, tự đánh giá trạng thái theo "Fixlet" và báo về máy chủ; một máy chủ BigFix quản lý tới <b>~300.000 thiết bị</b>, hỗ trợ gần <b>100 hệ điều hành</b> (Windows, Linux nhiều distro, UNIX AIX/Solaris/HP-UX, macOS) và hàng trăm ứng dụng bên thứ ba; hãng công bố tỷ lệ vá thành công lần đầu <b>≥98%</b>. Kiến trúc relay phân tầng phù hợp mạng phân tán băng thông thấp và hỗ trợ môi trường cô lập (air-gapped).</p>`,
feat:['Kiểm kê tự động phần cứng/ phần mềm, phát hiện bản vá thiếu theo thời gian thực (agent tự đánh giá).','Vá đa nền tảng: Windows, Linux (RHEL, SUSE, Ubuntu, Oracle, Debian…), UNIX (AIX, Solaris, HP-UX), macOS; máy chủ vật lý, VM, cloud.','Vá ứng dụng bên thứ ba (trình duyệt, Java, Adobe, 7-Zip, Zoom…), nội dung patch do hãng kiểm thử sẵn.','Chính sách triển khai: nhóm thử nghiệm → triển khai diện rộng (ring), cửa sổ bảo trì, kiểm soát khởi động lại, rollback.','Hạ tầng relay/ phân phối nội dung tiết kiệm băng thông, hỗ trợ site xa, thiết bị roaming qua Internet.','Hỗ trợ môi trường cô lập: chuyển nội dung bản vá qua công cụ air-gap.','Báo cáo tuân thủ bản vá, SLA, dashboard; tích hợp kết quả quét VM (Tenable/Qualys) để vá theo CVE.','Mở rộng: cấu hình an toàn (BigFix Compliance – CIS/STIG), phân phối phần mềm, điều khiển từ xa (BigFix Lifecycle).'],
pain:['Hàng nghìn máy chủ/ máy trạm đa hệ điều hành; vá thủ công hoặc WSUS chỉ phủ Windows của Microsoft.','Ứng dụng bên thứ ba (Java, Adobe, trình duyệt) là nguồn lỗ hổng lớn nhưng không ai vá.','Đơn vị phân tán, đường truyền thấp, máy không ra Internet.','Không có báo cáo chứng minh đã vá theo yêu cầu kiểm tra ATTT.'],
risk:['Bị khai thác lỗ hổng đã có bản vá từ lâu – nguyên nhân phổ biến nhất của ransomware.','Vá vội gây lỗi dịch vụ vì không kiểm thử/ không có rollback.','Không đạt yêu cầu khắc phục lỗ hổng theo thời hạn của cơ quan quản lý.'],
uc:[['Vá khẩn cấp lỗ hổng nghiêm trọng toàn hệ thống','Ngay khi có bản vá cho lỗ hổng đang bị khai thác, BigFix xác định 2.300 máy bị ảnh hưởng trong vài phút và triển khai theo nhóm thử nghiệm → diện rộng trong 24h.'],
['Vá máy chủ Linux/ UNIX lõi','Máy chủ AIX/ RHEL chạy CSDL được vá trong cửa sổ bảo trì, có kiểm tra trước/ sau và báo cáo.'],
['Đơn vị địa phương băng thông thấp','Relay tại tỉnh tải bản vá một lần rồi phân phối nội bộ.'],
['Vòng khép kín VM → Patch','Kết quả quét Qualys/Tenable được nhập vào để vá đúng CVE ưu tiên, quét lại xác minh.']],
tech:[['Agent-based patch management','Agent tự đánh giá & thực thi.','HCL BigFix, Microsoft Intune/ConfigMgr, Ivanti, ManageEngine Patch Manager Plus, Tanium'],
['Cloud-native patch','Quản lý qua cloud.','Automox, NinjaOne, SecPod SanerNow, Qualys Patch Management, CrowdStrike Falcon for IT'],
['Third-party patch catalog','Danh mục bản vá ứng dụng bên thứ ba đã kiểm thử.','BigFix, Ivanti, Patch My PC, ManageEngine'],
['Linux/UNIX patch','Vá hệ điều hành máy chủ.','BigFix, Red Hat Satellite, SUSE Manager, Ansible'],
['Risk-based remediation','Vá theo rủi ro CVE.','BigFix Insights for Vulnerability Remediation, Tanium, Qualys']],
dia:{cols:[[{t:'Nguồn bản vá',s:'Microsoft · Linux · 3rd-party',k:'ext'}],[{t:'BigFix Server',s:'Fixlet · Chính sách · Báo cáo',k:'hl'}],[{t:'Relay (DC / tỉnh)',s:'Phân phối nội dung',k:'hl'}],[{t:'Agent trên thiết bị',s:'Windows · Linux · UNIX · macOS',k:'hl'}]],ctl:{t:'VM scanner (Qualys/Tenable) · ITSM · SIEM',s:'Nhận CVE ưu tiên, ticket thay đổi',to:[1]}},
model:`<p><b>Nguyên lý:</b> Agent trên mỗi máy liên tục đánh giá trạng thái theo các Fixlet (điều kiện áp dụng) và báo về server → quản trị chọn bản vá và nhóm đích → lệnh được đẩy xuống, agent tải nội dung từ relay gần nhất → cài đặt theo lịch, khởi động lại theo chính sách → báo cáo kết quả gần real-time.</p>
<ul><li>Kiến trúc: Server (+ DB) tại DC chính, DR; relay phân tầng theo site; relay trên Internet (DMZ) cho máy roaming.</li><li>Môi trường cô lập: tải nội dung ở mạng ngoài, chuyển vào qua công cụ air-gap (có thể kết hợp BSG/diode + quét file).</li></ul>`,
lic:{gen:['Theo <b>số thiết bị được quản lý</b> (client device, managed server/ virtual server tính riêng) – subscription hoặc perpetual + S&S.','Phân gói: Patch → Lifecycle (thêm phân phối phần mềm, remote control, OS deploy) → Compliance (cấu hình CIS/STIG) → Workspace.','Cloud-native: theo endpoint/ tháng.'],
v:[['HCL BigFix Patch','Theo số thiết bị quản lý (client device / managed server / virtual server), term hoặc perpetual + Software Subscription & Support; nâng cấp lên BigFix Lifecycle/Compliance.','NTS phân phối – theo list',1],['SecPod SanerNow (Patch)','Trong gói CVEM theo thiết bị.','NTS phân phối',1],['Qualys Patch Management','Theo asset, module trên Qualys Cloud Agent.','NTS phân phối',1],['Microsoft Intune / ConfigMgr','Theo user (M365 E3/E5) – chủ yếu Windows.','',0],['Ivanti Neurons for Patch','Theo endpoint.','',0],['ManageEngine Patch Manager Plus','Theo số máy (gói Professional/Enterprise).','',0]]},
pre:[['Danh mục','Số lượng thiết bị theo OS/ phiên bản, site, băng thông giữa các site, máy cô lập.'],['Hạ tầng','Máy chủ BigFix (Windows/Linux) + DB (SQL Server/DB2), relay tại site; mở cổng agent ↔ relay ↔ server.'],['Quy trình','Chính sách vá (nhóm thử nghiệm, SLA theo mức độ), cửa sổ bảo trì, change management, rollback.'],['Tích hợp','Kết quả VM, ITSM, AD để nhóm máy.']],
mkt:{rank:`<p>Không có MQ riêng cho patch management (Gartner xếp vào Unified Endpoint Management/ Exposure Management). Hãng tiêu biểu: <b>Microsoft (Intune/ConfigMgr), HCL BigFix, Ivanti, Tanium, ManageEngine</b>, Automox, NinjaOne, Qualys, SecPod. BigFix mạnh đặc biệt ở <b>đa hệ điều hành (kể cả UNIX)</b> và quy mô rất lớn – phổ biến ở ngân hàng, viễn thông, chính phủ.</p>`,
v:[['HCLSoftware','BigFix','Đa nền tảng, quy mô lớn – NTS phân phối'],['Microsoft','Intune / ConfigMgr','Windows'],['Tanium','Tanium Patch','Real-time, quy mô lớn'],['Ivanti','Neurons for Patch Management',''],['ManageEngine','Patch Manager Plus','Giá tốt'],['SecPod / Qualys','SanerNow / Patch Management','VM + Patch – NTS phân phối']]},
cmp:{h:['Tiêu chí','HCL BigFix','Microsoft ConfigMgr/Intune','Tanium','SecPod SanerNow'],r:[['Hệ điều hành','~100 OS gồm AIX, Solaris, HP-UX','Windows (Linux/macOS hạn chế)','Windows/Linux/macOS','Windows/Linux/macOS'],['Ứng dụng bên thứ ba','Hàng trăm, đã kiểm thử','Hạn chế (cần bổ sung)','Có','Có'],['Quy mô 1 server','~300.000 thiết bị','Lớn','Rất lớn','Lớn'],['Air-gapped','Có','Có (ConfigMgr)','Có','Có (on-prem)'],['Chi phí','TB–Cao','Thấp nếu đã có M365','Cao','Thấp–TB']]},

S({
id:'bas',g:'sw',no:36,folder:'36. BAS - Breach and Attack Simulation',abbr:'BAS',
name:'Phần mềm giả lập vi phạm tấn công – Breach & Attack Simulation (BAS)',layer:'Kiểm chứng an ninh liên tục',csf:['ID','DE','PR'],
nts:'Picus Security Validation Platform (PL-OnPrm-AG-T2), Pentera (kiểm thử xâm nhập tự động)',
list2:[[10,'Phần mềm giả lập vi phạm tấn công (BAS)','Picus','PL-OnPrm-AG-T2']],
src:{f:'Giả lập an toàn các kỹ thuật tấn công thực tế để đo lường, kiểm chứng hiệu quả của các biện pháp bảo vệ (FW, IPS, WAF, EDR, email, SIEM) và đề xuất khắc phục'},
what:`<p><b>BAS (Breach & Attack Simulation)</b> chạy <b>liên tục và an toàn</b> các kịch bản tấn công thật (theo MITRE ATT&CK: mã độc, ransomware, khai thác web, exfiltration, di chuyển ngang…) giữa các <b>agent giả lập</b> đặt trong hệ thống, để trả lời câu hỏi lãnh đạo hay hỏi: <i>"Các thiết bị bảo mật đã đầu tư có thật sự chặn/ phát hiện được tấn công không?"</i>. Kết quả là điểm phòng ngừa (prevention score), điểm phát hiện (detection score) theo từng công cụ, danh sách khoảng trống và <b>khuyến nghị khắc phục cụ thể theo từng hãng</b> (chữ ký, rule SIEM/EDR).</p>
<p>Gartner xếp BAS cùng automated pentest vào nhóm <b>Adversarial Exposure Validation</b> thuộc chương trình CTEM. <b>Picus Security Validation Platform</b> gồm: Security Control Validation (BAS), Attack Path Validation (pentest tự động), Detection Rule Validation (kiểm tra rule SIEM/EDR), Cloud Security Validation; thư viện <b>31.000+ mối đe doạ/TTP</b>, 75+ tích hợp API; có bản <b>on-premises</b> cho môi trường không cho dữ liệu ra ngoài (mã PL-OnPrm-AG-T2: bản on-prem, gói agent tier 2 – cần xác nhận phạm vi với Picus).</p>`,
feat:['Thư viện mối đe doạ lớn, cập nhật hằng ngày theo chiến dịch mới (ransomware, APT), ánh xạ MITRE ATT&CK.','Giả lập theo vector: mạng (IPS/NGFW), web (WAF), email gateway, endpoint (EDR/AV), data exfiltration (DLP), URL filtering.','Đo hai chiều: <b>prevention</b> (bị chặn chưa) và <b>detection</b> (SIEM/EDR có log/ cảnh báo không – qua tích hợp API).','Thư viện khắc phục theo hãng (vendor-specific mitigation): chữ ký/ rule sẵn sàng áp dụng cho các NGFW, IPS, WAF, EDR, SIEM phổ biến.','Attack Path Validation: tìm đường leo thang tới domain admin/ tài sản quan trọng.','Detection Rule Validation: phân tích rule SIEM không kích hoạt, log thiếu.','Lập lịch chạy liên tục, so sánh xu hướng; báo cáo điều hành (điểm số theo thời gian).','Agent đa nền tảng (Windows/Linux/macOS), triển khai SaaS hoặc on-prem, an toàn cho môi trường sản xuất (không phá huỷ).'],
pain:['Đầu tư nhiều lớp bảo mật nhưng không biết thực tế chặn được bao nhiêu; cấu hình trôi dạt (drift) sau nâng cấp.','Pentest/ red team chỉ làm 1–2 lần/năm, kết quả nhanh lỗi thời.','SOC không biết rule SIEM/EDR có hoạt động khi có tấn công thật.','Khó chứng minh hiệu quả đầu tư ATTT với lãnh đạo.'],
risk:['Lỗ hổng phòng thủ (rule tắt, chữ ký thiếu, log không về SIEM) chỉ lộ ra khi bị tấn công thật.','Lãng phí ngân sách vào công cụ không phát huy tác dụng.','Không đáp ứng yêu cầu kiểm tra, đánh giá định kỳ theo mô hình 4 lớp.'],
uc:[['Kiểm chứng NGFW/IPS/WAF sau mỗi lần thay đổi','Chạy lại bộ kịch bản sau khi đổi chính sách: phát hiện IPS profile vùng DMZ bị tắt nhầm, prevention score giảm từ 82% xuống 61%.'],

    b.sl.forEach(l=>{svg+=`<text class="dg-s" x="${p.x+p.w/2}" y="${ty}" text-anchor="middle">${esc(l)}</text>`;ty+=14})});
  return `<div class="diagram"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sơ đồ mô hình triển khai"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b5cad"/></marker></defs>${svg}</svg>
  <div class="dg-legend"><span><i style="background:color-mix(in srgb,#0b5cad 20%,transparent);border:2px solid #0b5cad"></i>Thành phần của giải pháp</span><span><i style="border:1.5px dashed var(--faint)"></i>Bên ngoài / nguồn</span><span><i style="background:color-mix(in srgb,#f37021 15%,transparent);border:1.5px solid #f37021"></i>Quản trị / tích hợp</span>${d.note?`<span>${icon('info')} ${esc(d.note)}</span>`:''}</div></div>`;
}

const ul=a=>'<ul>'+a.map(x=>`<li>${x}</li>`).join('')+'</ul>';
function table(h,rows,b0=true){return `<div class="tbl-wrap"><table class="tbl"><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+r.map((c,i)=>`<td${i===0&&b0?' class="b0"':''}>${c}</td>`).join('')+'</tr>').join('')}</tbody></table></div>`}
const ntsBadge=t=>`<span class="badge nts-badge">${icon('check')}${esc(t||'NTS phân phối')}</span>`;
function secBody(s,k){
  switch(k){
  case 'what':return (s.src.f?`<div class="src-note">${icon('file')}<div><b>Theo file nguồn – Chức năng chính:</b> ${esc(s.src.f)}</div></div>`:'')+`<div class="card sec-card">${s.what}</div>`;
  case 'feat':return `<ul class="feat-list">${s.feat.map(f=>`<li><span class="ck">${icon('check')}</span><span>${f}</span></li>`).join('')}</ul>`;
  case 'pain':return `<div class="pain-grid"><div class="pain-box" style="--t:#d97706"><div class="pb-h">${icon('target')}Bài toán / painpoint thực tế</div>${ul(s.pain)}</div><div class="pain-box" style="--t:#e11d48"><div class="pb-h">${icon('alert')}Thách thức / rủi ro nếu không có</div>${ul(s.risk)}</div></div>`;
  case 'uc':return `<div class="uc-grid">${s.uc.map((u,i)=>`<div class="uc-card"><div class="dc-top"><span class="dc-ic" style="--t:var(--c)">${icon('target')}</span><span class="dc-type" style="--t:var(--c)">Use case ${pad(i+1)}</span></div><b>${u[0]}</b><p>${u[1]}</p></div>`).join('')}</div>`;
  case 'tech':return table(['Công nghệ','Mô tả','Hãng / giải pháp tiêu biểu'],s.tech);
  case 'model':return diagram(s.dia)+`<div class="card sec-card">${s.model}</div>`;
  case 'lic':return `<div class="card sec-card"><h4>Cách tính chung</h4>${ul(s.lic.gen)}<h4>Theo từng hãng — ưu tiên hãng NTS Hà Nội phân phối</h4>`+table(['Hãng / sản phẩm','Mô hình license','Ghi chú'],[...s.lic.v].sort((a,b)=>b[3]-a[3]).map(v=>[esc(v[0]),v[1],v[3]?ntsBadge(v[2]):esc(v[2]||'')]))+`<p class="note">${icon('info')}Mô hình license mang tính tham khảo presales; SKU, giá và điều kiện cụ thể cần xác nhận với hãng/nhà phân phối tại thời điểm báo giá.</p></div>`;
  case 'pre':return (s.src.d?`<div class="src-note">${icon('file')}<div><b>Nguyên tắc triển khai theo file nguồn:</b> ${esc(s.src.d)}</div></div>`:'')+table(['Hạng mục','Khách hàng cần chuẩn bị'],s.pre);
  case 'mkt':return `<div class="card sec-card">${s.mkt.rank}</div>`+table(['Hãng','Sản phẩm / giải pháp','Vị trí / ghi chú'],s.mkt.v.map(v=>[esc(v[0]),esc(v[1]),/NTS/.test(v[2])?esc(v[2].replace(/\s*[–-]?\s*NTS phân phối/,''))+' '+ntsBadge('NTS phân phối'):esc(v[2])]));
  case 'cmp':return table(s.cmp.h,s.cmp.r)+`<p class="note">${icon('info')}Tổng hợp từ tài liệu hãng, báo cáo phân tích và kinh nghiệm triển khai; dùng định hướng tư vấn, không thay thế PoC.</p>`;
  case 'spec':{if(!s.spec)return '<div class="empty">Chưa có techspec</div>';const K={base:['Tiêu chuẩn','#5a6a82'],adv:['Nâng cao','#0b5cad'],uniq:['Riêng có / khác biệt','#f37021']};
    return `<div class="card sec-card"><h4>A. Tính năng chung mà giải pháp ${esc(s.abbr)} phải hỗ trợ (tiêu chí tối thiểu)</h4>`+table(['Nhóm tiêu chí','Yêu cầu kỹ thuật'],s.spec.gen.map(g=>[esc(g[0]),g[1]]))+`<h4>B. Spec riêng của giải pháp NTS Hà Nội phân phối</h4><p class="muted" style="margin:0 0 8px;font-size:13px"><span class="badge" style="--c:#5a6a82">Tiêu chuẩn</span> thông số/ phạm vi sản phẩm · <span class="badge" style="--c:#0b5cad">Nâng cao</span> vượt mức tối thiểu · <span class="badge" style="--c:#f37021">Riêng có / khác biệt</span> điểm mạnh khó đáp ứng bởi đối thủ</p>`+
    s.spec.v.map(v=>`<div class="spec-prod"><div class="sp-h">${icon('shield')}<b>${esc(v.p)}</b></div>`+table(['Loại','Thông số / tính năng'],v.r.map(x=>[`<span class="badge" style="--c:${K[x[0]][1]}">${K[x[0]][0]}</span>`,x[1]]),false)+`</div>`).join('')+
    `<p class="note">${icon('info')}Khi đưa vào HSMT/ chỉ dẫn kỹ thuật: không nêu tên nhãn hiệu, không đặt tiêu chí nhằm hạn chế cạnh tranh (Luật Đấu thầu 2023); các tiêu chí "Riêng có" dùng để tư vấn, thuyết minh giải pháp và bảng so sánh, nên diễn đạt theo yêu cầu chức năng/ hiệu năng có thể kiểm chứng. Thông số cần đối chiếu datasheet/ xác nhận hãng tại thời điểm chào giá.</p></div>`;}
  case 'ref':{const fl=DOCS.filter(d=>d[0]===s.folder);
    return `<h4 style="margin:0 0 10px;font-size:14px">Tài liệu đã tải về thư mục <code>${esc(s.folder)}</code> (${fl.length})</h4>`+(fl.length?`<div class="doc-grid flat">${fl.map(docCard).join('')}</div>`:'<div class="empty">Chưa có tài liệu</div>')+
    `<h4 style="margin:18px 0 6px;font-size:14px">Nguồn tham chiếu trực tuyến</h4><div class="card ref-list" style="padding:6px">${s.ref.map(r=>`<a href="${esc(r[1])}" target="_blank" rel="noopener"><span class="r-icon">${icon('link')}</span><span style="flex:1;min-width:0"><b>${r[0]}</b><span>${esc(host(r[1]))}</span></span>${icon('external','go')}</a>`).join('')}</div>`;}
  }
}
function docCard(d){const nist=/^NIST|^NSA/.test(d[1]);const t=nist?'#0891b2':'#e11d48';return `<a class="doc-card" style="--t:${t}" href="${d[3]||docHref(d[0],d[1])}" target="_blank" rel="noopener"><div class="dc-top"><span class="dc-ic">${icon('file')}</span><span class="dc-type">${nist?'Chuẩn / hướng dẫn':'Datasheet hãng'} · PDF</span>${icon('external','go')}</div><b>${esc(d[1].replace(/\.pdf$/i,'').replace(/-/g,' '))}</b><div class="dc-meta"><span>${fsize(d[2])}</span><span>·</span><span class="srcu" data-u="${esc(d[3])}">${esc(host(d[3]))} ↗</span></div></a>`}

const IDX=[];
SOL.forEach(s=>{IDX.push({s:s.id,k:'_',t:'Tên giải pháp',txt:norm(s.name+' '+s.abbr+' '+s.nts+' '+s.layer),raw:s.name+' — '+s.nts});
  SECS.forEach(([k,lbl])=>{const raw=strip(secBody(s,k));IDX.push({s:s.id,k,t:lbl,txt:norm(raw),raw})})});
function search(q){const qn=norm(q).trim();if(qn.length<2)return[];const terms=qn.split(/\s+/);const out=[];
  IDX.forEach(e=>{if(terms.every(t=>e.txt.includes(t))){let sc=0;terms.forEach(t=>sc+=e.txt.split(t).length-1);if(e.k==='_')sc+=50;if(norm(byId[e.s].abbr+' '+byId[e.s].name).includes(qn))sc+=30;out.push({...e,sc})}});
  return out.sort((a,b)=>b.sc-a.sc).slice(0,40)}
function hl(html,q){const terms=norm(q).trim().split(/\s+/).filter(x=>x.length>1);if(!terms.length)return html;
  return html.replace(/(^|>)([^<]+)(?=<|$)/g,(m,a,txt)=>{const n=norm(txt);const mk=[];terms.forEach(t=>{let i=0;while((i=n.indexOf(t,i))>-1){mk.push([i,i+t.length]);i+=t.length}});if(!mk.length)return m;mk.sort((x,y)=>x[0]-y[0]);let r='',p=0;mk.forEach(([s,e])=>{if(s<p)return;r+=txt.slice(p,s)+'<mark>'+txt.slice(s,e)+'</mark>';p=e});return a+r+txt.slice(p)})}
function snippet(raw,q){const rn=norm(raw),t=norm(q).trim().split(/\s+/)[0];let i=Math.max(0,rn.indexOf(t));const st=Math.max(0,i-60),en=Math.min(raw.length,i+160);return hl(esc((st?'…':'')+raw.slice(st,en)+(en<raw.length?'…':'')),q)}
let res=[],sel=0,activeInput=null,pendingHL=null;
const pop=$('#pop');
function placePop(inp){const host=inp.closest('label')||inp;const r=host.getBoundingClientRect();const w=Math.min(620,innerWidth-16);pop.style.width=w+'px';pop.style.top=(r.bottom+8)+'px';pop.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+'px'}
function runSearch(inp){activeInput=inp;const q=inp.value;res=search(q);sel=0;
  if(norm(q).trim().length<2){pop.hidden=true;return}
  const groups={};res.forEach((r,i)=>{(groups[r.s]=groups[r.s]||[]).push([r,i])});
  let body='';Object.entries(groups).forEach(([sid,list])=>{const s=byId[sid],L=LAYER_OF[sid];body+=`<div class="pal-group"><span>${pad(s.no)}. ${esc(s.abbr)}</span><span>${list.length}</span></div>`+list.map(([r,i])=>{const sc=SECS.find(x=>x[0]===r.k);const c=sc?sc[4]:L[3];return `<div class="pal-item" data-i="${i}" style="--c:${c}"><span class="r-icon">${icon(sc?sc[3]:L[4])}</span><div class="r-main"><b>${esc(r.t)}</b><div class="r-meta">${esc(s.name)}</div><div class="snip">${snippet(r.raw,q)}</div></div><span class="enter">${icon('enter')}</span></div>`}).join('')});
  pop.innerHTML=`<div class="pal"><div class="pal-body">${res.length?body:`<div class="pal-empty">${icon('search')}<div>Không tìm thấy “${esc(q)}”. Thử từ khoá khác — không cần gõ dấu.</div></div>`}</div><div class="pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> chọn</span><span><kbd>Enter</kbd> mở</span><span><kbd>Esc</kbd> đóng</span><span class="right">${res.length} kết quả · ${Object.keys(groups).length} giải pháp</span></div></div>`;
  placePop(inp);pop.hidden=false;markSel();
  pop.querySelectorAll('.pal-item').forEach(el=>{el.onclick=()=>openRes(+el.dataset.i);el.onmouseenter=()=>{sel=+el.dataset.i;markSel()}})}
function markSel(){pop.querySelectorAll('.pal-item').forEach(el=>{const on=+el.dataset.i===sel;el.classList.toggle('sel',on);if(on){const b=pop.querySelector('.pal-body');if(el.offsetTop<b.scrollTop||el.offsetTop+el.offsetHeight>b.scrollTop+b.clientHeight)b.scrollTop=el.offsetTop-60}})}
function openRes(i){const r=res[i];if(!r)return;pop.hidden=true;pendingHL=activeInput.value;activeInput.blur();go('#/s/'+r.s+(r.k!=='_'?'/'+r.k:''))}
function bindSearch(inp){inp.addEventListener('input',()=>runSearch(inp));inp.addEventListener('focus',()=>{if(inp.value.trim().length>1)runSearch(inp)});
  inp.addEventListener('keydown',e=>{if(pop.hidden)return;if(e.key==='ArrowDown'){sel=Math.min(res.length-1,sel+1);markSel();e.preventDefault()}else if(e.key==='ArrowUp'){sel=Math.max(0,sel-1);markSel();e.preventDefault()}else if(e.key==='Enter'){openRes(sel)}else if(e.key==='Escape'){pop.hidden=true;inp.blur()}})}
bindSearch($('#q'));
document.addEventListener('click',e=>{if(!e.target.closest('#pop')&&!e.target.closest('.top-search')&&!e.target.closest('.hero-search'))pop.hidden=true});

addEventListener('resize',()=>{if(!pop.hidden&&activeInput)placePop(activeInput)});

  <div class="src-note">${icon('info')}<div><b>Lưu ý:</b> xếp hạng thị trường theo công bố công khai của Gartner/Forrester/hãng tại thời điểm tổng hợp (${BUILD.date}); mô hình license là tham khảo presales – xác nhận với hãng trước khi báo giá hoặc đưa vào HSDT.</div></div></div>`;
  view.scrollTop=0;crumbs(['Hướng dẫn']);$('#topActions').innerHTML='';
}

function curRoute(){return location.hash||'#/'}
function route(){
  const p=curRoute().replace(/^#\/?/,'').split('/');pop.hidden=true;closeDrawer();
  if(p[0]==='s')renderSol(p[1],p[2]);
  else{state.cur=null;if(p[0]==='matrix')renderMatrix();else if(p[0]==='docs')renderDocs();else if(p[0]==='guide')renderGuide();else renderHome()}
  setNavActive();
}
renderNav();addEventListener('hashchange',route);route();
</script>
