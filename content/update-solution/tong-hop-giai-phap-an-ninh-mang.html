S({
id:'hsm',g:'hw',no:8,folder:'08. HSM - Hardware Security Module',abbr:'HSM',
name:'Thiết bị Hardware Security Module – HSM',layer:'Mật mã & khoá',csf:['PR'],
nts:'(Chưa có hãng HSM chuyên dụng trong danh mục NTS – đề xuất hợp tác Thales/Entrust/Utimaco; Penta Security D\'Amo KMS cho quản lý khoá phần mềm)',
src:{f:'Sinh, lưu trữ và bảo vệ khóa mật mã; thực hiện các phép toán mật mã; bảo vệ khóa ký, khóa mã hóa và các thông tin xác thực quan trọng',d:'Triển khai theo cụm HA; khóa mật mã không được lưu trữ dạng rõ ngoài vùng bảo vệ của thiết bị'},
what:`<p><b>HSM</b> là thiết bị phần cứng chống can thiệp vật lý (tamper-resistant), được chứng nhận <b>FIPS 140-2/140-3 Level 3</b> (hoặc Common Criteria EAL4+), dùng để <b>sinh, lưu trữ và sử dụng khoá mật mã bên trong ranh giới bảo vệ</b>. Khoá riêng không bao giờ rời HSM dưới dạng rõ; ứng dụng chỉ gửi dữ liệu vào để HSM thực hiện ký, giải mã, sinh số ngẫu nhiên… và nhận kết quả. Khi phát hiện can thiệp vật lý, HSM tự xoá khoá (zeroization).</p>
<p>HSM là "gốc tin cậy" (root of trust) cho: hạ tầng PKI/CA (khoá ký chứng thư), chữ ký số, định danh điện tử (ký token/JWT, ký dữ liệu VNeID), thanh toán (PIN, EMV – payment HSM), mã hoá CSDL (TDE master key), KMS, code signing, DNSSEC.</p>
<p><b>Lưu ý pháp lý tại Việt Nam:</b> HSM và thiết bị mã hoá là <b>sản phẩm mật mã dân sự</b>; kinh doanh/nhập khẩu cần giấy phép của Ban Cơ yếu Chính phủ (Nghị định 58/2016/NĐ-CP, sửa đổi bởi NĐ 53/2018). Hệ thống chuyên dùng của Chính phủ có thể yêu cầu sản phẩm mật mã do Ban Cơ yếu cung cấp/chứng nhận.</p>`,
feat:['Sinh khoá với bộ sinh số ngẫu nhiên thật (TRNG), lưu trữ khoá trong vùng bảo vệ phần cứng.','Thuật toán: RSA (2048–4096+), ECC (P-256/384/521, Ed25519), AES, 3DES, SHA-2/3, HMAC; <b>hậu lượng tử (PQC)</b> ML-KEM, ML-DSA (FIPS 203/204) trên firmware mới.','API chuẩn: PKCS#11, Microsoft CNG/KSP, Java JCE, OpenSSL engine/provider, KMIP, REST.','Phân quyền M-of-N (quorum) bằng thẻ/khoá vật lý cho thao tác nhạy cảm; vai trò Security Officer/Crypto Officer/User tách biệt.','Phân vùng (partition) logic cho nhiều ứng dụng/tenant; hiệu năng hàng nghìn–chục nghìn chữ ký RSA/ECC mỗi giây.','HA/load-balancing nhiều HSM, sao lưu khoá an toàn (backup HSM, key wrapping), nhân bản giữa DC chính và DR.','Nhật ký kiểm toán có chữ ký, tamper-evident; giám sát SNMP/syslog.','Dạng: network HSM (appliance), PCIe card, USB token, Cloud HSM / HSM-as-a-Service.'],
pain:['Khoá ký của hệ thống định danh/CA nếu lưu trên file/phần mềm có thể bị sao chép khi máy chủ bị xâm nhập.','Yêu cầu tuân thủ: chữ ký số (Luật Giao dịch điện tử 2023, NĐ 130/2018 → NĐ mới), PCI DSS, eIDAS, FIPS.','Hiệu năng ký số lớn (hàng triệu giao dịch xác thực/ngày) vượt khả năng phần mềm an toàn.','Quản lý khoá phân tán, không biết ai đã dùng khoá nào, khi nào.'],
risk:['Lộ khoá ký gốc → kẻ tấn công giả mạo token/chứng thư, mất toàn bộ niềm tin hệ thống (phải thu hồi & phát hành lại toàn bộ).','Không chứng minh được tính toàn vẹn/chống chối bỏ của giao dịch.','Vi phạm quy định mật mã & bảo vệ dữ liệu.'],
uc:[['Ký token định danh VNeID/eKYC','Khoá ký JWT/SAML của IdP nằm trong HSM; máy chủ IdP gọi PKCS#11 để ký, khoá không bao giờ ra ngoài.'],
['Hạ tầng CA chuyên dùng','Root CA offline + Sub CA online đều dùng HSM; nghi thức sinh khoá (key ceremony) với M-of-N.'],
['Mã hoá CSDL công dân (TDE)','Master key của Oracle TDE/SQL Server TDE lưu trong HSM; DBA không thể lấy khoá.'],
['Ký số văn bản/ hồ sơ điện tử','Remote signing (ký số từ xa) cho cán bộ, khoá người dùng nằm trong HSM theo chuẩn chứng nhận.'],
['Thanh toán','Payment HSM xử lý PIN/EMV cho cổng thanh toán.']],

dia:{cols:[[{t:'Ứng dụng',s:'IdP · CA · DB · Ký số',k:'ext'}],[{t:'Client HSM',s:'PKCS#11 · JCE · CNG · KMIP'}],[{t:'Cụm HSM – DC chính',s:'FIPS 140-3 L3 · HA',k:'hl'}],[{t:'HSM – DC dự phòng',s:'Replicate / Backup',k:'hl'}]],ctl:{t:'Quản trị: M-of-N · Audit log · SIEM',s:'Security Officer · thẻ quorum',to:[2,3]}},
model:`<p><b>Nguyên lý:</b> Ứng dụng xác thực với partition HSM qua kênh mã hoá (NTLS/TLS + chứng thư client) → gửi yêu cầu (ví dụ "ký dữ liệu X bằng khoá K") → HSM kiểm tra quyền, thực hiện phép toán bên trong và trả kết quả. Khoá chỉ có thể sao lưu ở dạng đã được bao gói (wrapped) bằng khoá của HSM khác cùng miền bảo mật.</p>
<ul><li><b>Cụm HA:</b> tối thiểu 2 HSM/DC chính + 1–2 HSM tại DR; client tự cân bằng tải/failover (HA group).</li><li><b>Root CA offline:</b> HSM riêng, không kết nối mạng, chỉ bật khi ký Sub CA/CRL.</li><li><b>Phân vùng theo ứng dụng:</b> mỗi hệ thống (IdP, CA, DB) một partition, chính sách khác nhau.</li><li><b>Quy trình:</b> key ceremony có biên bản, quay phim, nhiều người giữ thẻ; định kỳ xoay khoá.</li></ul>`,
lic:{gen:['Thường tính theo <b>model thiết bị</b> (hiệu năng ký RSA/ECC mỗi giây, số partition) + <b>license tính năng</b> (số partition bổ sung, thuật toán ECC/PQC, Korea/Japan algorithms, remote PED) + support năm.','Cloud HSM tính theo giờ/instance hoặc theo số khoá & số thao tác.','Không tính theo số người dùng cuối, nhưng một số giải pháp ký số từ xa tính theo số chứng thư/người ký.'],

S({
id:'nac',g:'hw',no:9,folder:'09. NAC - Network Access Control',abbr:'NAC',
name:'Thiết bị kiểm soát truy cập mạng – NAC',layer:'Truy cập nội bộ',csf:['ID','PR'],
nts:'InfoExpress Easy NAC (CyberGatekeeper)',
src:{f:'Kiểm soát thiết bị đầu cuối khi truy cập mạng; xác định danh tính, trạng thái tuân thủ và phân quyền truy cập theo chính sách',d:'Áp dụng cho mạng quản trị, mạng vận hành và các vùng nội bộ có yêu cầu kiểm soát truy cập'},
what:`<p><b>NAC</b> trả lời 3 câu hỏi trước khi cho một thiết bị vào mạng: <b>Ai/thiết bị gì?</b> (định danh, phân loại), <b>Có an toàn không?</b> (posture: AV đang chạy, đã vá, có trong danh mục tài sản), <b>Được vào đâu?</b> (gán VLAN/ACL/SGT theo chính sách). Thiết bị lạ hoặc không tuân thủ sẽ bị chặn, đưa vào vùng cách ly (quarantine/remediation) hoặc vùng khách.</p>
<p>Có 2 trường phái kỹ thuật: <b>802.1X/RADIUS</b> (Cisco ISE, Aruba ClearPass – mạnh nhưng phức tạp, cần switch hỗ trợ & cấu hình supplicant) và <b>agentless / out-of-band</b> (InfoExpress Easy NAC, Forescout – dùng ARP/DHCP/SNMP/API để phát hiện và chặn, triển khai nhanh, không phụ thuộc hãng switch). NAC là thành phần của kiến trúc Zero Trust (NIST SP 800-207).</p>`,
feat:['Phát hiện thiết bị theo thời gian thực (DHCP, ARP, SNMP, NetFlow, span) – kể cả IoT, máy in, camera, thiết bị OT.','Phân loại/fingerprint thiết bị (OS, hãng, loại); danh mục tài sản tự động.','Xác thực: 802.1X (EAP-TLS/PEAP), MAB, captive portal, tích hợp AD/LDAP/RADIUS; đăng ký thiết bị BYOD, cổng khách có phê duyệt.','Kiểm tra tuân thủ (posture): AV/EDR đang chạy, bản vá OS, firewall cá nhân, phần mềm cấm, mã hoá ổ đĩa.','Thực thi: gán VLAN động, dACL, chặn ARP (agentless), shutdown port, cách ly & hướng dẫn khắc phục.','Kiểm soát truy cập theo vai trò (RBAC) và theo thời gian; phân vùng micro-segmentation.','Tích hợp NGFW/SIEM/EDR/VM: nhận cảnh báo để cách ly tự động; chia sẻ ngữ cảnh user↔IP.','Báo cáo tuân thủ, lịch sử kết nối (ai, thiết bị nào, cổng nào, lúc nào).'],
pain:['Mạng quản trị/vận hành chỉ bảo vệ bằng mật khẩu Wi-Fi hoặc cổng mạng mở – ai cắm dây vào cũng có IP.','Không có danh mục đầy đủ thiết bị đang kết nối, nhiều IoT/thiết bị lạ.','Máy tính nhà thầu/đối tác không cài AV, chưa vá vẫn vào được mạng nội bộ.','Yêu cầu TCVN 11930 & Thông tư 12/2022: kiểm soát truy cập mạng, quản lý thiết bị đầu cuối.'],
risk:['Thiết bị giả mạo (rogue device, Raspberry Pi cài cắm) đánh cắp dữ liệu hoặc làm bàn đạp tấn công.','Máy không tuân thủ lây mã độc cho cả mạng.','Không truy vết được ai đã kết nối khi có sự cố.'],
uc:[['Kiểm soát mạng quản trị DC','Chỉ máy quản trị đã đăng ký, có EDR chạy và đăng nhập tài khoản AD nhóm "Admin-DC" mới được cấp VLAN quản trị; máy khác bị chặn ngay.'],
['Nhà thầu đến bảo trì','Laptop nhà thầu tự động vào VLAN khách có thời hạn 4 giờ, chỉ truy cập Internet và jump-host.'],
['Phát hiện thiết bị lạ cắm vào phòng máy','Easy NAC phát hiện MAC lạ trong vài giây, chặn bằng ARP enforcement và gửi cảnh báo SOC kèm vị trí switch/port.'],
['Cách ly tự động khi EDR cảnh báo','EDR báo máy nhiễm ransomware → NAC đưa máy vào VLAN cách ly qua API.']],
tech:[['802.1X / RADIUS / EAP','Xác thực cổng chuẩn IEEE.','Cisco ISE, Aruba ClearPass, Fortinet FortiNAC, Portnox, FreeRADIUS'],
['Agentless out-of-band enforcement','ARP/SNMP/API chặn không cần thay đổi switch.','InfoExpress Easy NAC, Forescout'],
['Device profiling','Fingerprint thiết bị bằng DHCP/HTTP UA/ML.','Forescout, Cisco ISE, Aruba, Ordr'],
['Posture assessment','Agent/dissolvable agent kiểm tra máy.','Cisco Secure Client, ClearPass OnGuard, InfoExpress CyberGatekeeper agent'],
['Cloud NAC / ZTNA','NAC dạng SaaS, kết hợp ZTNA.','Portnox Cloud, Aruba Central NAC, Juniper Mist']],
dia:{cols:[[{t:'Thiết bị đầu cuối',s:'PC · IoT · BYOD · Khách',k:'ext'}],[{t:'Switch / Wi-Fi',s:'Access layer'}],[{t:'NAC Appliance',s:'Phát hiện · Posture · Enforce',k:'hl'}],[{t:'Mạng nội bộ',s:'VLAN quản trị / vận hành'},{t:'VLAN cách ly',s:'Remediation'}]],ctl:{t:'AD/LDAP · RADIUS · EDR · SIEM · NGFW',s:'Ngữ cảnh định danh & phản ứng',to:[2]}},
model:`<p><b>Nguyên lý (agentless – Easy NAC):</b> Appliance kết nối vào các VLAN (trunk) để lắng nghe ARP/DHCP → phát hiện thiết bị mới → tra cứu danh mục được phép/đăng ký/AD/kiểm tra agent → nếu không đạt, gửi gói ARP định hướng để "cô lập" thiết bị (chỉ truy cập trang thông báo/khắc phục) hoặc dùng SNMP/API chuyển VLAN, tắt port. <b>Nguyên lý (802.1X):</b> switch chặn port tới khi supplicant xác thực thành công với RADIUS (NAC), NAC trả về thuộc tính VLAN/dACL.</p>
<ul><li><b>Triển khai theo pha:</b> (1) Discovery/visibility – chỉ quan sát; (2) Cảnh báo; (3) Thực thi ở vùng quản trị; (4) Mở rộng toàn mạng.</li><li><b>HA:</b> cặp appliance; nhiều site dùng appliance phân tán + quản trị tập trung.</li></ul>`,
lic:{gen:['Tính theo <b>số thiết bị/endpoint đồng thời</b> (concurrent devices/IP) được giám sát/kiểm soát – phổ biến nhất.','Phần cứng appliance/VM theo số VLAN/ thiết bị hỗ trợ; license tính năng (posture, guest, BYOD) có thể tách riêng.','Subscription hoặc perpetual + bảo trì năm.'],
v:[['InfoExpress Easy NAC','Theo số thiết bị (gói 100/250/500/1000…), appliance/VM; agent CyberGatekeeper cho posture; perpetual/subscription.','NTS phân phối – ưu tiên',1],

['Fortinet FortiNAC','Theo số thiết bị (Base/Plus/Pro) + appliance.','',0]]},

S({
id:'vpn',g:'hw',no:10,folder:'10. VPN - Secure Access Gateway',abbr:'VPN/ZTNA',
name:'Thiết bị VPN/Secure Access Gateway',layer:'Truy cập từ xa',csf:['PR'],
nts:'Sophos Firewall (SSL/IPsec VPN) + Sophos ZTNA, Barracuda CloudGen Access/SecureEdge, Delinea (Remote Access cho PAM)',
src:{f:'Thiết lập kênh truy cập quản trị và kết nối từ xa được mã hóa; xác thực người dùng và thiết bị trước khi cho phép truy cập',d:'Kết hợp xác thực đa yếu tố; hạn chế truy cập trực tiếp tới các vùng máy chủ quan trọng'},
what:`<p><b>Secure Access Gateway</b> cung cấp kênh truy cập từ xa được mã hoá cho cán bộ vận hành, nhà thầu và chi nhánh. Ba thế hệ công nghệ: (1) <b>VPN IPsec/SSL</b> truyền thống – xác thực xong là vào mạng (network-level access); (2) <b>ZTNA (Zero Trust Network Access)</b> – chỉ cấp quyền tới <i>từng ứng dụng</i> sau khi xác minh danh tính + trạng thái thiết bị, liên tục đánh giá lại, ứng dụng ẩn khỏi Internet; (3) <b>SSE/SASE</b> – ZTNA + SWG + CASB dạng dịch vụ cloud.</p>
<p>Đối với hệ thống trọng yếu, khuyến nghị: VPN/ZTNA bắt buộc <b>MFA</b>, kiểm tra thiết bị, đi qua <b>PAM/jump host</b>, không cho phép truy cập trực tiếp vùng máy chủ. Các lỗ hổng nghiêm trọng trên VPN gateway (Ivanti, Fortinet, Citrix, Palo Alto 2023–2025) cho thấy gateway phải được vá và giám sát chặt.</p>`,
feat:['VPN site-to-site IPsec (IKEv2, AES-GCM, SHA-2, DH group 19/20/21), SSL/TLS VPN, client VPN IPsec.','ZTNA: truy cập theo ứng dụng, connector outbound (không mở cổng inbound), policy theo user/nhóm/thiết bị/vị trí/thời gian.','MFA tích hợp (TOTP, push, FIDO2, chứng thư số), SAML/OIDC với IdP; xác thực chứng thư thiết bị.','Kiểm tra posture thiết bị: OS, AV/EDR, mã hoá đĩa, domain-joined.','Split-tunnel/full-tunnel, kiểm soát truy cập tài nguyên sau VPN bằng firewall policy.','HA/cluster, cân bằng tải nhiều gateway; quản trị tập trung.','Ghi log phiên chi tiết (user, IP, thời gian, tài nguyên), tích hợp SIEM; giới hạn đồng thời, timeout.','Clientless (HTML5 RDP/SSH) cho truy cập quản trị qua trình duyệt.'],
pain:['Cán bộ trực vận hành và nhà thầu cần truy cập từ xa 24/7 nhưng VPN cũ chỉ dùng mật khẩu.','VPN cấp quyền cả dải mạng, người dùng VPN có thể quét toàn bộ DC.','VPN gateway public trên Internet là mục tiêu khai thác lỗ hổng hàng đầu.','Không phân biệt được thiết bị cá nhân không an toàn với máy được cấp.'],
risk:['Chiếm tài khoản VPN (phishing, credential stuffing) → vào thẳng mạng nội bộ – kịch bản điển hình của ransomware.','Khai thác lỗ hổng gateway (RCE) → kiểm soát thiết bị biên.','Không truy vết được thao tác của nhà thầu.'],
uc:[['Quản trị từ xa có kiểm soát','Kỹ sư trực → ZTNA (MFA + kiểm tra EDR) → chỉ thấy cổng PAM → PAM ghi hình phiên tới máy chủ.'],
['Kết nối DC chính – DR – bộ ngành','IPsec site-to-site AES-256-GCM, IKEv2 với chứng thư số, định tuyến động qua tunnel.'],
['Nhà thầu truy cập có thời hạn','Tài khoản nhà thầu chỉ hoạt động trong khung giờ bảo trì đã phê duyệt, chỉ tới đúng ứng dụng cần.'],
['Thay thế VPN bằng ZTNA','Ứng dụng nội bộ được publish qua ZTNA connector, đóng cổng VPN public để giảm bề mặt tấn công.']],
tech:[['IPsec / IKEv2','Chuẩn VPN lớp 3 (NIST SP 800-77r1).','Mọi NGFW: Sophos, Fortinet, Palo Alto, Cisco, Check Point'],
['SSL/TLS VPN','VPN qua TLS, client hoặc clientless.','Fortinet, Palo Alto GlobalProtect, Cisco Secure Client, Ivanti Connect Secure, Array, F5'],
['ZTNA','Truy cập theo ứng dụng, zero trust.','Zscaler ZPA, Netskope, Palo Alto Prisma Access, Cloudflare Access, Sophos ZTNA, Barracuda CloudGen Access'],
['SSE/SASE','ZTNA + SWG + CASB + FWaaS.','Zscaler, Netskope, Palo Alto, Cisco, Cloudflare, Fortinet'],
['MFA / FIDO2','Xác thực mạnh chống phishing.','Duo, Microsoft Entra, Okta, RSA, YubiKey'],
['WireGuard','Giao thức VPN hiện đại, gọn nhẹ.','Tailscale, Netmaker, một số NGFW']],
dia:{cols:[[{t:'Cán bộ / Nhà thầu',s:'Laptop · thiết bị',k:'ext'}],[{t:'Internet',s:'TLS / IPsec',k:'ext'}],[{t:'VPN / ZTNA Gateway',s:'MFA · Posture · HA',k:'hl'}],[{t:'PAM / Jump host',s:'Ghi hình phiên'}],[{t:'Vùng máy chủ',s:'Chỉ qua PAM'}]],ctl:{t:'IdP + MFA · NAC/EDR posture · SIEM',s:'Xác thực & giám sát liên tục',to:[2,3]}},
model:`<p><b>Nguyên lý VPN:</b> client thiết lập tunnel mã hoá (IKE trao đổi khoá → ESP; hoặc TLS) → gateway xác thực user (RADIUS/LDAP/SAML + MFA) và thiết bị → cấp IP ảo → firewall policy giới hạn tài nguyên. <b>Nguyên lý ZTNA:</b> người dùng truy cập ứng dụng → broker kiểm tra danh tính + posture + ngữ cảnh → nếu đạt, broker ghép nối phiên tới connector (kết nối outbound từ DC) → chỉ ứng dụng đó được truy cập; đánh giá lại liên tục.</p>
<ul><li>Tách gateway VPN quản trị và VPN người dùng thường.</li><li>Gateway đặt trong DMZ, sau Anti-DDoS; không đặt trực tiếp trong vùng máy chủ.</li><li>Bắt buộc MFA, khoá tài khoản sau nhiều lần sai, giới hạn GeoIP.</li></ul>`,

S({
id:'encryptor',g:'hw',no:11,folder:'11. Ma hoa duong truyen - Network Encryptor',abbr:'Network Encryptor',
name:'Thiết bị mã hóa đường truyền chuyên dụng',layer:'Kết nối DC / liên ngành',csf:['PR'],
nts:'(Chưa có hãng chuyên dụng trong danh mục NTS – sản phẩm mật mã cần giấy phép Ban Cơ yếu; có thể dùng IPsec trên NGFW Sophos/Barracuda cho mức thông thường)',
src:{f:'Bảo vệ tính bí mật và toàn vẹn của dữ liệu trao đổi giữa các trung tâm dữ liệu hoặc giữa VNeID với các hệ thống có yêu cầu bảo mật cao',d:'Áp dụng tại các tuyến kết nối cần bảo vệ ở mức cao theo phương án kiến trúc và yêu cầu nghiệp vụ'},
what:`<p><b>Thiết bị mã hoá đường truyền chuyên dụng</b> (High-Speed Network Encryptor – HSE) mã hoá toàn bộ lưu lượng trên tuyến kết nối giữa hai điểm (DC chính ↔ DR, DC ↔ bộ ngành) ở <b>lớp 2 (Ethernet/MACsec), lớp 1 (quang OTN/DWDM) hoặc lớp 3 (IPsec)</b> với tốc độ đường truyền (1–100 Gbps) và độ trễ cực thấp (micro giây), không ảnh hưởng ứng dụng. Khác với IPsec trên router/firewall (chia sẻ CPU, overhead lớn), HSE là thiết bị mật mã chuyên dụng, chứng nhận FIPS 140-3/Common Criteria, có cơ chế chống can thiệp và quản lý khoá độc lập.</p>
<p>Tại Việt Nam, với thông tin thuộc phạm vi bí mật nhà nước phải dùng <b>sản phẩm mật mã cơ yếu</b> do Ban Cơ yếu Chính phủ cung cấp; với thông tin không thuộc bí mật nhà nước dùng sản phẩm mật mã dân sự được cấp phép (Luật An toàn thông tin mạng 2015, Luật Cơ yếu 2011, NĐ 58/2016). Xu hướng toàn cầu: chuẩn bị chuyển đổi <b>mật mã hậu lượng tử (PQC)</b> theo NIST IR 8547 – các thuật toán RSA/ECC sẽ bị khuyến cáo ngừng dần sau 2030.</p>`,
feat:['Mã hoá AES-256 (GCM/CTR), xác thực toàn vẹn từng khung/gói, chống phát lại (replay).','Hoạt động lớp 2 (Ethernet, VLAN, MPLS, MACsec), lớp 3 (IPsec tunnel/transport), lớp 1 (OTN/quang).','Tốc độ line-rate, độ trễ < 10 µs, overhead gần 0 (L2) – phù hợp đồng bộ CSDL/replication giữa DC.','Quản lý khoá tự động, xoay khoá theo chu kỳ (phút/giờ), sinh khoá phần cứng; QKD-ready/PQC (ML-KEM) trên dòng mới.','Chống can thiệp vật lý (tamper), tự xoá khoá; chứng nhận FIPS 140-3, CC EAL4+, NATO.','Topology point-to-point, point-to-multipoint, mesh; HA và bypass.','Quản trị tập trung, tách biệt quyền quản trị mạng và quản trị mật mã; log kiểm toán.'],
pain:['Dữ liệu định danh/CSDL quốc gia được nhân bản giữa DC chính và DR qua đường truyền thuê của nhà mạng – không kiểm soát vật lý đường cáp.','IPsec trên firewall làm giảm hiệu năng, tăng độ trễ cho replication đồng bộ.','Yêu cầu bảo đảm bí mật & toàn vẹn ở mức cao theo quy định mật mã, cơ yếu.','Nguy cơ "thu thập trước, giải mã sau" (harvest-now-decrypt-later) khi máy tính lượng tử phát triển.'],
risk:['Nghe lén/chặn bắt dữ liệu trên đường truyền (cáp quang có thể bị khai thác bằng thiết bị tap).','Giả mạo/sửa đổi dữ liệu replication.','Vi phạm quy định bảo vệ bí mật nhà nước & dữ liệu cá nhân.'],
uc:[['Mã hoá tuyến replication DC chính – DR','Cặp encryptor L2 10/100G trên kênh dark fiber/leased line, mã hoá toàn bộ VLAN replication CSDL, độ trễ không đáng kể.'],
['Kết nối VNeID với hệ thống bộ ngành nhạy cảm','Encryptor L3 IPsec chuyên dụng đặt tại hai đầu, khoá do đơn vị quản lý, nhà mạng chỉ thấy dữ liệu đã mã hoá.'],
['Mạng WAN đa điểm','Mesh nhiều tỉnh/thành, quản lý khoá nhóm tập trung.']],
tech:[['Layer 2 Ethernet encryption','Mã hoá khung Ethernet, overhead thấp.','Thales High Speed Encryptors (CN series), Rohde & Schwarz SITLine ETH, Atos TrustWay, Senetas'],
['MACsec (IEEE 802.1AE)','Mã hoá liên kết trên switch/router.','Cisco, Juniper, Arista, Nokia'],

['PQC / QKD','Trao đổi khoá hậu lượng tử, phân phối khoá lượng tử.','Thales, Adtran, ID Quantique, Toshiba QKD']],
dia:{cols:[[{t:'DC chính',s:'Switch core',k:'ext'}],[{t:'Encryptor A',s:'L2/L3 · AES-256',k:'hl'}],[{t:'Đường truyền nhà mạng',s:'Leased line / Dark fiber',k:'ext'}],[{t:'Encryptor B',s:'L2/L3 · AES-256',k:'hl'}],[{t:'DC dự phòng / Bộ ngành',s:'',k:'ext'}]],ctl:{t:'Quản trị mật mã & khoá tập trung',s:'Tách quyền khỏi quản trị mạng · Audit',to:[1,3]}},
model:`<p><b>Nguyên lý:</b> Hai encryptor xác thực lẫn nhau (chứng thư/ khoá tiền chia sẻ) → thiết lập khoá phiên (DH/ECDH hoặc PQC KEM) → mã hoá payload từng khung/gói bằng AES-256-GCM, gắn thẻ xác thực → đầu kia kiểm tra & giải mã → khoá phiên được xoay định kỳ. Ở chế độ L2 "bump-in-the-wire", thiết bị trong suốt với mạng.</p>
<ul><li>Đặt tại hai đầu tuyến, phía trong của router/thiết bị nhà mạng (CPE).</li><li>Triển khai HA (cặp thiết bị, đường vòng).</li><li>Quản trị mật mã do đơn vị chuyên trách (không phải nhà mạng) nắm giữ.</li></ul>`,

S({
id:'npb',g:'hw',no:12,folder:'12. Network Packet Broker - TAP',abbr:'NPB/TAP',
name:'Thiết bị Network Packet Broker/TAP phục vụ giám sát an ninh mạng',layer:'Hạ tầng visibility',csf:['DE'],
nts:'NETSCOUT nGenius Packet Flow Switch (PFS) + TAP',
src:{f:'Sao chép, tổng hợp, lọc và phân phối lưu lượng đến các hệ thống IDS/IPS, NDR, giám sát an ninh mạng mà không ảnh hưởng đến luồng dịch vụ chính',d:'Bố trí tại các điểm mạng trọng yếu, hỗ trợ thu thập lưu lượng phục vụ giám sát và điều tra sự cố'},
what:`<p><b>TAP (Test Access Point)</b> là thiết bị thụ động (quang) hoặc chủ động (đồng) chèn vào đường link để <b>sao chép 100% lưu lượng</b> mà không ảnh hưởng luồng chính (kể cả khi mất nguồn). <b>Network Packet Broker (NPB)</b> – NETSCOUT gọi là Packet Flow Switch – nhận lưu lượng từ nhiều TAP/SPAN, rồi <b>tổng hợp (aggregation), lọc (filtering), nhân bản (replication), cân bằng tải (load-balancing)</b> và các chức năng nâng cao (khử trùng lặp gói, cắt gói, bỏ header tunnel, gắn timestamp, che dữ liệu, giải mã TLS) trước khi phân phối tới đúng công cụ: IDS, NDR, SIEM sensor, APM, ghi PCAP.</p>
<p>NPB là "lớp hạ tầng visibility" – giúp các công cụ bảo mật/giám sát nhận đúng và đủ dữ liệu, tránh mua thừa công cụ, và cho phép thêm/bớt công cụ mà không chạm vào mạng sản xuất.</p>`,
feat:['TAP quang thụ động (split ratio 50/50, 70/30), TAP đồng chủ động có fail-safe; TAP 1/10/25/40/100/400G.','Tổng hợp nhiều link thành ít cổng công cụ; nhân bản 1 nguồn tới nhiều công cụ.','Lọc theo L2–L4 (VLAN, IP, port, protocol), L7 (ứng dụng) để mỗi công cụ chỉ nhận dữ liệu cần.','Cân bằng tải theo phiên (session-aware) tới nhiều sensor; đảm bảo cả hai chiều của phiên đến cùng 1 sensor.','Deduplication, packet slicing, header stripping (VXLAN, GRE, MPLS, GTP), timestamping.','Giải mã TLS tập trung (SSL decryption) một lần cho nhiều công cụ; data masking (che CCCD, số thẻ) cho tuân thủ.','Inline bypass/tool-chaining cho công cụ inline (IPS, WAF) với heartbeat – công cụ hỏng không làm rớt mạng.','Quản trị tập trung fabric nhiều NPB (NETSCOUT Fabric Manager), API.'],
pain:['Cổng SPAN trên switch hạn chế số lượng, mất gói khi tải cao, ảnh hưởng CPU switch, cấu hình phân tán.','Mỗi công cụ (NDR, IDS, APM, PCAP) đòi một bản sao lưu lượng riêng – không đủ cổng SPAN.','Công cụ bị quá tải do nhận cả lưu lượng không cần (backup, video).','Lưu lượng trong tunnel/overlay (VXLAN) công cụ không đọc được.'],
risk:['Điểm mù giám sát → không phát hiện tấn công, không có bằng chứng điều tra.','Đầu tư công cụ đắt nhưng hiệu quả thấp do dữ liệu đầu vào thiếu/sai.','Thay đổi cấu hình SPAN gây sự cố mạng sản xuất.'],
uc:[['Hạ tầng giám sát cho SOC','TAP tại link Internet, core DC, vùng DB → NPB → phân phối cho NDR (NETSCOUT OCI), IDS (Suricata), APM (nGeniusONE), recorder PCAP.'],
['Giải mã TLS một lần','NPB giải mã lưu lượng HTTPS vào DMZ và gửi bản rõ cho NDR/IDS – không cần mỗi công cụ tự giải mã.'],
['Inline tool-chain','Lưu lượng biên đi qua NPB bypass → IPS → WAF; khi IPS bảo trì, NPB tự bỏ qua.'],
['Tuân thủ dữ liệu cá nhân','Data masking che số CCCD trong payload trước khi gửi cho công cụ bên thứ ba.']],
tech:[['Passive optical TAP','Chia quang thụ động, không cần nguồn.','Garland, NETSCOUT, Gigamon, Keysight, Profitap, Niagara'],
['NPB / Packet Flow Switch','Tổng hợp, lọc, phân phối.','Gigamon GigaVUE, Keysight (Ixia) Vision, NETSCOUT nGenius PFS, cPacket, APCON, Arista DANZ'],
['Deep observability','Metadata ứng dụng, giải mã, cloud.','Gigamon (AMI, GigaVUE Cloud Suite), Keysight CloudLens'],
['Virtual/Cloud TAP','Thu lưu lượng VM/container, VPC mirroring.','Gigamon, Keysight CloudLens, AWS VPC Traffic Mirroring'],
['Inline bypass','Bảo vệ link khi công cụ inline lỗi.','Gigamon, Keysight, NETSCOUT, Niagara']],
dia:{cols:[[{t:'Link Internet / Core / DB',s:'Mạng sản xuất',k:'ext'}],[{t:'TAP quang / SPAN',s:'Sao chép 100%'}],[{t:'Packet Broker (PFS)',s:'Lọc · Dedup · LB · TLS',k:'hl'}],[{t:'NDR / IDS',s:''},{t:'APM / NPM',s:''},{t:'PCAP recorder',s:''}]],ctl:{t:'Fabric Manager · API',s:'Quản trị tập trung chính sách phân phối',to:[2]}},
model:`<p><b>Nguyên lý:</b> Cổng mạng (network port) của NPB nhận lưu lượng từ TAP/SPAN → áp dụng "map"/chính sách: lọc → xử lý nâng cao → chọn cổng công cụ (tool port) hoặc nhóm cân bằng tải → công cụ nhận đúng dữ liệu. Ở chế độ inline, NPB nằm trong đường đi của dữ liệu và chuyển qua chuỗi công cụ có kiểm tra heartbeat.</p>
<ul><li><b>Kiến trúc 2 tầng:</b> TAP tại từng điểm → NPB tổng hợp tại phòng máy → NPB lõi phân phối tới khu công cụ SOC.</li><li><b>Điểm đặt TAP khuyến nghị:</b> sau router biên (trước/sau firewall), core DC, uplink vùng DB/App, kết nối bộ ngành, kết nối DR.</li></ul>`,
lic:{gen:['Phần cứng NPB theo <b>số cổng & tốc độ</b> (1/10/25/40/100G) + license tính năng nâng cao (dedup, slicing, header stripping, TLS decryption, masking) theo cổng hoặc theo thiết bị.','TAP: mua đứt theo số link/tốc độ (thụ động không cần license).','Phần mềm quản trị fabric theo số node; support năm.'],
v:[['NETSCOUT nGenius PFS (2200/4200/5000/6000/7000)','Theo model & số cổng; license gói tính năng nâng cao; Fabric Manager; MasterCare support.','NTS phân phối – ưu tiên',1],['Gigamon GigaVUE','Theo model + license GigaSMART (theo tính năng/cổng); bản cloud theo subscription.','',0],['Keysight (Ixia) Vision','Theo model + license tính năng (NetStack/PacketStack/AppStack/SecureStack).','',0],['cPacket / Niagara / APCON','Theo model & cổng.','',0]]},
pre:[['Khảo sát','Danh sách link cần giám sát (tốc độ, loại quang SM/MM, đầu nối LC/MPO), băng thông thực tế.'],['Công cụ','Danh sách công cụ nhận dữ liệu, loại cổng, yêu cầu lọc/cân bằng tải.'],['Hạ tầng','Rack, nguồn, dây nhảy quang, cửa sổ bảo trì để chèn TAP (TAP thụ động gần như không gián đoạn nhưng cần ngắt link vài giây).'],['Quy hoạch','Tỉ lệ split, suy hao quang (budget), dự phòng cổng mở rộng.']],
mkt:{rank:`<p>Không có MQ Gartner. Theo thị phần (IDC, Dell’Oro), <b>Gigamon</b> dẫn đầu thị trường NPB/deep observability, tiếp theo là <b>Keysight (Ixia)</b>, <b>NETSCOUT</b>, cPacket, Arista, APCON, Niagara Networks; TAP: Garland, Profitap, NETSCOUT, Gigamon.</p>`,

S({
id:'siem',g:'sw',no:13,folder:'13. SIEM',abbr:'SIEM',
name:'Hệ thống quản lý sự kiện và thông tin an ninh – SIEM',layer:'SOC – Giám sát tập trung',csf:['DE','RS','ID'],
nts:'OpenText ArcSight ESM / Logger / Recon, Stellar Cyber Open XDR (NG-SIEM), Kaspersky KUMA',
src:{f:'Thu thập, chuẩn hóa, lưu trữ và phân tích tập trung nhật ký, sự kiện từ các thành phần của hệ thống; tương quan sự kiện và phát hiện dấu hiệu tấn công'},
what:`<p><b>SIEM</b> là "bộ não" của Trung tâm điều hành an ninh mạng (SOC): thu thập log từ toàn bộ hạ tầng (firewall, IPS, máy chủ, AD, ứng dụng, CSDL, cloud, EDR, NDR…), <b>chuẩn hoá</b> về một lược đồ chung (CEF/ECS/OCSF), <b>lưu trữ</b> phục vụ tra cứu & tuân thủ, <b>tương quan</b> (correlation) theo thời gian thực để phát hiện chuỗi tấn công mà từng nguồn riêng lẻ không thấy được, và cung cấp dashboard, cảnh báo, báo cáo, điều tra.</p>
<p>Thế hệ <b>Next-Gen SIEM</b> bổ sung UEBA, threat intelligence, SOAR, phân tích AI/LLM (Copilot), kiến trúc data lake tách lưu trữ – tính toán, triển khai SaaS hoặc on-prem. Với hệ thống trọng yếu quốc gia, SIEM on-premise vẫn là yêu cầu phổ biến do quy định lưu trữ dữ liệu trong nước.</p>`,
feat:['Thu thập log đa nguồn: syslog, agent, API, Windows Event, NetFlow, cloud (AWS/Azure/M365); hàng trăm connector/parser có sẵn.','Chuẩn hoá & làm giàu (enrichment): GeoIP, asset, user, threat intel, phân loại theo taxonomy.','Tương quan thời gian thực: rule (chuỗi sự kiện, ngưỡng, thống kê), phát hiện theo MITRE ATT&CK; bộ nội dung (use-case) có sẵn.','Phát hiện bất thường/UEBA, ML; tích hợp TIP, chấm điểm rủi ro theo thực thể.','Tìm kiếm tốc độ cao trên dữ liệu lớn (TB/ngày), threat hunting, truy vấn ngôn ngữ (KQL, SPL, AQL…).','Quản lý vụ việc (case management), cảnh báo, workflow; tích hợp SOAR.','Lưu trữ dài hạn có nén, toàn vẹn (hash/ký), phục vụ tuân thủ (log ≥ 3–12 tháng tuỳ quy định).','Dashboard, báo cáo tuân thủ (ISO 27001, PCI DSS, TCVN 11930), đa tenant cho MSSP/ cơ quan nhiều đơn vị.'],
pain:['Log nằm rải rác hàng trăm thiết bị, mỗi nơi một định dạng; khi sự cố xảy ra mất nhiều ngày gom log.','Không phát hiện được chuỗi tấn công liên thiết bị (ví dụ: phishing → đăng nhập VPN lạ → truy cập DB).','Yêu cầu pháp lý: giám sát an toàn hệ thống thông tin, lưu log, báo cáo sự cố (Thông tư 12/2022, Chỉ thị 14/CT-TTg mô hình 4 lớp).','Thiếu nhân sự SOC, quá nhiều cảnh báo nhiễu (alert fatigue).'],
risk:['Tấn công kéo dài hàng tháng không bị phát hiện.','Không có bằng chứng số phục vụ điều tra, xử lý trách nhiệm.','Không đáp ứng kiểm tra/đánh giá của cơ quan quản lý.'],
uc:[['Phát hiện chiếm đoạt tài khoản quản trị','Tương quan: đăng nhập VPN từ nước ngoài lúc 2h sáng + tạo tài khoản mới trong AD + truy cập máy chủ DB → cảnh báo Critical, SOAR khoá tài khoản.'],
['Giám sát tuân thủ hệ thống cấp độ 4–5','Báo cáo định kỳ về truy cập đặc quyền, thay đổi cấu hình, sự kiện bảo mật theo yêu cầu kiểm tra.'],
['Kết nối chia sẻ với hệ thống giám sát quốc gia','Chuyển cảnh báo/IOC theo định dạng chuẩn tới cơ quan chuyên trách (mô hình 4 lớp).'],
['Điều tra sự cố','Truy vết toàn bộ hoạt động của 1 IP/user trong 90 ngày chỉ bằng vài truy vấn.']],
tech:[['Log management & data lake','Thu thập, nén, lưu trữ, tìm kiếm.','OpenText ArcSight Logger, Splunk, Elastic, Google SecOps, Microsoft Sentinel (Log Analytics)'],
['Correlation engine','Rule thời gian thực, CEP.','ArcSight ESM (CORR-Engine), QRadar, Splunk ES, KUMA'],
['UEBA/ML','Hành vi bất thường theo user/thực thể.','Exabeam, Securonix, ArcSight Intelligence, Microsoft Sentinel UEBA'],
['Open XDR / NG-SIEM hợp nhất','SIEM + NDR + UEBA + SOAR một nền tảng.','Stellar Cyber, CrowdStrike Falcon NG-SIEM, Palo Alto XSIAM, Microsoft Defender XDR+Sentinel'],
['Chuẩn dữ liệu','CEF, LEEF, ECS, OCSF; Sigma rules.','Tất cả hãng; OCSF được AWS/Splunk/IBM thúc đẩy'],
['AI/LLM assistant','Copilot hỗ trợ điều tra, viết truy vấn.','Microsoft Security Copilot, Google Gemini in SecOps, Splunk AI Assistant']],
dia:{cols:[[{t:'Nguồn log',s:'FW · IPS · Server · AD · App · DB · EDR · NDR',k:'ext'}],[{t:'Collector / Connector',s:'Agent · Syslog · API'}],[{t:'Chuẩn hoá & làm giàu',s:'Parser · TI · Asset'}],[{t:'SIEM Correlation',s:'Rule · UEBA · MITRE',k:'hl'}],[{t:'SOC Analyst',s:'Dashboard · Case'},{t:'Lưu trữ dài hạn',s:'Logger · Data lake'}]],ctl:{t:'SOAR · TIP · Kết nối hệ thống giám sát quốc gia',s:'Phản ứng & chia sẻ',to:[3,4]}},
model:`<p><b>Nguyên lý:</b> Connector nhận log → parse & map trường → gắn ngữ cảnh → đẩy vào luồng thời gian thực (correlation) và kho lưu trữ (search) → rule/ML sinh cảnh báo (correlated event) → analyst phân loại (triage), mở case, điều tra → SOAR thực thi phản ứng.</p>
<ul><li><b>Kiến trúc phân tầng:</b> Collector tại từng site/vùng (nén, mã hoá, đệm khi mất kết nối) → cụm xử lý tập trung tại DC chính → lưu trữ nóng (30–90 ngày) & lạnh (1–5 năm) → node DR.</li><li><b>Sizing theo EPS</b> (events per second) & GB/ngày; dự phòng 30–50% tăng trưởng.</li><li><b>Use-case driven:</b> triển khai theo danh sách use-case ưu tiên (MITRE), không phải "gom hết log".</li></ul>`,
lic:{gen:['Phổ biến nhất: theo <b>EPS</b> (sự kiện/giây) hoặc <b>GB/ngày</b> dữ liệu nạp vào (ingest).','Theo <b>số thiết bị/nguồn log</b> (device-based) hoặc <b>số asset/endpoint/user</b> (asset-based – dễ dự toán).','Theo năng lực tính toán (workload/compute-based) – Splunk SVC, Elastic RAM.','Thêm: module UEBA/SOAR/TI, dung lượng lưu trữ, số node HA/DR; perpetual + bảo trì hoặc subscription.'],

S({
id:'soar',g:'sw',no:14,folder:'14. SOAR',abbr:'SOAR',
name:'Hệ thống điều phối và tự động hóa ứng cứu sự cố – SOAR',layer:'SOC – Phản ứng',csf:['RS','RC'],
nts:'OpenText ArcSight SOAR, Stellar Cyber (SOAR tích hợp), OpenText SMAX (ITSM/ticket)',
src:{f:'Tự động tiếp nhận cảnh báo, điều phối xử lý, thực thi playbook ứng cứu và hỗ trợ quản lý vòng đời sự cố'},
what:`<p><b>SOAR (Security Orchestration, Automation & Response)</b> kết nối các công cụ bảo mật qua API và tự động hoá quy trình xử lý sự cố bằng <b>playbook</b>: nhận cảnh báo từ SIEM/EDR/email → làm giàu thông tin (tra cứu TI, whois, sandbox, CMDB) → ra quyết định (tự động hoặc có người phê duyệt) → thực thi phản ứng (chặn IP trên firewall, khoá tài khoản AD, cách ly máy qua EDR, xoá email độc) → ghi nhận toàn bộ vào case và báo cáo.</p>
<p>SOAR giúp SOC xử lý khối lượng cảnh báo lớn với ít nhân sự, chuẩn hoá quy trình ứng cứu theo NIST SP 800-61r3 và rút ngắn MTTD/MTTR từ giờ xuống phút. Xu hướng: SOAR được nhúng vào SIEM/XDR, và "agentic AI SOC" dùng AI để tự điều tra, đề xuất playbook.</p>`,
feat:['Thư viện connector/integration (hàng trăm công cụ: FW, EDR, AD, email, ticketing, TI, sandbox).','Trình thiết kế playbook kéo-thả (low-code), hỗ trợ script Python; playbook mẫu theo kịch bản (phishing, malware, brute-force, ransomware).','Quản lý vụ việc (case management): phân loại, gán, SLA, timeline, bằng chứng, chat-ops.','Làm giàu cảnh báo tự động, khử trùng lặp, nhóm cảnh báo, chấm điểm ưu tiên.','Phê duyệt nhiều cấp (human-in-the-loop) cho hành động có rủi ro.','Báo cáo KPI SOC (MTTA, MTTD, MTTR), báo cáo sự cố theo mẫu cho cơ quan quản lý.','Quản lý tài sản/ threat intel cơ bản; tích hợp ITSM (ServiceNow, SMAX, Jira).','AI hỗ trợ: tóm tắt sự cố, đề xuất bước tiếp theo.'],
pain:['SOC nhận hàng nghìn cảnh báo/ngày, analyst mất 70–80% thời gian cho thao tác lặp lại (tra IP, mở ticket).','Phản ứng chậm: cần nhiều bộ phận (mạng, hệ thống, ứng dụng) phối hợp thủ công.','Quy trình ứng cứu phụ thuộc vào cá nhân, không chuẩn hoá, không có hồ sơ.','Thiếu nhân lực ATTT có kinh nghiệm.'],
risk:['Ransomware mã hoá toàn hệ thống trong vài giờ trong khi phản ứng thủ công mất cả ngày.','Bỏ sót cảnh báo quan trọng do quá tải.','Không có hồ sơ xử lý sự cố đáp ứng quy định báo cáo.'],
uc:[['Xử lý email phishing tự động','Người dùng báo cáo email → SOAR trích URL/file → sandbox & TI → nếu độc: xoá email khỏi mọi hộp thư, chặn domain trên proxy/FW, reset mật khẩu người đã click.'],
['Khoá tài khoản bị brute-force','SIEM cảnh báo 50 lần sai mật khẩu + 1 lần thành công từ IP lạ → SOAR khoá tài khoản AD, buộc MFA lại, mở case cho L2.'],
['Cách ly máy nhiễm ransomware','EDR cảnh báo mã hoá hàng loạt → SOAR cách ly host qua EDR, NAC chuyển VLAN cách ly, chụp bộ nhớ, thông báo đội ứng cứu.'],
['Báo cáo sự cố theo quy định','Tự sinh báo cáo sự cố theo mẫu gửi cơ quan điều phối ứng cứu quốc gia.']],
tech:[['Orchestration & playbook engine','Workflow kết nối API công cụ.','Palo Alto Cortex XSOAR, Splunk SOAR, Google SecOps SOAR, Swimlane, Tines, Torq, Fortinet FortiSOAR, OpenText ArcSight SOAR'],
['Case management','Quản lý vòng đời sự cố.','TheHive (OSS), IBM QRadar SOAR (Resilient), ServiceNow SecOps'],
['Embedded SOAR trong XDR/SIEM','SOAR tích hợp sẵn.','Stellar Cyber, Microsoft Sentinel (Logic Apps), CrowdStrike Fusion, Elastic'],
['Hyperautomation / no-code','Tự động hoá không cần code.','Tines, Torq, Swimlane Turbine'],
['Agentic AI SOC','AI tự điều tra, đề xuất hành động.','Microsoft Security Copilot agents, Google SecOps, Torq HyperSOC, Dropzone AI']],
dia:{cols:[[{t:'Cảnh báo',s:'SIEM · EDR · NDR · Email',k:'ext'}],[{t:'SOAR',s:'Playbook · Case · Phê duyệt',k:'hl'}],[{t:'Làm giàu',s:'TI · Sandbox · CMDB · AD'}],[{t:'Phản ứng',s:'FW chặn IP · AD khoá · EDR cách ly · Email xoá'}]],ctl:{t:'ITSM/Ticket · Báo cáo · Chat-ops',s:'Theo dõi SLA & KPI SOC',to:[1]}},
model:`<p><b>Nguyên lý:</b> Trigger (cảnh báo/ email/ lịch) → playbook chạy tuần tự các bước: thu thập ngữ cảnh → đánh giá điều kiện → hành động (tự động hoặc chờ phê duyệt) → cập nhật case → đóng/chuyển cấp. Mỗi hành động là một lời gọi API tới công cụ đích qua connector.</p>
<ul><li>Triển khai on-prem cùng SIEM hoặc SaaS; cần kết nối mạng tới API của mọi công cụ bị điều khiển.</li><li>Lộ trình: bắt đầu bằng playbook làm giàu (không rủi ro) → phản ứng có phê duyệt → tự động hoàn toàn cho kịch bản đã chín.</li></ul>`,
lic:{gen:['Theo <b>số người dùng analyst</b> (named/concurrent user) – phổ biến.','Theo số action/playbook run, số integration, hoặc gói (Starter/Enterprise).','Đi kèm nền tảng (Stellar Cyber, Sentinel) – không tính riêng hoặc tính theo lượt chạy (Logic Apps).'],
v:[['OpenText ArcSight SOAR','Theo số analyst user; có thể đi kèm gói ArcSight.','NTS phân phối',1],['Stellar Cyber','SOAR tích hợp trong license Open XDR (GB/ngày/asset).','NTS phân phối',1],['Palo Alto Cortex XSOAR','Theo user + gói (Starter/Enterprise), TIM tính thêm.','',0],['Splunk SOAR','Theo số action/ngày hoặc user.','',0],['Fortinet FortiSOAR','Theo user/ số tenant.','',0],['Tines / Torq','Theo số workflow/story & action.','',0]]},
pre:[['Quy trình','Quy trình ứng cứu sự cố đã phê duyệt (IR plan), ma trận phân quyền phản ứng, kịch bản ưu tiên.'],['Tích hợp','Tài khoản API có quyền tối thiểu trên FW, EDR, AD, email, ITSM; kết nối mạng tới API.'],['Dữ liệu','CMDB/asset inventory, danh sách liên hệ, phân loại tài sản quan trọng.'],['Nhân sự','Kỹ sư viết/duy trì playbook (Python, API).']],
mkt:{rank:`<p>Gartner không còn MQ cho SOAR (chỉ Market Guide); SOAR đang hội tụ vào SIEM/XDR. Hãng tiêu biểu: <b>Palo Alto Cortex XSOAR</b> (thị phần lớn nhất), <b>Splunk SOAR</b>, <b>Google SecOps SOAR</b> (Siemplify), Microsoft Sentinel, IBM QRadar SOAR, Fortinet FortiSOAR, Swimlane, Tines, Torq; mã nguồn mở Shuffle, TheHive/Cortex.</p>`,

S({
id:'ueba',g:'sw',no:15,folder:'15. UEBA',abbr:'UEBA',
name:'Giải pháp phân tích hành vi người dùng và thực thể – UEBA',layer:'SOC – Phân tích hành vi',csf:['DE'],
nts:'OpenText ArcSight Intelligence (Interset), Stellar Cyber UEBA, Proofpoint Insider Threat Management, Safetica (UEBA)',
src:{f:'Phân tích hành vi tài khoản, người dùng, máy chủ và thực thể để phát hiện các hành vi bất thường hoặc nguy cơ tài khoản bị chiếm quyền'},
what:`<p><b>UEBA (User & Entity Behavior Analytics)</b> dùng thống kê và học máy để xây dựng <b>đường cơ sở hành vi (baseline)</b> cho từng người dùng, tài khoản dịch vụ, máy chủ, thiết bị, ứng dụng – rồi phát hiện độ lệch: đăng nhập giờ lạ, từ vị trí lạ, truy cập lượng dữ liệu bất thường, dùng quyền chưa từng dùng, máy chủ kết nối tới đích mới. Mỗi bất thường cộng điểm rủi ro vào thực thể; khi điểm vượt ngưỡng, SOC được cảnh báo với "câu chuyện" hành vi đầy đủ.</p>
<p>UEBA đặc biệt hiệu quả với <b>mối đe doạ nội bộ</b> (insider threat) và <b>tài khoản bị chiếm quyền</b> – những trường hợp hành vi dùng thông tin đăng nhập hợp lệ nên rule SIEM truyền thống khó phát hiện. Ngày nay UEBA thường là module của SIEM/XDR hoặc DLP/ITM.</p>`,
feat:['Thu thập log định danh & truy cập (AD, VPN, IAM, PAM, file server, DB, ứng dụng, proxy, email, cloud).','Mô hình baseline theo cá nhân & theo nhóm ngang hàng (peer group); phát hiện bất thường đa chiều.','Chấm điểm rủi ro tích luỹ theo thực thể, giảm cảnh báo nhiễu (risk-based alerting).','Các mô hình có sẵn: chiếm tài khoản, leo thang đặc quyền, lateral movement, exfiltration, lạm dụng quyền, tài khoản dịch vụ bất thường.','Timeline hành vi trực quan hỗ trợ điều tra; giải thích mô hình (explainable).','Watchlist người dùng rủi ro (nhân viên sắp nghỉ việc, nhà thầu, quản trị viên).','Tích hợp SIEM/SOAR/PAM/IAM để phản ứng (bắt MFA lại, hạ quyền).'],
pain:['Kẻ tấn công dùng tài khoản hợp lệ (đánh cắp qua phishing, mua trên dark web) – không có mã độc, không có chữ ký.','Mối đe doạ nội bộ: cán bộ tra cứu trái phép dữ liệu công dân, bán dữ liệu.','Rule tĩnh của SIEM sinh quá nhiều cảnh báo hoặc bỏ sót.'],
risk:['Rò rỉ dữ liệu cá nhân bởi người trong cuộc – trách nhiệm pháp lý theo Luật BVDLCN.','Tài khoản quản trị bị chiếm quyền kéo dài không bị phát hiện.','Mất niềm tin công chúng với hệ thống định danh.'],
uc:[['Phát hiện cán bộ tra cứu dữ liệu bất thường','Tài khoản vận hành thường tra 30 hồ sơ/ngày bỗng tra 3.000 hồ sơ ngoài giờ → điểm rủi ro tăng vọt, cảnh báo và tạm khoá quyền tra cứu.'],
['Tài khoản bị chiếm quyền','Đăng nhập thành công từ thiết bị mới, ASN lạ, sau đó truy cập máy chủ chưa từng truy cập.'],
['Tài khoản dịch vụ bị lạm dụng','Service account của ứng dụng bỗng đăng nhập tương tác (interactive logon) vào máy chủ khác.'],
['Nhân viên sắp nghỉ việc','Watchlist: tải lượng lớn tài liệu lên cloud cá nhân trong 2 tuần cuối.']],
tech:[['Unsupervised ML / statistical anomaly','Phát hiện bất thường không cần gắn nhãn.','OpenText ArcSight Intelligence (Interset), Exabeam, Securonix, Gurucul'],
['Peer-group analytics','So sánh với nhóm cùng vai trò.','Exabeam, Securonix, Microsoft Sentinel UEBA'],
['Risk scoring','Tích luỹ điểm rủi ro theo thực thể.','Splunk RBA, Exabeam, Stellar Cyber'],
['Insider threat (endpoint-centric)','Ghi nhận hành vi trên máy trạm + DLP.','Proofpoint ITM, Safetica, DTEX, Forcepoint'],
['Identity threat detection (ITDR)','Phát hiện tấn công vào AD/IdP.','Microsoft Defender for Identity, CrowdStrike Identity, Semperis, Silverfort']],
dia:{cols:[[{t:'Log định danh & truy cập',s:'AD · VPN · PAM · DB · App · Proxy',k:'ext'}],[{t:'SIEM / Data lake',s:'Thu thập, chuẩn hoá'}],[{t:'UEBA Engine',s:'Baseline · ML · Risk score',k:'hl'}],[{t:'Cảnh báo rủi ro',s:'Top risky users/entities'}]],ctl:{t:'SOAR · PAM · IAM',s:'Bắt MFA lại · hạ quyền · khoá',to:[2,3]}},
model:`<p><b>Nguyên lý:</b> Dữ liệu sự kiện được gán vào thực thể (user, host, IP, app) → mô hình học hành vi bình thường trong 2–4 tuần (giờ hoạt động, khối lượng, đích truy cập, thiết bị) → mỗi sự kiện mới được so với baseline cá nhân & nhóm → độ lệch quy thành điểm → điểm tích luỹ theo thời gian với hệ số suy giảm → vượt ngưỡng sinh cảnh báo kèm lý do.</p>
<ul><li>Triển khai như module trên SIEM (dùng chung dữ liệu) hoặc nền tảng riêng nhận dữ liệu từ SIEM/data lake.</li><li>Cần dữ liệu chất lượng: đồng bộ thời gian, ánh xạ tài khoản ↔ người (HR feed).</li></ul>`,
lic:{gen:['Theo <b>số người dùng/identity</b> được giám sát (phổ biến nhất).','Theo số thực thể (user + host), hoặc theo dung lượng dữ liệu khi là module SIEM.','Insider threat endpoint (ITM, Safetica) tính theo số endpoint/user.'],

S({
id:'edr',g:'sw',no:16,folder:'16. EDR-XDR',abbr:'EDR/XDR',
name:'Giải pháp bảo vệ thiết bị đầu cuối và máy chủ – EDR/XDR',layer:'Endpoint & Workload',csf:['PR','DE','RS'],
nts:'Sophos Intercept X (EDR/XDR, MDR), Kaspersky Next EDR/XDR, Stellar Cyber Open XDR, OPSWAT MetaDefender Endpoint',
src:{f:'Phát hiện, ngăn chặn, điều tra và xử lý mã độc, khai thác lỗ hổng, ransomware và hành vi tấn công trên máy chủ, máy trạm và workload'},
what:`<p><b>EPP</b> (Endpoint Protection Platform) ngăn chặn mã độc trên máy (AV thế hệ mới, ML, chống khai thác). <b>EDR</b> (Endpoint Detection & Response) <b>ghi nhận liên tục hoạt động</b> của tiến trình, file, registry, mạng, bộ nhớ trên endpoint để phát hiện hành vi tấn công, cho phép <b>điều tra (threat hunting) và phản ứng từ xa</b> (cách ly máy, kill tiến trình, rollback ransomware). <b>XDR</b> (Extended) mở rộng tương quan sang email, mạng, cloud, định danh – một console phát hiện & phản ứng hợp nhất.</p>
<p>Ngày nay EPP + EDR hợp nhất trong một agent; nhiều hãng cung cấp thêm dịch vụ <b>MDR</b> (Managed Detection & Response – đội chuyên gia hãng giám sát 24/7). Với máy chủ/workload cloud dùng CWPP (Cloud Workload Protection).</p>`,
feat:['Chống mã độc đa lớp: ML tĩnh, phân tích hành vi, chống khai thác (exploit mitigation), chống ransomware (CryptoGuard, rollback), chống fileless/script.','Ghi nhận telemetry (process tree, command line, network, registry) và lưu 30–90 ngày; truy vấn săn mối đe doạ (SQL/osquery-like).','Phát hiện theo MITRE ATT&CK, IOA/IOC, Sigma/YARA; cảnh báo kèm cây tiến trình.','Phản ứng: cách ly mạng, kill process, xoá file, remote shell (Live Response), rollback.','Kiểm soát thiết bị (USB), kiểm soát ứng dụng, firewall host, mã hoá đĩa (tuỳ hãng).','XDR: tương quan endpoint + firewall + email + identity + cloud; SOAR tích hợp.','Bảo vệ máy chủ Windows/Linux, VDI, container; chế độ ít tài nguyên; hỗ trợ OS cũ.','Quản trị tập trung (cloud hoặc on-prem/air-gapped), chống gỡ agent (tamper protection).'],
pain:['Ransomware và APT vượt qua antivirus truyền thống bằng kỹ thuật fileless, living-off-the-land (PowerShell, WMI).','Không biết chuyện gì đã xảy ra trên máy khi có sự cố – thiếu dữ liệu điều tra.','Phản ứng thủ công: phải đến tận máy hoặc remote để cách ly.','Hàng nghìn máy trạm/máy chủ phân tán nhiều đơn vị.'],
risk:['Ransomware mã hoá máy chủ & bản sao lưu, đình trệ dịch vụ.','Đánh cắp thông tin đăng nhập (Mimikatz) → chiếm domain.','Lộ lọt dữ liệu từ máy trạm cán bộ.'],
uc:[['Ngăn chặn ransomware trên máy chủ ứng dụng','Hành vi mã hoá hàng loạt bị chặn, file bị mã hoá được khôi phục tự động; máy bị cách ly và cảnh báo SOC.'],
['Săn tìm theo IOC','Cơ quan chuyên trách cảnh báo chiến dịch APT; analyst truy vấn toàn bộ 10.000 endpoint tìm hash/ domain trong 2 phút.'],
['Phát hiện đánh cắp credential','Phát hiện truy cập LSASS bất thường, chặn và cảnh báo.'],
['XDR tương quan email → endpoint','Email lừa đảo mở file → tiến trình Word sinh PowerShell → kết nối C2; XDR gom thành một sự cố duy nhất.'],
['MDR cho đơn vị thiếu nhân sự','Đội MDR của hãng giám sát 24/7, chủ động ứng cứu theo uỷ quyền.']],
tech:[['NGAV / ML','Ngăn chặn tĩnh & hành vi.','CrowdStrike Falcon, SentinelOne, Microsoft Defender, Sophos Intercept X (Deep Learning), Kaspersky'],
['EDR telemetry & hunting','Ghi nhận & truy vấn.','Tất cả Leaders EPP 2025'],
['Anti-ransomware rollback','Khôi phục file bị mã hoá.','Sophos CryptoGuard, SentinelOne rollback, Kaspersky System Watcher'],

['Device/USB control','Kiểm soát thiết bị ngoại vi.','Sophos, Kaspersky, OPSWAT MetaDefender Endpoint']],
dia:{cols:[[{t:'Endpoint & Server',s:'Windows · Linux · macOS · VDI',k:'ext'}],[{t:'Agent EPP+EDR',s:'Chặn · Ghi nhận · Phản ứng',k:'hl'}],[{t:'Console EDR/XDR',s:'Cloud hoặc On-prem',k:'hl'}],[{t:'SOC / MDR',s:'Hunting · Ứng cứu'}]],ctl:{t:'XDR: Firewall · Email · Identity · NDR · SIEM',s:'Tương quan & phản ứng chéo',to:[2,3]}},
model:`<p><b>Nguyên lý:</b> Agent nhẹ chạy ở kernel/user mode → kiểm tra file trước khi chạy (ML, reputation) → giám sát hành vi trong khi chạy (chuỗi sự kiện) → chặn nếu khớp mẫu tấn công → gửi telemetry lên console → engine phân tích tương quan sinh detection → analyst/ MDR điều tra và gửi lệnh phản ứng ngược xuống agent.</p>
<ul><li><b>Cloud console</b> (Sophos Central, Falcon) – triển khai nhanh, không cần máy chủ; <b>on-prem/air-gapped</b> (Kaspersky Security Center, một số bản Gov) cho hệ thống không ra Internet.</li><li>Triển khai theo nhóm, chạy chế độ giám sát trước, thiết lập ngoại lệ cho ứng dụng nghiệp vụ, sau đó bật chặn.</li></ul>`,
lic:{gen:['Theo <b>số endpoint/thiết bị</b> (máy trạm, máy chủ tính giá khác nhau) theo năm.','Phân tầng gói: EPP → EDR → XDR → MDR; máy chủ/workload có SKU riêng.','Lưu trữ telemetry dài hơn, module bổ sung (mobile, mã hoá, identity) tính thêm.'],
v:[['Sophos Intercept X','Theo user/endpoint/năm: Intercept X Advanced → with XDR → MDR Essentials/Complete; Server SKU riêng.','NTS phân phối – ưu tiên',1],['Kaspersky Next EDR/XDR','Theo node: Next EDR Foundations / EDR Optimum / XDR Expert; on-prem được.','NTS phân phối',1],['Stellar Cyber Open XDR','Theo GB/ngày hoặc asset – tích hợp EDR của hãng khác (open XDR).','NTS phân phối',1],['CrowdStrike Falcon','Theo endpoint: Go/Pro/Enterprise/Elite/Complete (MDR).','',0],['Microsoft Defender for Endpoint','Theo user (P1/P2, M365 E5).','',0],['SentinelOne Singularity','Theo endpoint: Core/Control/Complete/Commercial.','',0]]},
pre:[['Danh mục','Số lượng & phiên bản OS máy trạm/máy chủ (kể cả OS cũ, Linux distro), VDI, máy không ra Internet.'],['Hạ tầng','Kết nối agent → console (cloud hoặc on-prem), proxy; máy chủ quản trị nếu on-prem.'],['Gỡ bỏ AV cũ','Kế hoạch gỡ/chuyển đổi, tránh xung đột.'],['Ngoại lệ','Danh sách ứng dụng nghiệp vụ, đường dẫn cần loại trừ; thử nghiệm trên nhóm pilot.'],['Vận hành','Đội SOC hoặc MDR; quy trình phản ứng & uỷ quyền cách ly.']],
mkt:{rank:`<p><b>Gartner Magic Quadrant for Endpoint Protection Platforms 2025</b> (07/2025): <b>Leaders – CrowdStrike, Microsoft, Palo Alto Networks, SentinelOne, Sophos, Trend Micro</b>. ESET ở nhóm Challenger, Bitdefender là Visionary duy nhất (theo thông cáo). Kaspersky không còn trong các MQ gần đây nhưng vẫn được đánh giá cao ở các bài test độc lập (AV-Test, AV-Comparatives, MITRE Engenuity) và phổ biến tại Việt Nam.</p>`,

S({
id:'pam',g:'sw',no:17,folder:'17. PAM - Privileged Access Management',abbr:'PAM',
name:'Hệ thống quản lý tài khoản đặc quyền – PAM',layer:'Định danh đặc quyền',csf:['PR','DE'],
nts:'Delinea (Secret Server, Privilege Manager, Server PAM, Delinea Platform)',
src:{f:'Quản lý tài khoản quản trị; kiểm soát đăng nhập đặc quyền; quản lý mật khẩu; ghi hình phiên quản trị; kiểm soát lệnh và truy cập tới hệ thống quan trọng'},
what:`<p><b>PAM</b> kiểm soát "chìa khoá vương quốc" – các tài khoản có quyền cao nhất (root, Administrator, domain admin, sa/DBA, tài khoản thiết bị mạng, tài khoản dịch vụ, tài khoản cloud). PAM <b>cất giữ mật khẩu/khoá SSH trong kho mã hoá (vault)</b>, tự động đổi mật khẩu sau mỗi lần dùng, cấp quyền <b>đúng lúc – đúng mức (Just-in-Time, least privilege)</b> qua phê duyệt, <b>ghi hình & ghi lệnh</b> mọi phiên quản trị, chặn lệnh nguy hiểm và cung cấp bằng chứng kiểm toán.</p>
<p>Các thành phần chính: <b>Password/Secret Vault</b>, <b>Privileged Session Management</b> (proxy RDP/SSH/web), <b>Endpoint Privilege Management</b> (gỡ quyền admin cục bộ, nâng quyền theo ứng dụng), <b>Server PAM</b> (sudo/ AD bridging Linux), <b>Remote vendor access</b>, <b>Secrets cho DevOps</b>.</p>`,
feat:['Khám phá (discovery) tài khoản đặc quyền trên AD, máy chủ, thiết bị mạng, DB, cloud; phát hiện tài khoản mồ côi.','Vault mã hoá AES-256 (có thể dùng HSM), phân quyền theo vai trò, check-out/check-in có phê duyệt, dual-control.','Tự động xoay mật khẩu/khoá SSH theo chính sách hoặc sau mỗi phiên; quản lý tài khoản dịch vụ & phụ thuộc.','Proxy phiên RDP/SSH/HTTPS/DB: người dùng không biết mật khẩu thật (credential injection).','Ghi hình video phiên, ghi keystroke/lệnh, tìm kiếm theo lệnh; giám sát trực tiếp & ngắt phiên.','Kiểm soát lệnh (command filtering) – chặn rm -rf, drop database, shutdown…','MFA trước khi truy cập vault/phiên; tích hợp IdP, SIEM, ITSM (yêu cầu theo ticket).','Endpoint privilege: bỏ quyền local admin, nâng quyền theo ứng dụng, whitelist ứng dụng; Just-in-Time access.','Báo cáo kiểm toán: ai truy cập hệ thống nào, khi nào, làm gì; phát hiện bất thường.'],
pain:['Mật khẩu quản trị dùng chung, ghi trong Excel, không đổi nhiều năm; nhà thầu biết mật khẩu root.','Không biết ai đã làm gì trên máy chủ CSDL khi có sự cố; không có bằng chứng.','80% vụ xâm phạm liên quan tới thông tin đăng nhập bị đánh cắp/lạm dụng (theo các báo cáo Verizon DBIR).','Yêu cầu tuân thủ: quản lý tài khoản đặc quyền, ghi nhật ký quản trị (TCVN 11930, PCI DSS 8, ISO 27001 A.8.2).'],
risk:['Chiếm tài khoản đặc quyền → toàn quyền hệ thống, tắt cơ chế bảo vệ, xoá log.','Quản trị viên/nhà thầu lạm dụng quyền đánh cắp dữ liệu.','Không thu hồi được quyền khi nhân sự nghỉ việc.'],
uc:[['Truy cập quản trị CSDL công dân','DBA yêu cầu truy cập → trưởng ca phê duyệt theo ticket → DBA kết nối qua PAM, không biết mật khẩu sa; toàn bộ câu lệnh SQL được ghi lại; mật khẩu tự đổi khi kết thúc.'],
['Nhà thầu bảo trì từ xa','Nhà thầu đăng nhập cổng Delinea Remote Access với MFA, chỉ truy cập đúng 2 máy chủ trong khung giờ đã duyệt, phiên được ghi hình.'],
['Gỡ quyền admin máy trạm','Privilege Manager gỡ quyền local admin của 5.000 máy, chỉ nâng quyền cho phần mềm nằm trong danh sách được duyệt.'],
['Quản lý tài khoản thiết bị mạng','Mật khẩu 500 switch/router/firewall được xoay định kỳ tự động.']],
tech:[['Password vault & rotation','Lưu trữ & đổi mật khẩu tự động.','Delinea Secret Server, CyberArk PAM, BeyondTrust Password Safe, Wallix, ARCON'],
['Session management / proxy','Ghi hình, credential injection.','CyberArk PSM, Delinea, BeyondTrust, Wallix Bastion, Segura'],
['Endpoint Privilege Management','Least privilege trên endpoint.','Delinea Privilege Manager, CyberArk EPM, BeyondTrust EPM'],
['Cloud Infrastructure Entitlement (CIEM)','Quyền trên cloud.','CyberArk, Delinea, Microsoft Entra Permissions'],
['Zero Standing Privilege / JIT','Không có quyền thường trực.','CyberArk Secure Cloud Access, Delinea, StrongDM, Britive']],
dia:{cols:[[{t:'Quản trị viên / Nhà thầu',s:'',k:'ext'}],[{t:'MFA · VPN/ZTNA',s:''}],[{t:'PAM Portal + Vault',s:'Phê duyệt · Check-out',k:'hl'}],[{t:'Session Proxy',s:'RDP/SSH · Ghi hình · Lọc lệnh',k:'hl'}],[{t:'Máy chủ · DB · Thiết bị mạng',s:'Mật khẩu xoay tự động'}]],ctl:{t:'AD/IdP · HSM · SIEM · ITSM',s:'Định danh, khoá, log, ticket',to:[2,3]}},
model:`<p><b>Nguyên lý:</b> Mật khẩu của tài khoản đặc quyền chỉ PAM biết → người dùng đăng nhập PAM (MFA) → yêu cầu truy cập (kèm lý do/ticket) → phê duyệt → PAM mở phiên tới đích qua proxy và tự điền thông tin đăng nhập → phiên được ghi hình/ghi lệnh → kết thúc, PAM đổi mật khẩu.</p>
<ul><li><b>Kiến trúc:</b> Web/Vault cụm HA + DB SQL cluster + Distributed Engine/Proxy đặt tại từng vùng mạng; DR đồng bộ.</li><li>Firewall chỉ cho phép kết nối quản trị (RDP/SSH/DB) tới máy chủ <b>từ PAM proxy</b> – chặn truy cập trực tiếp.</li><li>Triển khai on-prem (Secret Server) hoặc SaaS (Delinea Platform).</li></ul>`,
lic:{gen:['Theo <b>số người dùng PAM</b> (quản trị viên dùng hệ thống) – phổ biến.','Theo <b>số tài khoản/secret hoặc số hệ thống đích</b> được quản lý (một số hãng).','Module bổ sung: session recording, remote access, EPM (theo endpoint), server PAM (theo máy chủ).','Subscription hoặc perpetual + maintenance; gói Platinum/Enterprise.'],

S({
id:'iam',g:'sw',no:18,folder:'18. IAM - MFA',abbr:'IAM/MFA',
name:'Giải pháp quản lý định danh và xác thực quản trị IAM/MFA',layer:'Định danh',csf:['PR','GV'],
nts:'OpenText NetIQ (Identity Manager, Advanced Authentication, Access Manager), Penta Security iSign (SSO), Delinea (MFA cho PAM)',
src:{f:'Quản lý định danh, xác thực nhiều yếu tố, kiểm soát quyền và chính sách truy cập vào các hệ thống quản trị'},
what:`<p><b>IAM (Identity & Access Management)</b> quản lý vòng đời định danh (tạo – thay đổi – thu hồi tài khoản theo HR/ quyết định), <b>xác thực</b> (ai đang đăng nhập), <b>uỷ quyền</b> (được làm gì) và <b>kiểm toán</b> quyền truy cập. Các nhánh: <b>IGA</b> (Identity Governance & Administration – cấp phát, rà soát quyền định kỳ, SoD), <b>Access Management</b> (SSO, liên kết SAML/OIDC, chính sách truy cập theo ngữ cảnh), <b>MFA</b> (xác thực đa yếu tố), <b>Directory</b> (AD/LDAP).</p>
<p>Với hệ thống quản trị trọng yếu, chuẩn tham chiếu là <b>NIST SP 800-63-4</b> (2025): yêu cầu mức AAL2/AAL3 – xác thực chống phishing (FIDO2/WebAuthn, chứng thư số/PKI, smartcard) thay vì OTP SMS. Lưu ý phân biệt: IAM ở đây là IAM <b>quản trị nội bộ</b> (workforce), khác với định danh công dân (CIAM) của VNeID.</p>`,
feat:['Đồng bộ định danh từ nguồn chuẩn (HR), tự động cấp/thu hồi tài khoản trên AD, ứng dụng, DB, thiết bị (provisioning connector).','Quản lý vai trò (RBAC/ABAC), quy trình yêu cầu – phê duyệt quyền, rà soát quyền định kỳ (access certification), phát hiện xung đột phân quyền (SoD).','SSO (SAML 2.0, OIDC, OAuth 2.0, Kerberos) cho ứng dụng web & quản trị.','MFA đa phương thức: FIDO2/passkey, smartcard/PKI, push, TOTP, sinh trắc học; xác thực thích ứng theo rủi ro (thiết bị, vị trí, thời gian).','Xác thực cho RDP/SSH/VPN/Windows logon (MFA cho đăng nhập máy chủ).','Chính sách mật khẩu, self-service reset, phát hiện mật khẩu bị lộ.','Nhật ký xác thực & thay đổi quyền tập trung; tích hợp SIEM/UEBA/PAM.','Hỗ trợ triển khai on-prem cho môi trường cô lập.'],
pain:['Tài khoản trên từng hệ thống quản lý rời rạc, nghỉ việc không bị khoá; quyền tích luỹ theo thời gian.','Quản trị viên chỉ dùng mật khẩu – dễ bị phishing, brute-force.','Không trả lời được câu hỏi kiểm toán "ai có quyền gì trên hệ thống nào".'],
risk:['Tài khoản mồ côi bị kẻ xấu sử dụng.','Chiếm đoạt tài khoản quản trị qua phishing/credential stuffing.','Vi phạm nguyên tắc đặc quyền tối thiểu, xung đột phân quyền dẫn tới gian lận.'],
uc:[['MFA chống phishing cho quản trị viên','Toàn bộ quản trị viên dùng khoá FIDO2/smartcard để đăng nhập VPN, PAM, console quản trị; OTP SMS bị loại bỏ.'],
['Tự động thu hồi khi nghỉ việc','HR cập nhật quyết định nghỉ việc → IGA khoá AD, VPN, PAM, ứng dụng trong vòng 15 phút.'],
['Rà soát quyền hàng quý','Trưởng bộ phận nhận danh sách quyền nhân viên, xác nhận/thu hồi trực tuyến; báo cáo lưu kiểm toán.'],
['SSO cho cổng quản trị nội bộ','Cán bộ đăng nhập một lần vào các ứng dụng nội bộ qua IdP với chính sách theo ngữ cảnh.']],
tech:[['Access Management / SSO','SAML, OIDC, chính sách ngữ cảnh.','Microsoft Entra ID, Okta, Ping Identity, IBM Verify, OpenText NetIQ Access Manager, Keycloak (OSS)'],
['IGA','Vòng đời & quản trị quyền.','SailPoint, Saviynt, Omada, One Identity, OpenText NetIQ Identity Governance, Microsoft Entra ID Governance'],
['MFA / phishing-resistant','FIDO2, PKI, push.','Cisco Duo, RSA SecurID, Okta Verify, YubiKey, OpenText NetIQ Advanced Authentication, Thales SafeNet'],
['Passwordless / passkey','Không mật khẩu.','Microsoft, Okta, Transmit Security, HYPR'],
['ITDR','Phát hiện tấn công định danh.','Microsoft Defender for Identity, CrowdStrike, Silverfort']],
dia:{cols:[[{t:'Nguồn HR / Quyết định',s:'Nguồn định danh chuẩn',k:'ext'}],[{t:'IGA',s:'Provisioning · Rà soát quyền',k:'hl'}],[{t:'Directory (AD/LDAP)',s:''}],[{t:'IdP + MFA',s:'SSO · FIDO2 · PKI · Adaptive',k:'hl'}],[{t:'Ứng dụng & Hệ thống quản trị',s:'VPN · PAM · Console · App'}]],ctl:{t:'SIEM · UEBA · PAM · HSM/PKI',s:'Log xác thực, chứng thư, đặc quyền',to:[1,3]}},
model:`<p><b>Nguyên lý:</b> (1) IGA lấy dữ liệu từ nguồn chuẩn → tạo/sửa/xoá tài khoản ở các hệ thống đích qua connector → định kỳ thu thập quyền thực tế để so sánh & rà soát. (2) Khi người dùng truy cập ứng dụng, ứng dụng chuyển hướng tới IdP → IdP xác thực (mật khẩu + yếu tố thứ hai/ FIDO2) và đánh giá rủi ro ngữ cảnh → phát hành token (SAML assertion/ID token) → ứng dụng cấp quyền theo claim/role.</p>

lic:{gen:['Theo <b>số định danh/người dùng</b> (named user) mỗi năm – phổ biến nhất.','Phân gói theo tính năng (SSO, MFA, Lifecycle, Governance); MFA phần cứng (token/khoá FIDO) tính theo thiết bị.','On-prem: perpetual + maintenance theo user; SaaS: subscription theo user/tháng.'],
v:[['OpenText NetIQ','Identity Manager/Governance theo số identity; Advanced Authentication theo user (tuỳ phương thức); Access Manager theo user.','NTS phân phối',1],['Penta Security iSign','SSO/ Access Management theo số user hoặc server.','NTS phân phối',1],['Microsoft Entra ID','Theo user: P1/P2, Entra Suite, ID Governance add-on.','',0],['Okta','Theo user/tháng theo sản phẩm (SSO, Adaptive MFA, Lifecycle, Identity Governance).','',0],['Cisco Duo','Theo user: Essentials/Advantage/Premier.','',0],['SailPoint','Theo identity (IdentityNow/ IdentityIQ).','',0]]},

S({
id:'dlp',g:'sw',no:19,folder:'19. DLP - Data Loss Prevention',abbr:'DLP',
name:'Giải pháp phòng chống thất thoát dữ liệu – DLP',layer:'Dữ liệu',csf:['PR','ID'],
nts:'Safetica, GTB Technologies, Proofpoint Enterprise DLP / ITM / ZenGuide (đào tạo nhận thức)',
src:{f:'Nhận diện, phân loại, giám sát và ngăn chặn dữ liệu nhạy cảm bị sao chép hoặc truyền ra ngoài trái phép'},
what:`<p><b>DLP</b> nhận diện dữ liệu nhạy cảm (dữ liệu cá nhân, CCCD, hồ sơ, tài liệu mật, mã nguồn) <b>ở mọi trạng thái</b>: đang lưu trữ (data-at-rest – file server, CSDL, cloud), đang truyền (data-in-motion – email, web, FTP) và đang sử dụng (data-in-use – copy USB, in ấn, chụp màn hình, clipboard, upload). Sau đó áp dụng chính sách: cho phép, cảnh báo người dùng, yêu cầu lý do, mã hoá, chặn, ghi nhận bằng chứng.</p>
<p>Bối cảnh Việt Nam: <b>Luật Bảo vệ dữ liệu cá nhân 2025</b> (hiệu lực 01/01/2026) và Nghị định 13/2023 đặt nghĩa vụ bảo vệ, đánh giá tác động và thông báo vi phạm dữ liệu cá nhân – DLP là công cụ kỹ thuật cốt lõi để thực thi. DLP hiện đại kết hợp phân loại dữ liệu, UEBA/insider risk và kiểm soát ứng dụng AI tạo sinh (chặn dán dữ liệu nhạy cảm vào ChatGPT…).</p>`,
feat:['Nhận diện nội dung: regex/từ khoá (số CCCD 12 số, số thẻ có kiểm tra Luhn), từ điển, dấu vân tay tài liệu (fingerprint – EDM/IDM), OCR ảnh, ML phân loại.','Phân loại & gắn nhãn dữ liệu (thủ công/tự động), tích hợp Microsoft Purview Information Protection.','Endpoint DLP: kiểm soát USB, in, clipboard, chụp màn hình, upload web, ứng dụng chat, ứng dụng AI tạo sinh.','Network DLP: email (SMTP/MTA), web (ICAP proxy), FTP; Cloud DLP (CASB/API cho M365, Google).','Data discovery: quét file server, SharePoint, CSDL tìm dữ liệu nhạy cảm nằm sai chỗ.','Hành động: chặn, cảnh báo, yêu cầu lý do, mã hoá, cách ly, ghi bản sao bằng chứng.','Phân tích hành vi người dùng/ rủi ro nội bộ, báo cáo sự cố DLP, quy trình xử lý vi phạm.','Quản trị tập trung, chính sách theo phòng ban/vai trò; on-prem hoặc cloud.'],
pain:['Dữ liệu công dân/khách hàng lưu rải rác trong file Excel, email, máy trạm – không biết ở đâu.','Cán bộ có thể copy dữ liệu ra USB, gửi qua email cá nhân, Zalo/Telegram.','Quy định mới về dữ liệu cá nhân yêu cầu chứng minh biện pháp bảo vệ kỹ thuật.','Nhân viên dán dữ liệu nhạy cảm vào công cụ AI công cộng.'],
risk:['Lộ lọt dữ liệu cá nhân quy mô lớn: xử phạt hành chính (theo Luật BVDLCN có mức phạt theo % doanh thu với một số vi phạm), trách nhiệm hình sự, mất uy tín.','Lộ bí mật nhà nước/ tài liệu nội bộ.','Không truy vết được nguồn rò rỉ.'],
uc:[['Chặn gửi file chứa số CCCD ra ngoài','Email gửi ra domain bên ngoài có tệp đính kèm chứa > 10 số CCCD → bị chặn, người gửi nhận thông báo, quản lý nhận cảnh báo.'],
['Kiểm soát USB tại vùng vận hành','Chỉ USB đã đăng ký & mã hoá được dùng; mọi file copy ra được ghi nhận bản sao.'],
['Phát hiện dữ liệu nhạy cảm lưu sai chỗ','Quét file server phát hiện 3.000 file chứa dữ liệu cá nhân ở thư mục chia sẻ công khai → chuyển/ mã hoá.'],
['Chặn dán dữ liệu vào AI công cộng','Endpoint DLP chặn dán nội dung có nhãn "Nội bộ" vào trang ChatGPT/Gemini.']],
tech:[['Content inspection (regex, EDM, IDM, OCR)','Nhận diện dữ liệu chính xác.','Symantec (Broadcom), Forcepoint, GTB (độ chính xác cao), Proofpoint, Microsoft Purview, Safetica'],
['Endpoint agent','Kiểm soát kênh trên máy.','Safetica, Forcepoint, Digital Guardian (Fortra), Trellix, Proofpoint Endpoint DLP'],
['Network DLP (MTA/ICAP)','Kiểm soát email/web.','Symantec, Forcepoint, GTB, Trellix'],
['Cloud DLP / CASB / SSE','Kiểm soát SaaS, cloud.','Netskope, Zscaler, Microsoft Purview, Palo Alto'],
['Data classification','Phân loại & nhãn.','Microsoft Purview, Varonis, Titus/Fortra'],
['Data Security Posture Management','Phát hiện dữ liệu trên cloud.','Varonis, Cyera, BigID, Wiz DSPM']],
dia:{cols:[[{t:'Người dùng & dữ liệu',s:'Endpoint · File server · DB',k:'ext'}],[{t:'Endpoint DLP agent',s:'USB · In · Clipboard · Upload',k:'hl'},{t:'Discovery scanner',s:'Data-at-rest',k:'hl'}],[{t:'Network DLP',s:'Email MTA · Web ICAP',k:'hl'}],[{t:'Kênh ra ngoài',s:'Internet · Email · Cloud',k:'ext'}]],ctl:{t:'DLP Management · Phân loại · SIEM/UEBA',s:'Chính sách, sự cố, bằng chứng',to:[1,2]}},
model:`<p><b>Nguyên lý:</b> Định nghĩa dữ liệu nhạy cảm (mẫu, từ điển, fingerprint) → triển khai cảm biến tại endpoint, gateway email/web, scanner lưu trữ → mỗi khi dữ liệu di chuyển qua kênh được giám sát, engine phân tích nội dung + ngữ cảnh (ai, đi đâu, qua kênh nào) → so với chính sách → thực thi hành động → ghi sự cố và bằng chứng về console.</p>
<ul><li>Lộ trình: <b>Discover</b> (biết dữ liệu ở đâu) → <b>Monitor</b> (chỉ ghi nhận, 1–3 tháng) → <b>Educate</b> (cảnh báo người dùng) → <b>Block</b> (chặn kênh rủi ro cao).</li><li>Network DLP đặt tích hợp MTA (sau email security) và proxy (ICAP).</li></ul>`,

S({
id:'vm',g:'sw',no:20,folder:'20. Vulnerability Management',abbr:'VM',
name:'Hệ thống quản lý lỗ hổng – Vulnerability Management',layer:'Quản lý rủi ro tài sản',csf:['ID','PR'],
nts:'Qualys VMDR, SecPod SanerNow CVEM, Tenable, Pentera (kiểm chứng tự động – BAS/pentest)',
src:{f:'Quét, phát hiện, đánh giá, phân loại và quản lý vòng đời xử lý lỗ hổng trên máy chủ, thiết bị, hệ điều hành, phần mềm và dịch vụ'},
what:`<p><b>Vulnerability Management (VM)</b> là quy trình liên tục: <b>khám phá tài sản → quét lỗ hổng → đánh giá & ưu tiên rủi ro → khắc phục (vá/cấu hình) → kiểm tra lại → báo cáo</b>. Công cụ VM quét chủ động (network scan có/không xác thực), dùng agent trên máy, hoặc quét thụ động lưu lượng để đối chiếu phần mềm/phiên bản với cơ sở dữ liệu lỗ hổng (CVE/NVD) và chấm điểm (CVSS).</p>
<p>Xu hướng <b>Risk-Based VM</b> và <b>Exposure Management (CTEM)</b>: ưu tiên dựa trên khả năng bị khai thác thực tế (CISA KEV, EPSS, threat intel), tầm quan trọng tài sản và đường tấn công; kết hợp <b>kiểm chứng tự động</b> (Pentera, BAS) để biết lỗ hổng nào thực sự khai thác được. Một số nền tảng (Qualys VMDR, SecPod Saner) tích hợp luôn <b>vá lỗi tự động</b> (patch management).</p>`,
feat:['Khám phá tài sản (IP, OS, dịch vụ, phần mềm, chứng thư, cloud asset), CMDB/asset inventory tự động.','Quét lỗ hổng mạng (unauthenticated/ authenticated), agent-based, quét web cơ bản, quét cloud & container image.','Cơ sở dữ liệu > 200.000 CVE, cập nhật hằng ngày; hỗ trợ OS, ứng dụng, thiết bị mạng, DB, OT.','Ưu tiên theo rủi ro: CVSS, EPSS, CISA KEV, khai thác công khai, ransomware-linked, tầm quan trọng tài sản (TruRisk/VPR).','Quản lý vòng đời khắc phục: giao việc, ticket ITSM, SLA, trạng thái, ngoại lệ, re-scan xác minh.','Tích hợp vá tự động (patch deployment) cho OS & ứng dụng bên thứ ba; giải pháp tạm (mitigation).','Dashboard, báo cáo cho lãnh đạo/kiểm toán; xu hướng rủi ro theo thời gian.','Kiểm chứng khai thác tự động (Pentera): mô phỏng kẻ tấn công thật, chứng minh đường tấn công.'],
pain:['Hàng nghìn lỗ hổng mỗi lần quét, không biết vá cái nào trước; đội vận hành quá tải.','Không có danh mục tài sản đầy đủ – không quét được thứ không biết.','Quét định kỳ theo quý trong khi lỗ hổng bị khai thác trong vài ngày sau khi công bố.','Yêu cầu Thông tư 12/2022, Chỉ thị 14: kiểm tra, đánh giá, khắc phục lỗ hổng định kỳ.'],
risk:['Bị khai thác lỗ hổng đã biết từ lâu (n-day) – nguyên nhân hàng đầu của các vụ xâm nhập.','Không đáp ứng yêu cầu kiểm tra đánh giá, bị yêu cầu dừng vận hành hệ thống.','Lãng phí nguồn lực vá lỗ hổng ít rủi ro.'],
uc:[['Quản lý lỗ hổng liên tục cho hệ thống định danh','Agent trên mọi máy chủ báo cáo lỗ hổng gần real-time; lỗ hổng trong CISA KEV trên máy chủ Internet-facing được giao SLA 48h.'],
['Phản ứng nhanh với lỗ hổng nghiêm trọng mới','Ngay khi CVE mới được công bố, truy vấn "máy nào đang chạy phiên bản bị ảnh hưởng" trong vài phút.'],
['Vá tự động','SanerNow/Qualys Patch Management vá Windows, Linux, ứng dụng bên thứ ba theo lịch, có rollback.'],
['Kiểm chứng bằng Pentera','Chạy pentest tự động hàng tháng chứng minh từ một máy trạm có thể leo thang tới domain admin; ưu tiên vá đúng mắt xích.']],
tech:[['Network & agent-based scanning','Quét chủ động & agent.','Tenable Nessus/Tenable One, Qualys VMDR, Rapid7 InsightVM, SecPod SanerNow, Greenbone OpenVAS'],
['Risk-based prioritization','EPSS, KEV, TI.','Tenable VPR, Qualys TruRisk, Rapid7 Active Risk, CrowdStrike ExPRT.AI'],
['Exposure Management / CTEM','Tài sản + lỗ hổng + đường tấn công.','Tenable One, Qualys ETM, XM Cyber, Armis'],
['Automated pentest / BAS','Kiểm chứng khai thác.','Pentera, Horizon3 NodeZero, SafeBreach, Cymulate, AttackIQ'],
['Patch management','Vá tự động.','SecPod SanerNow, Qualys Patch, Ivanti, ManageEngine, Microsoft Intune/WSUS'],
['ASM – External Attack Surface','Phát hiện tài sản trên Internet.','Qualys EASM, Tenable ASM, Palo Alto Xpanse, SecPod']],
dia:{cols:[[{t:'Tài sản',s:'Server · Network · App · Cloud · OT',k:'ext'}],[{t:'Scanner / Agent',s:'Quét định kỳ & liên tục',k:'hl'}],[{t:'VM Platform',s:'Ưu tiên rủi ro · KEV/EPSS',k:'hl'}],[{t:'Khắc phục',s:'Patch · Cấu hình · ITSM'}],[{t:'Kiểm chứng',s:'Re-scan · Pentera'}]],ctl:{t:'CMDB · SIEM · Báo cáo lãnh đạo',s:'Vòng đời lỗ hổng & KPI',to:[2,4]}},
model:`<p><b>Nguyên lý:</b> Scanner gửi probe/đăng nhập vào tài sản (hoặc agent tự thu thập) → lấy danh sách phần mềm, phiên bản, cấu hình → so khớp với cơ sở dữ liệu lỗ hổng (signature/QID/plugin) → chấm điểm rủi ro theo ngữ cảnh → tạo phiếu khắc phục → sau khi vá, quét lại xác minh và đóng phiếu.</p>
<ul><li>Scanner đặt tại từng vùng mạng (tránh quét xuyên firewall), quét xác thực bằng tài khoản quản lý qua PAM.</li><li>Agent cho máy chủ quan trọng/ máy di động; quét ngoài (external) từ Internet cho tài sản public.</li><li>Lịch quét: liên tục (agent), hằng tuần (nội bộ), hằng tháng (toàn bộ), ngay khi có CVE nghiêm trọng.</li></ul>`,
lic:{gen:['Theo <b>số tài sản/IP</b> được quét (asset-based) mỗi năm – phổ biến nhất; tài sản web app tính giá riêng.','Agent và scanner thường không tính phí riêng; module (patch, compliance, EASM, container) tính thêm.','Pentest tự động: theo số IP/ tài sản trong phạm vi kiểm chứng.'],
v:[['Qualys VMDR','Theo số asset/năm; gói VMDR gồm discovery, VM, prioritization, patch detection; Patch Management, Policy Compliance, TotalCloud tính thêm.','NTS phân phối – ưu tiên',1],['SecPod SanerNow CVEM','Theo số thiết bị: gói CVEM gồm VM + Patch + Compliance + Asset + Posture trong một agent; on-prem hoặc cloud.','NTS phân phối – ưu tiên',1],['Tenable','Nessus Pro theo scanner; Tenable Vulnerability Management/Security Center theo asset; Tenable One theo asset.','NTS phân phối',1],['Pentera','Theo số IP/asset trong phạm vi kiểm chứng (Core/Surface).','NTS phân phối',1],['Rapid7 InsightVM','Theo asset.','',0],['Greenbone OpenVAS','Mã nguồn mở; bản Enterprise appliance theo năng lực.','',0]]},

S({
id:'scm',g:'sw',no:21,folder:'21. Security Configuration - Compliance',abbr:'SCM',
name:'Giải pháp quản lý cấu hình an toàn và tuân thủ – Security Configuration/Compliance Management',layer:'Cấu hình & tuân thủ',csf:['PR','ID','GV'],
nts:'Qualys Policy Compliance / Policy Audit, SecPod SanerNow (Compliance Management), Tenable (audit)',
src:{f:'Kiểm tra cấu hình hệ điều hành, máy chủ, thiết bị và nền tảng theo baseline bảo mật; phát hiện sai lệch cấu hình và theo dõi việc khắc phục'},
what:`<p><b>Security Configuration Management (SCM)</b> đánh giá cấu hình của hệ điều hành, máy chủ ứng dụng, CSDL, thiết bị mạng, ảo hoá, cloud so với <b>baseline an toàn (hardening baseline)</b> – như <b>CIS Benchmarks</b>, DISA STIG, khuyến nghị của hãng, hay bộ tiêu chí nội bộ dựa trên TCVN 11930/Thông tư 12/2022. Kết quả là danh sách điểm không tuân thủ (mật khẩu yếu, dịch vụ thừa, SMBv1 bật, audit log tắt, TLS cũ…), điểm tuân thủ theo hệ thống, và quy trình khắc phục/ngoại lệ.</p>
<p>Nhiều sự cố không đến từ lỗ hổng phần mềm mà từ <b>cấu hình sai</b>. SCM thường đi kèm VM (cùng agent/scanner), và một số giải pháp có khả năng <b>tự động khắc phục</b> (auto-remediation) cấu hình.</p>`,
feat:['Thư viện chính sách có sẵn: CIS (hàng trăm benchmark), DISA STIG, PCI DSS, ISO 27001, NIST 800-53, HIPAA; cho phép tạo chính sách tuỳ biến (ví dụ bộ tiêu chí theo quy định Việt Nam).','Đánh giá OS (Windows/Linux/Unix), DB (Oracle, SQL Server, PostgreSQL), web/app server, thiết bị mạng (Cisco, Juniper, Fortinet), VMware, Kubernetes, cloud (AWS/Azure/GCP – CSPM).','Thu thập bằng agent hoặc quét xác thực; đánh giá liên tục, phát hiện drift so với baseline.','Báo cáo mức độ tuân thủ theo hệ thống/đơn vị/chính sách; bằng chứng cho kiểm toán.','Khắc phục: hướng dẫn chi tiết, script, hoặc tự động khắc phục (SanerNow, Qualys Audit Fix).','Quản lý ngoại lệ có phê duyệt & thời hạn; theo dõi tiến độ khắc phục, SLA.','Tích hợp ITSM, SIEM; dashboard điều hành.'],
pain:['Hàng nghìn máy chủ/thiết bị cấu hình thủ công, mỗi người một kiểu; sau khi cài đặt không ai kiểm tra lại.','Kiểm tra đánh giá ATTT định kỳ tốn hàng tuần làm thủ công bằng checklist Excel.','Cấu hình bị thay đổi (drift) sau mỗi lần bảo trì, không phát hiện.'],
risk:['Bị khai thác do cấu hình mặc định/yếu (tài khoản mặc định, giao thức cũ, chia sẻ mở).','Không đạt yêu cầu tuân thủ khi kiểm tra của cơ quan quản lý/ kiểm toán.','Không thể chứng minh hệ thống đã được hardening theo hồ sơ cấp độ.'],
uc:[['Hardening máy chủ hệ thống định danh theo CIS Level 1/2','Đánh giá 500 máy chủ Linux/Windows hằng tuần, tự sinh báo cáo % tuân thủ theo từng phân hệ; khắc phục tự động các mục an toàn.'],
['Bộ tiêu chí theo quy định Việt Nam','Xây chính sách tuỳ biến ánh xạ yêu cầu kỹ thuật của TCVN 11930:2017 cấp độ 4 để tự kiểm tra trước đợt đánh giá.'],
['Kiểm tra cấu hình thiết bị mạng','Đối chiếu cấu hình 300 switch/router/firewall với baseline (SSH v2, tắt telnet, AAA, logging).'],
['Phát hiện drift sau bảo trì','Sau khi nhà thầu nâng cấp ứng dụng, SCM phát hiện dịch vụ debug được bật lại và cảnh báo.']],
tech:[['Policy/compliance scanning','Đánh giá cấu hình theo benchmark.','Qualys Policy Compliance, Tenable (Security Center audit), Rapid7, SecPod SanerNow, CIS-CAT Pro'],
['File & config integrity / SCM','Giám sát thay đổi cấu hình.','Tripwire Enterprise (Fortra), Netwrix Change Tracker'],
['CSPM','Tuân thủ cấu hình cloud.','Wiz, Prisma Cloud, Microsoft Defender for Cloud, Qualys TotalCloud'],
['Infrastructure as Code / Policy as Code','Ansible, Chef InSpec, OPA – áp cấu hình chuẩn.','Red Hat Ansible, Progress Chef, OPA'],
['Auto-remediation','Tự khắc phục cấu hình.','SecPod SanerNow, Qualys Audit Fix, Microsoft Intune']],
dia:{cols:[[{t:'Baseline',s:'CIS · STIG · TCVN · Nội bộ',k:'ext'}],[{t:'SCM Policy Engine',s:'Chính sách & ngoại lệ',k:'hl'}],[{t:'Agent / Quét xác thực',s:'OS · DB · Network · Cloud'}],[{t:'Kết quả tuân thủ',s:'% · Drift · Bằng chứng',k:'hl'}],[{t:'Khắc phục',s:'Script · Auto-fix · ITSM'}]],ctl:{t:'Báo cáo lãnh đạo · Kiểm toán · SIEM',s:'',to:[3]}},
model:`<p><b>Nguyên lý:</b> Mỗi baseline gồm các "control" (ví dụ: "Tắt SMBv1", "Độ dài mật khẩu ≥ 14") với cách kiểm tra cụ thể (registry key, file cấu hình, lệnh) → agent/scanner thu thập giá trị thực tế → so với giá trị kỳ vọng → Pass/Fail → tổng hợp điểm tuân thủ → phát phiếu khắc phục.</p>
<ul><li>Dùng chung hạ tầng agent/scanner của VM để giảm chi phí.</li><li>Lộ trình: chọn baseline → chạy đánh giá hiện trạng (gap) → thử nghiệm khắc phục trên môi trường test → khắc phục theo đợt → giám sát drift liên tục.</li></ul>`,
