S({
id:'dam',g:'sw',no:22,folder:'22. Database Security - DAM',abbr:'DAM/DB Security',
name:'Giải pháp bảo vệ và giám sát cơ sở dữ liệu – Database Security/DAM',layer:'Dữ liệu (CSDL)',csf:['PR','DE'],
nts:'Penta Security D\'Amo (mã hoá CSDL), OpenText Voltage (bảo vệ dữ liệu cấp trường), Delinea (đặc quyền DBA) – DAM chuyên dụng chưa có trong danh mục NTS',
src:{f:'Theo dõi các truy cập tới cơ sở dữ liệu, phát hiện hành vi bất thường, kiểm soát tài khoản đặc quyền và cảnh báo truy cập trái phép'},
what:`<p><b>DAM (Database Activity Monitoring)</b> giám sát và ghi nhận <b>mọi câu lệnh SQL</b> tới cơ sở dữ liệu – bao gồm cả truy cập của DBA/tài khoản đặc quyền – độc lập với cơ chế audit gốc của DB (không thể bị DBA tắt/xoá). Khi kết hợp chức năng chặn, DAM trở thành <b>Database Firewall (DBF)</b>: chặn câu lệnh vi phạm chính sách (SQL injection, truy vấn hàng loạt bảng nhạy cảm, lệnh DROP ngoài giờ).</p>
<p>Bảo mật CSDL toàn diện (Data Security Platform) còn gồm: khám phá & phân loại dữ liệu nhạy cảm trong DB, đánh giá lỗ hổng/cấu hình DB, <b>mã hoá</b> (TDE, mã hoá cột, tokenization, format-preserving encryption), <b>che dữ liệu</b> (masking tĩnh/động), quản lý quyền người dùng DB.</p>`,
feat:['Giám sát 100% hoạt động SQL (DML, DDL, DCL), kể cả truy cập cục bộ (local/ bequeath) qua agent.','Ghi log kiểm toán độc lập, chống sửa xoá, tách biệt quyền với DBA (separation of duties).','Chính sách thời gian thực: cảnh báo/chặn theo user, ứng dụng, IP, bảng, số dòng trả về, khung giờ.','Phát hiện SQL injection, truy cập bất thường (UEBA cho DB), lạm dụng đặc quyền.','Khám phá CSDL & dữ liệu nhạy cảm (CCCD, số điện thoại, tài khoản); đánh giá lỗ hổng DB (vulnerability assessment).','Dynamic data masking: che dữ liệu theo vai trò khi truy vấn; mã hoá/tokenization.','Rà soát quyền người dùng DB (entitlement review).','Báo cáo tuân thủ (PCI DSS, Luật BVDLCN, SOX); tích hợp SIEM/SOAR.'],
pain:['CSDL chứa dữ liệu của hàng chục triệu công dân – mục tiêu số 1; DBA có toàn quyền và có thể tắt audit gốc.','Audit gốc của DB làm giảm hiệu năng, log khó tra cứu, mỗi loại DB một kiểu.','Ứng dụng dùng chung 1 tài khoản DB – không biết người dùng cuối nào đã truy vấn gì.','Yêu cầu chứng minh kiểm soát truy cập dữ liệu cá nhân theo Luật BVDLCN 2025.'],
risk:['DBA/người trong cuộc trích xuất dữ liệu hàng loạt mà không để lại dấu vết.','SQL injection qua ứng dụng lấy toàn bộ bảng dữ liệu.','Không đủ bằng chứng điều tra khi dữ liệu bị rao bán.'],
uc:[['Giám sát DBA trên CSDL dân cư','Mọi câu lệnh của DBA được ghi lại độc lập; truy vấn SELECT trả về > 10.000 bản ghi bảng công dân ngoài giờ → chặn và cảnh báo.'],
['Gắn người dùng cuối với truy vấn','DAM nhận diện người dùng ứng dụng (application user) phía sau connection pool để truy vết.'],
['Che dữ liệu cho môi trường test/ đối tác','Masking số CCCD/SĐT khi đội phát triển truy vấn môi trường kiểm thử.'],
['Mã hoá cột dữ liệu nhạy cảm','Penta D\'Amo/Voltage mã hoá cột CCCD; khoá quản lý ở KMS/HSM.']],
tech:[['Network-based DAM','Bắt SQL qua mạng (span/proxy).','Imperva Data Security (Thales), IBM Guardium, DataSunrise'],
['Agent-based DAM','Agent trên máy chủ DB, bắt cả truy cập local.','IBM Guardium S-TAP, Imperva agent, Oracle AVDF'],
['Database Firewall (inline/proxy)','Chặn câu lệnh vi phạm.','Oracle AVDF (Database Firewall), Imperva, DataSunrise, Fortinet FortiDB'],
['Encryption / Tokenization / FPE','Mã hoá cấp cột/ trường.','Penta D\'Amo, OpenText Voltage SecureData, Thales CipherTrust, Protegrity'],
['Data masking','Che dữ liệu động/tĩnh.','Oracle, Imperva, Delphix, Informatica'],
['DSPM / Data Security Platform','Khám phá & bảo vệ dữ liệu hợp nhất.','Imperva DSF, Varonis, Cyera, IBM Guardium Data Security Center']],
dia:{cols:[[{t:'Người dùng · Ứng dụng · DBA',s:'',k:'ext'}],[{t:'DB Firewall / Proxy',s:'Chặn SQL vi phạm',k:'hl'}],[{t:'CSDL',s:'Oracle · SQL · PostgreSQL · MongoDB'},{t:'DAM Agent',s:'Bắt truy cập local',k:'hl'}],[{t:'DAM Gateway & Console',s:'Chính sách · Audit · Báo cáo',k:'hl'}]],ctl:{t:'SIEM · PAM · KMS/HSM',s:'Cảnh báo, đặc quyền, khoá mã hoá',to:[1,3]}},
model:`<p><b>Nguyên lý:</b> Agent (S-TAP) trên máy chủ DB hoặc sensor mạng bắt toàn bộ phiên SQL → gửi về gateway phân tích (parse câu lệnh, xác định đối tượng, số dòng trả về, user) → đối chiếu chính sách → ghi log audit độc lập + cảnh báo; ở chế độ firewall, câu lệnh bị chặn trước khi tới DB (proxy/inline) hoặc phiên bị ngắt (agent).</p>
<ul><li>Gateway cụm HA, tách biệt quản trị với DBA; lưu trữ audit dài hạn có nén.</li><li>Bắt đầu chế độ giám sát, học hành vi ứng dụng, sau đó áp chính sách chặn cho truy cập đặc quyền.</li></ul>`,
lic:{gen:['Theo <b>số instance/ máy chủ CSDL</b> hoặc theo <b>số core CPU (PVU)</b> của máy chủ DB được giám sát.','Theo dung lượng dữ liệu/ số nguồn (Data Security Platform SaaS).','Mã hoá: theo số máy chủ DB/ ứng dụng hoặc số core; KMS tính riêng.'],
v:[['Penta Security D\'Amo','Theo số máy chủ DB/ instance (D\'Amo DP/ KE/ BA tuỳ phương thức mã hoá); D\'Amo KMS riêng.','NTS phân phối',1],['OpenText Voltage SecureData','Theo ứng dụng/ server/ dung lượng; Voltage Fusion (discovery).','NTS phân phối',1],['Imperva (Thales) Data Security','Theo số DB server/ core hoặc dung lượng (DSF).','',0],['IBM Guardium','Theo PVU/ RVU (theo core) hoặc gói Data Security Center.','',0],['Oracle AVDF','Theo số processor của DB được bảo vệ.','',0],['DataSunrise / FortiDB','Theo instance DB.','',0]]},
pre:[['Danh mục DB','Loại & phiên bản DB, số instance, cluster/RAC, khối lượng giao dịch (TPS) để sizing.'],['Kiến trúc','Chọn agent/ network/ proxy; mở kết nối agent → gateway; quyền cài agent trên máy chủ DB.'],['Chính sách','Bảng/cột nhạy cảm, người dùng đặc quyền, ứng dụng hợp lệ, ngưỡng truy vấn.'],['Thử nghiệm','Kiểm tra ảnh hưởng hiệu năng (thường < 3% với agent), đặc biệt với DB lõi.']],
mkt:{rank:`<p>Gartner không còn MQ cho DAM; tham chiếu Forrester Wave Data Security Platforms 2025 và Gartner Market Guide for Data Security Platforms. Các hãng dẫn đầu DAM/DBF: <b>Imperva (thuộc Thales)</b>, <b>IBM Guardium</b>, <b>Oracle Audit Vault & Database Firewall</b>; khác: DataSunrise, Fortinet FortiDB, Trellix Database Security; mã hoá CSDL: Thales CipherTrust, Penta D'Amo, OpenText Voltage, Protegrity.</p>`,
v:[['Imperva (Thales)','Data Security Fabric / DAM','Dẫn đầu DAM'],['IBM','Guardium','Dẫn đầu DAM, nhiều DB'],['Oracle','Audit Vault & Database Firewall','Tối ưu Oracle DB'],['DataSunrise','Database Security Suite','Giá cạnh tranh'],['Fortinet','FortiDB',''],['Penta Security','D\'Amo','Mã hoá CSDL – NTS phân phối'],['OpenText','Voltage SecureData','FPE/Tokenization – NTS phân phối']]},
cmp:{h:['Tiêu chí','Imperva DSF','IBM Guardium','Oracle AVDF','DataSunrise'],r:[['Đa nền tảng DB','Rất rộng (SQL, NoSQL, cloud)','Rất rộng','Oracle, SQL Server, MySQL… (mạnh nhất Oracle)','Rộng'],['Chặn (firewall)','Có (agent/gateway)','Có (S-GATE)','Có (Database Firewall)','Có (proxy)'],['Hiệu năng/scale','Cao','Cao','Cao','TB'],['Chi phí','Cao','Cao','TB (theo Oracle)','Thấp–TB'],['Phù hợp','Gov/Bank đa DB','Tập đoàn lớn','Hệ thống thuần Oracle','Ngân sách hạn chế']]},
ref:[['NIST SP 800-53r5 – AU (Audit & Accountability)','https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final'],['NIST SP 1800-25 – Data Integrity: Identifying & Protecting','https://csrc.nist.gov/pubs/sp/1800/25/final'],['Imperva Data Security','https://www.imperva.com/products/data-security-fabric/'],['IBM Guardium','https://www.ibm.com/products/guardium-data-protection'],['Oracle Audit Vault and Database Firewall','https://www.oracle.com/security/database-security/audit-vault-database-firewall/'],['Penta Security D\'Amo','https://www.pentasecurity.com/product/damo/']]

S({
id:'secrets',g:'sw',no:23,folder:'23. Secrets Management',abbr:'Secrets Mgmt',
name:'Giải pháp quản lý bí mật ứng dụng – Secrets Management',layer:'DevOps & ứng dụng',csf:['PR'],
nts:'Delinea Secret Server, Delinea DevOps Secrets Vault (DSV)',
src:{f:'Quản lý tập trung mật khẩu, API key, token, certificate và các thông tin xác thực được ứng dụng, dịch vụ và pipeline sử dụng'},
what:`<p><b>Secrets Management</b> giải quyết bài toán "<b>mật khẩu nằm trong mã nguồn</b>": thông tin xác thực máy–máy (machine identity) như mật khẩu DB của ứng dụng, API key đối tác, token cloud, khoá SSH, chứng thư TLS, khoá ký JWT… thường bị viết cứng (hard-code) trong code, file cấu hình, biến môi trường, CI/CD. Giải pháp quản lý bí mật lưu chúng trong <b>kho mã hoá tập trung</b>, cấp phát cho ứng dụng <b>khi chạy (runtime)</b> qua API/SDK/agent sau khi xác thực danh tính workload, ghi log mọi lần truy xuất, và hỗ trợ <b>bí mật động</b> (dynamic secrets – sinh mật khẩu DB tạm thời, tự hết hạn) và xoay vòng tự động.</p>
<p>Số lượng machine identity hiện vượt xa người dùng (hàng chục lần) – đây là bề mặt tấn công lớn trong môi trường microservices/Kubernetes/CI-CD. Tham chiếu NIST SP 800-204C (DevSecOps) và SP 800-57.</p>`,
feat:['Kho bí mật mã hoá (AES-256, khoá gốc trong HSM/KMS), phân quyền theo đường dẫn/namespace/ứng dụng.','Xác thực workload: Kubernetes service account, cloud IAM role, AppRole, mTLS, OIDC (CI/CD như GitLab/GitHub Actions).','Dynamic secrets: tạo tài khoản DB/cloud tạm thời theo yêu cầu, tự thu hồi khi hết TTL.','Xoay vòng (rotation) tự động mật khẩu/API key không làm gián đoạn ứng dụng.','Tích hợp Kubernetes (CSI driver, sidecar injector, External Secrets Operator), Terraform, Ansible, Jenkins.','Encryption-as-a-Service, PKI engine cấp chứng thư ngắn hạn.','Phát hiện bí mật bị lộ trong mã nguồn (secret scanning) – kết hợp với công cụ SAST/Git scanning.','Nhật ký kiểm toán chi tiết, HA/replication đa DC.'],
pain:['Mật khẩu DB của ứng dụng nằm trong file config trên Git, nhiều người biết, không bao giờ đổi.','API key đối tác/ token cloud bị lộ qua repository công khai hoặc log.','Đổi một mật khẩu dịch vụ phải sửa và triển khai lại hàng chục ứng dụng.','Pipeline CI/CD có quyền rất cao nhưng bí mật lưu dạng plaintext trong biến.'],
risk:['Kẻ tấn công lấy được mã nguồn/ máy build là có luôn thông tin đăng nhập hệ thống sản xuất.','Rò rỉ bí mật dẫn tới chiếm quyền cloud, truy cập CSDL công dân.','Không xác định được ứng dụng nào dùng bí mật nào khi phải thu hồi.'],
uc:[['Loại bỏ mật khẩu cứng trong microservices VNeID','Mỗi service lấy mật khẩu DB khi khởi động từ vault qua Kubernetes auth; mật khẩu xoay 24h/lần.'],
['Bí mật trong pipeline CI/CD','Pipeline xác thực bằng OIDC token để lấy credential triển khai tạm thời; không lưu secret trong biến CI.'],
['Quản lý API key đối tác','Key kết nối ngân hàng/ viễn thông lưu tập trung, xoay định kỳ, ghi log truy xuất.'],
['Hợp nhất với PAM','Delinea Secret Server quản lý cả mật khẩu người quản trị (PAM) và bí mật ứng dụng, DSV phục vụ DevOps.']],
tech:[['Secrets vault','Kho bí mật tập trung.','HashiCorp Vault (IBM), CyberArk Conjur/Secrets Manager, Delinea DSV/Secret Server, Akeyless, Infisical, Doppler'],
['Cloud-native secrets','Dịch vụ của nhà cung cấp cloud.','AWS Secrets Manager, Azure Key Vault, Google Secret Manager'],
['Kubernetes integration','CSI driver, External Secrets Operator, Sealed Secrets.','ESO, Bitnami Sealed Secrets, Vault Agent'],
['Workload identity','SPIFFE/SPIRE, OIDC federation.','SPIRE, cloud IAM'],
['Secret scanning','Phát hiện bí mật trong code.','GitGuardian, GitHub secret scanning, TruffleHog, Gitleaks']],
dia:{cols:[[{t:'Ứng dụng · Microservice · CI/CD',s:'',k:'ext'}],[{t:'Xác thực workload',s:'K8s SA · OIDC · AppRole · mTLS'}],[{t:'Secrets Vault (HA)',s:'Static · Dynamic · Rotation',k:'hl'}],[{t:'Hệ thống đích',s:'DB · Cloud · API đối tác'}]],ctl:{t:'HSM/KMS (khoá gốc) · SIEM (audit) · PAM',s:'',to:[2]}},
model:`<p><b>Nguyên lý:</b> Ứng dụng chứng minh danh tính (token Kubernetes, chứng thư, role cloud) → vault xác minh với nguồn tin cậy → cấp token ngắn hạn với chính sách → ứng dụng đọc bí mật (hoặc yêu cầu sinh bí mật động) → vault ghi log → bí mật hết hạn/ được xoay tự động; ứng dụng làm mới theo TTL.</p>
<ul><li>Cụm HA (Raft/ DB backend) tại DC chính + replication DR; khoá gốc (unseal/master key) bảo vệ bằng HSM.</li><li>Tích hợp dần: ứng dụng mới → ứng dụng quan trọng → toàn bộ; quét Git để tìm & thu hồi bí mật đã lộ.</li></ul>`,
lic:{gen:['Theo <b>số client/ workload/ ứng dụng</b> truy cập vault, hoặc theo <b>số secret</b> được quản lý.','Theo số node cluster/ gói Enterprise (HA, DR replication, namespaces, HSM integration).','Cloud: theo số secret/tháng + số lượt gọi API.','Mã nguồn mở (OpenBao, Infisical OSS) miễn phí – tự vận hành.'],

pre:[['Danh mục bí mật','Kiểm kê bí mật hiện có (quét Git, config, CI), ứng dụng sử dụng, chủ sở hữu.'],['Nền tảng','Kubernetes/ VM/ CI-CD đang dùng để chọn cơ chế tích hợp; hỗ trợ ngôn ngữ/SDK.'],['Bảo mật khoá gốc','HSM/KMS cho auto-unseal; quy trình khôi phục (recovery keys) M-of-N.'],['Đội DevOps','Thay đổi code/ manifest để đọc bí mật từ vault; kế hoạch chuyển đổi theo đợt.']],

S({
id:'sast',g:'sw',no:24,folder:'24. SAST',abbr:'SAST',
name:'Giải pháp an toàn mã nguồn – SAST',layer:'DevSecOps (phát triển)',csf:['PR','ID'],
nts:'OpenText Fortify Static Code Analyzer (SAST), Fortify on Demand, Fortify Software Security Center',
src:{f:'Phân tích mã nguồn để phát hiện sớm các điểm yếu và lỗ hổng trong quá trình phát triển phần mềm'},
what:`<p><b>SAST (Static Application Security Testing)</b> phân tích <b>mã nguồn, bytecode hoặc binary</b> mà không cần chạy ứng dụng ("white-box"), để tìm lỗi bảo mật như SQL Injection, XSS, Command Injection, deserialization, path traversal, mật khẩu cứng, dùng thuật toán mật mã yếu… và chỉ ra <b>chính xác dòng code</b>, luồng dữ liệu từ nguồn (source) đến điểm nguy hiểm (sink) cùng hướng dẫn sửa. SAST được tích hợp vào IDE, pipeline CI/CD để phát hiện lỗi ngay khi lập trình (shift-left) – chi phí sửa rẻ hơn nhiều lần so với khi đã lên sản xuất.</p>
<p>SAST là một mảnh của <b>AST (Application Security Testing)</b> cùng DAST, SCA, IaC scanning, secrets scanning; quản lý tập trung qua ASPM. Tham chiếu: NIST SSDF SP 800-218, OWASP SAMM/ASVS, NIST IR 8397.</p>`,
feat:['Hỗ trợ nhiều ngôn ngữ/framework (Java, C#, C/C++, JavaScript/TypeScript, Python, Go, PHP, Kotlin, Swift, COBOL, ABAP… – Fortify ~33+ ngôn ngữ).','Phân tích luồng dữ liệu (taint analysis), luồng điều khiển, cấu trúc, cấu hình; bộ rule theo CWE, OWASP Top 10, SANS 25, PCI DSS, ASVS.','Plugin IDE (VS, IntelliJ, Eclipse, VS Code), tích hợp CI/CD (Jenkins, GitLab, GitHub, Azure DevOps), quét PR/incremental.','Ưu tiên kết quả, giảm false positive bằng AI/ML (Fortify Audit Assistant / Aviator), gợi ý sửa code bằng AI.','Quản lý tập trung kết quả, phân loại, theo dõi khắc phục theo dự án/phiên bản (Fortify SSC).','Báo cáo tuân thủ & cổng chất lượng (quality gate) chặn build khi có lỗi nghiêm trọng.','Quét IaC (Terraform, K8s YAML), phát hiện bí mật trong code.','Triển khai on-prem (mã nguồn không ra ngoài) hoặc SaaS.'],
pain:['Ứng dụng dịch vụ công do nhiều nhà thầu phát triển, chất lượng bảo mật không đồng đều; lỗ hổng chỉ phát hiện khi pentest trước nghiệm thu (quá muộn).','Không có tiêu chí bảo mật mã nguồn trong nghiệm thu phần mềm.','Đội phát triển thiếu kiến thức lập trình an toàn.','Yêu cầu kiểm tra mã nguồn trước khi đưa vào vận hành hệ thống cấp độ cao.'],
risk:['Lỗ hổng lập trình (SQLi, RCE) bị khai thác sau khi lên sản xuất.','Chi phí sửa lỗi muộn tăng gấp nhiều lần, chậm tiến độ.','Mã độc/ backdoor do nhà thầu cài cắm không được phát hiện.'],
uc:[['Cổng kiểm tra nghiệm thu mã nguồn','Mọi phiên bản phần mềm của nhà thầu phải qua quét Fortify SAST; không có lỗi Critical/High mới được triển khai.'],
['DevSecOps trong pipeline','Mỗi merge request được quét incremental trong vài phút, lỗi hiển thị ngay trong GitLab.'],
['Đào tạo lập trình an toàn','Lập trình viên xem giải thích lỗi & cách sửa ngay trong IDE.'],
['Rà soát mã nguồn ứng dụng mua ngoài','Quét mã nguồn/ binary ứng dụng bên thứ ba trước khi tích hợp vào hệ thống lõi.']],
tech:[['SAST thương mại','Phân tích sâu, nhiều ngôn ngữ.','OpenText Fortify, Checkmarx One, Black Duck (Coverity, Polaris), Veracode, HCL AppScan'],
['Developer-first SAST','Nhanh, tích hợp dev.','Snyk Code, Semgrep, GitHub CodeQL, SonarQube, GitLab SAST'],
['AI-assisted triage & fix','AI lọc false positive, gợi ý sửa.','Fortify Aviator, Checkmarx AI, Snyk DeepCode AI, GitHub Copilot Autofix'],
['ASPM','Tổng hợp & ưu tiên kết quả AST.','Fortify SSC/ASPM, Checkmarx, ArmorCode, Apiiro'],
['IaC & secrets scanning','Quét hạ tầng dưới dạng code.','Fortify, Checkov, Snyk IaC, GitGuardian']],
dia:{cols:[[{t:'Lập trình viên',s:'IDE plugin',k:'ext'}],[{t:'Git / Repository',s:'Merge request'}],[{t:'CI/CD Pipeline',s:'Build'}],[{t:'SAST Engine',s:'Taint analysis · Rules · AI',k:'hl'}],[{t:'Quality Gate',s:'Pass → Deploy / Fail → Sửa'}]],ctl:{t:'Software Security Center (ASPM) · Jira/ITSM',s:'Quản lý lỗ hổng, báo cáo nghiệm thu',to:[3,4]}},
model:`<p><b>Nguyên lý:</b> Bộ dịch (translator) chuyển mã nguồn thành mô hình trung gian → engine phân tích theo nhiều bộ phân tích (dataflow, controlflow, semantic, structural, configuration) dựa trên rulepack → xác định đường đi của dữ liệu không tin cậy tới hàm nguy hiểm → sinh finding với mức độ, CWE, vị trí → kết quả đưa lên máy chủ quản lý để audit (xác nhận/ loại bỏ), giao việc, theo dõi.</p>
<ul><li>Triển khai on-prem: máy chủ SSC + các build agent/ScanCentral sensor; hoặc SaaS (Fortify on Demand) kèm dịch vụ audit của chuyên gia.</li><li>Lộ trình: dự án pilot → chuẩn hoá chính sách (lỗi nào chặn build) → mở rộng toàn bộ dự án & nhà thầu.</li></ul>`,
lic:{gen:['Theo <b>số lập trình viên đóng góp code</b> (contributing developers) – phổ biến nhất hiện nay.','Theo <b>số ứng dụng</b> (application-based) hoặc số lần quét (scan-based, FoD assessment units).','Theo số dòng code (LOC) – mô hình cũ; module SCA/DAST tính riêng hoặc bundle.'],
v:[['OpenText Fortify SAST (on-prem)','Theo số contributing developer/năm (hoặc perpetual + maintenance); ScanCentral, SSC đi kèm; Aviator AI tính thêm.','NTS phân phối – ưu tiên',1],['OpenText Fortify on Demand','Theo ứng dụng/năm (subscription) hoặc assessment unit (theo lần quét, có audit của chuyên gia).','NTS phân phối',1],['Checkmarx One','Theo developer, gói platform (SAST+SCA+…).','',0],['Black Duck (Coverity/Polaris)','Theo developer hoặc LOC/ ứng dụng.','',0],['Veracode','Theo ứng dụng/ developer (SaaS).','',0],['Snyk Code','Theo developer (Team/Enterprise).','',0]]},
pre:[['Mã nguồn','Danh sách dự án, ngôn ngữ, framework, kích thước (LOC), hệ thống build (Maven, Gradle, MSBuild, npm).'],['Hạ tầng','Máy chủ SSC (DB), sensor quét (CPU/RAM theo kích thước code); kết nối Git/CI.'],['Quy trình','Chính sách bảo mật mã nguồn (mức lỗi chặn), quy trình audit kết quả, điều khoản yêu cầu nhà thầu trong hợp đồng.'],['Nhân sự','Security champion trong đội dev; đào tạo sử dụng & lập trình an toàn.']],
mkt:{rank:`<p><b>Gartner Magic Quadrant for Application Security Testing 2025</b> (10/2025): <b>Leaders – Black Duck, Checkmarx, HCLSoftware, OpenText, Snyk, Veracode</b>. OpenText (Fortify) là Leader 11 năm liên tiếp; Sonatype ở nhóm Visionary. Các hãng khác: GitHub (Advanced Security), GitLab, SonarSource, Semgrep, Contrast Security, Invicti, Mend.io.</p>`,
v:[['OpenText','Fortify SAST / FoD / SSC','Leader AST 2025 (11 năm) – NTS phân phối'],['Checkmarx','Checkmarx One','Leader'],['Black Duck','Coverity, Polaris','Leader'],['Veracode','Veracode Platform','Leader'],['Snyk','Snyk Code','Leader'],['HCLSoftware','AppScan','Leader'],['GitHub','Advanced Security (CodeQL)',''],['SonarSource','SonarQube','Chất lượng code + bảo mật']]},
cmp:{h:['Tiêu chí','OpenText Fortify','Checkmarx One','Veracode','Snyk Code'],r:[['Ngôn ngữ','Rộng nhất (33+ kể cả COBOL/ABAP)','Rộng (35+)','Rộng (binary scan)','Phổ biến hiện đại'],['Triển khai','On-prem + SaaS','Cloud + on-prem','SaaS (chủ yếu)','SaaS'],['Độ sâu phân tích','Rất sâu, độ phủ cao','Sâu, nhanh','Phân tích binary','Nhanh, dev-first'],['False positive','Cao hơn nếu không audit → có Audit Assistant/Aviator','TB','Thấp','Thấp'],['Phù hợp','Gov/Bank on-prem, mã nguồn không ra ngoài','Enterprise','SaaS, ứng dụng mua ngoài','Đội dev hiện đại']]},
ref:[['NIST SP 800-218 – SSDF','https://csrc.nist.gov/pubs/sp/800/218/final'],['NIST IR 8397 – Minimum Standards for Developer Verification','https://csrc.nist.gov/pubs/ir/8397/final'],['OpenText – Leader Gartner MQ AST 2025','https://blogs.opentext.com/2025-gartner-magic-quadrant-for-application-security-testing-opentext-named-a-leader-11-years-running/'],['OWASP ASVS','https://owasp.org/www-project-application-security-verification-standard/'],['CWE Top 25','https://cwe.mitre.org/top25/'],['NTS Hà Nội – Fortify SAST','https://ntshanoi.com.vn/san-pham/opentext-fortify-sast']]

S({
id:'dast',g:'sw',no:25,folder:'25. DAST',abbr:'DAST',
name:'Giải pháp kiểm thử an toàn ứng dụng – DAST',layer:'DevSecOps (kiểm thử)',csf:['ID','PR'],
nts:'OpenText Fortify WebInspect / Fortify DAST, Fortify on Demand (DAST), Pentera (pentest tự động hạ tầng)',
src:{f:'Kiểm thử ứng dụng khi đang hoạt động để phát hiện lỗ hổng có khả năng bị khai thác từ bên ngoài'},
what:`<p><b>DAST (Dynamic Application Security Testing)</b> kiểm thử ứng dụng web/API <b>đang chạy</b> theo góc nhìn kẻ tấn công ("black-box"): crawl toàn bộ trang & API, gửi hàng nghìn payload tấn công (SQLi, XSS, SSRF, XXE, lỗi xác thực/phiên, cấu hình sai TLS/header) rồi phân tích phản hồi để xác định lỗ hổng <b>thực sự khai thác được</b>. DAST không phụ thuộc ngôn ngữ lập trình và phát hiện được lỗi cấu hình/ môi trường mà SAST không thấy.</p>
<p>Biến thể: <b>IAST</b> (agent trong runtime theo dõi khi DAST/ kiểm thử chức năng chạy), <b>API DAST</b> (dựa trên OpenAPI/Postman/GraphQL), <b>DAST-as-a-service</b> có chuyên gia xác nhận. DAST cùng SAST/SCA tạo thành bộ AST trong Gartner MQ.</p>`,
feat:['Crawl ứng dụng hiện đại (SPA, JavaScript, AJAX), ghi lại kịch bản đăng nhập/ luồng nghiệp vụ (macro), hỗ trợ MFA/SSO.','Kiểm thử API REST/SOAP/GraphQL/gRPC từ OpenAPI, Postman, HAR.','Thư viện kiểm tra theo OWASP Top 10, OWASP API Top 10, CWE; kiểm tra cấu hình TLS, header bảo mật.','Xác minh lỗ hổng (proof-of-exploit), giảm false positive; tái kiểm (retest) sau khi sửa.','Tích hợp CI/CD (quét tự động trên môi trường staging), Jira/ ITSM.','Quét định kỳ có lịch, quét theo phạm vi, giới hạn tốc độ để không ảnh hưởng hệ thống.','Báo cáo tuân thủ (PCI DSS, OWASP, ISO), hướng dẫn khắc phục cho dev.','Kết hợp IAST/ SAST để xác định dòng code gây lỗi (correlation trong SSC).'],
pain:['Pentest thủ công tốn kém, chỉ thực hiện 1–2 lần/năm, trong khi ứng dụng cập nhật hàng tuần.','Không có mã nguồn của ứng dụng mua ngoài để quét SAST.','Lỗi cấu hình triển khai (header, TLS, debug mode) chỉ lộ ra khi chạy.','Yêu cầu kiểm tra đánh giá ATTT định kỳ và trước khi đưa vào vận hành.'],
risk:['Lỗ hổng khai thác được từ Internet tồn tại hàng tháng giữa hai đợt pentest.','Lộ dữ liệu, deface, chiếm quyền ứng dụng.','Không có bằng chứng đã kiểm thử khi bị kiểm tra.'],
uc:[['Quét định kỳ cổng dịch vụ công','Fortify WebInspect quét hằng tuần toàn bộ cổng & API trên môi trường staging; lỗi mới được giao ticket tự động.'],
['Kiểm thử trước nghiệm thu','Mỗi bản phát hành của nhà thầu phải qua DAST + SAST; báo cáo là điều kiện nghiệm thu.'],
['Kiểm thử API đối tác','Nạp OpenAPI spec để kiểm thử BOLA, lỗi xác thực, mass assignment.'],
['Kết hợp pentest tự động hạ tầng','Pentera kiểm chứng từ góc độ mạng/ hạ tầng; DAST kiểm chứng lớp ứng dụng.']],
tech:[['DAST enterprise','Quét ứng dụng & API quy mô lớn.','OpenText Fortify WebInspect/DAST, HCL AppScan, Invicti (Netsparker/Acunetix), Rapid7 InsightAppSec, Veracode DAST, Black Duck Continuous Dynamic'],
['Pentester tools','Công cụ cho chuyên gia.','Burp Suite Professional/Enterprise (PortSwigger), OWASP ZAP (Checkmarx ZAP)'],
['API-first DAST','Kiểm thử API.','StackHawk, Bright Security, 42Crunch, Escape'],
['IAST','Agent trong runtime.','Contrast Security, Black Duck Seeker, HCL AppScan IAST'],
['PTaaS / pentest tự động','Kiểm thử thâm nhập tự động/dịch vụ.','Pentera, Horizon3, Cobalt, Synack']],
dia:{cols:[[{t:'Kịch bản quét',s:'URL · OpenAPI · Login macro',k:'ext'}],[{t:'DAST Engine',s:'Crawl · Attack · Verify',k:'hl'}],[{t:'Ứng dụng đang chạy',s:'Staging / Production'}],[{t:'Kết quả',s:'Lỗ hổng xác minh · Báo cáo'}]],ctl:{t:'CI/CD · SSC/ASPM · Jira',s:'Quét tự động, theo dõi khắc phục',to:[1,3]}},
model:`<p><b>Nguyên lý:</b> Crawler khám phá bề mặt tấn công (trang, form, tham số, endpoint API) → engine sinh request tấn công cho từng điểm nhập → phân tích response (lỗi DB, phản xạ payload, độ trễ, out-of-band callback) → xác minh & phân loại mức độ → báo cáo.</p>
<ul><li>Sensor DAST đặt trong mạng có thể truy cập ứng dụng (nội bộ) hoặc quét từ Internet (SaaS).</li><li>Ưu tiên quét môi trường staging giống production; quét production với chính sách an toàn (không xoá dữ liệu, giới hạn tốc độ), tránh giờ cao điểm.</li></ul>`,
lic:{gen:['Theo <b>số ứng dụng/ website (FQDN)</b> được quét mỗi năm – phổ biến.','Theo số scanner đồng thời/ sensor, hoặc theo lượt quét (assessment).','Burp Suite Pro theo người dùng; Enterprise theo số lượt quét đồng thời.'],
v:[['OpenText Fortify WebInspect / DAST','Theo số sensor/ concurrent scan hoặc theo ứng dụng; on-prem; Fortify on Demand DAST theo ứng dụng/ assessment.','NTS phân phối – ưu tiên',1],['Pentera','Theo số IP/asset (hạ tầng), bổ trợ DAST.','NTS phân phối',1],['Invicti','Theo số website/ gói.','',0],['HCL AppScan','Theo user/ số lượt quét.','',0],['PortSwigger Burp Suite','Pro: theo user/năm; Enterprise/DAST: theo concurrent scan.','',0],['Rapid7 InsightAppSec','Theo số ứng dụng.','',0]]},
pre:[['Phạm vi','Danh sách ứng dụng/ API, URL, môi trường được quét, khung giờ cho phép, văn bản phê duyệt quét.'],['Tài khoản test','Tài khoản các vai trò để quét phần sau đăng nhập; xử lý MFA/CAPTCHA trên môi trường test.'],['Hạ tầng','Máy chủ/ VM cho sensor, kết nối mạng tới ứng dụng; whitelist IP scanner trên WAF/IPS (hoặc quét cả qua WAF để đánh giá WAF).'],['Quy trình','Sao lưu dữ liệu staging; quy trình xử lý & retest lỗ hổng.']],
mkt:{rank:`<p>DAST nằm trong <b>Gartner MQ Application Security Testing 2025</b>: Leaders – Black Duck, Checkmarx, HCLSoftware, <b>OpenText</b>, Snyk, Veracode. Hãng chuyên DAST: Invicti, PortSwigger (Burp Suite – chuẩn de facto của pentester), Rapid7, StackHawk, Bright; mã nguồn mở OWASP ZAP.</p>`,

S({
id:'sca',g:'sw',no:26,folder:'26. SCA - SBOM',abbr:'SCA/SBOM',
name:'Giải pháp kiểm soát thư viện và thành phần phần mềm – SCA/SBOM',layer:'DevSecOps (chuỗi cung ứng)',csf:['ID','PR'],
nts:'OpenText Fortify Core SCA (Debricked), Fortify on Demand (SCA)',
src:{f:'Phát hiện thư viện mã nguồn mở, phiên bản dễ bị tổn thương; quản lý thành phần phần mềm và Software Bill of Materials'},
what:`<p>Ứng dụng hiện đại có tới <b>70–90% mã là thư viện mã nguồn mở</b>. <b>SCA (Software Composition Analysis)</b> lập danh mục toàn bộ thành phần (trực tiếp & bắc cầu – transitive) mà ứng dụng sử dụng, đối chiếu với cơ sở dữ liệu lỗ hổng (CVE/GHSA/OSV), <b>giấy phép (license)</b> và tình trạng bảo trì, rồi cảnh báo & đề xuất phiên bản an toàn. Kết quả được xuất thành <b>SBOM (Software Bill of Materials)</b> chuẩn <b>SPDX</b> hoặc <b>CycloneDX</b> – "bảng kê thành phần" của phần mềm.</p>
<p>SBOM ngày càng trở thành yêu cầu bắt buộc trong mua sắm (Mỹ: EO 14028, EU: Cyber Resilience Act). Các vụ Log4Shell (2021), XZ Utils backdoor (2024), các gói npm độc hại cho thấy rủi ro <b>chuỗi cung ứng phần mềm</b>. SCA hiện đại còn có <b>reachability analysis</b> (lỗ hổng có thực sự được gọi tới không) và phát hiện gói độc hại (malicious package).</p>`,
feat:['Nhận diện thành phần qua file manifest/lock (Maven, Gradle, npm, pip, NuGet, Go mod…), binary/container image, snippet.','Đối chiếu lỗ hổng (NVD, GitHub Advisory, OSV, nguồn riêng của hãng), EPSS/ KEV; reachability analysis.','Kiểm soát giấy phép: phát hiện GPL/AGPL trong sản phẩm đóng, chính sách cho phép/cấm.','Đánh giá sức khoẻ dự án (bảo trì, cộng đồng), phát hiện gói độc hại/ typosquatting.','Sinh & quản lý SBOM (SPDX, CycloneDX), nhập SBOM của nhà cung cấp để giám sát liên tục.','Tự động tạo pull request nâng cấp thư viện; chính sách chặn build.','Tích hợp IDE, Git, CI/CD, registry (Artifactory, Nexus), container registry.','VEX (Vulnerability Exploitability eXchange) để thông báo tình trạng khai thác.'],
pain:['Không biết ứng dụng đang dùng những thư viện nào, phiên bản nào – khi có Log4Shell mất nhiều ngày rà soát.','Nhà thầu dùng thư viện cũ, có lỗ hổng nghiêm trọng hoặc giấy phép không phù hợp.','Không có SBOM để quản lý phần mềm mua ngoài.'],
risk:['Bị khai thác qua lỗ hổng thư viện (RCE hàng loạt như Log4j).','Mã độc chuỗi cung ứng cài cắm qua gói độc hại.','Rủi ro pháp lý về giấy phép phần mềm.'],
uc:[['Phản ứng với lỗ hổng thư viện nghiêm trọng','Tra cứu SBOM toàn bộ ứng dụng để biết trong 5 phút ứng dụng nào dùng phiên bản bị ảnh hưởng.'],
['Yêu cầu nhà thầu nộp SBOM','Điều khoản hợp đồng: nhà thầu nộp SBOM CycloneDX mỗi bản phát hành; SCA giám sát liên tục lỗ hổng mới.'],
['Chặn thư viện nguy hiểm','Pipeline chặn build nếu có thư viện chứa lỗ hổng Critical có khai thác công khai hoặc giấy phép AGPL.'],
['Phát hiện gói độc hại','Cảnh báo khi dev thêm gói npm mới đăng ký có hành vi đáng ngờ.']],
tech:[['SCA thương mại','Phân tích thành phần & giấy phép.','Black Duck, Snyk Open Source, Sonatype Lifecycle, Mend.io, Checkmarx SCA, Veracode SCA, OpenText Core SCA (Debricked), JFrog Xray'],
['SBOM standards','Chuẩn bảng kê.','SPDX (ISO/IEC 5962), CycloneDX (OWASP, ECMA-424)'],
['SBOM management (OSS)','Quản lý SBOM.','OWASP Dependency-Track, Syft/Grype (Anchore), Trivy'],
['Reachability & malicious package detection','Giảm nhiễu, phát hiện gói độc.','Endor Labs, Socket, Snyk, Sonatype'],
['Supply chain integrity','Ký & xác thực artifact.','Sigstore/cosign, SLSA, in-toto']],
dia:{cols:[[{t:'Mã nguồn & manifest',s:'pom · package.json · requirements',k:'ext'}],[{t:'SCA Scanner',s:'Dependency graph',k:'hl'}],[{t:'CSDL lỗ hổng & license',s:'NVD · GHSA · OSV'}],[{t:'SBOM',s:'SPDX · CycloneDX',k:'hl'}],[{t:'Policy Gate',s:'Chặn / cho phép build'}]],ctl:{t:'Giám sát liên tục SBOM · ASPM · Registry',s:'Cảnh báo khi có CVE mới',to:[3]}},
model:`<p><b>Nguyên lý:</b> Scanner đọc manifest/lock file hoặc phân tích binary → dựng cây phụ thuộc đầy đủ → nhận dạng từng thành phần (PURL/CPE) → đối chiếu CSDL lỗ hổng, giấy phép → áp chính sách → xuất SBOM & kết quả → SBOM được lưu để giám sát liên tục (khi có CVE mới công bố, hệ thống tự cảnh báo dù không quét lại).</p>
<ul><li>Tích hợp tại 3 điểm: IDE (dev), pipeline CI (build), registry/ kho artifact (phát hành).</li><li>Với phần mềm mua ngoài: nhập SBOM nhà cung cấp hoặc quét binary/ container.</li></ul>`,

v:[['OpenText Core SCA (Debricked) / Fortify SCA','Theo developer hoặc ứng dụng; có trong bundle Fortify (on-prem/ FoD).','NTS phân phối – ưu tiên',1],['Black Duck SCA','Theo developer/ ứng dụng/ dung lượng code.','',0],['Snyk Open Source','Theo developer.','',0],['Sonatype Lifecycle','Theo developer/ ứng dụng.','',0],['Mend.io','Theo developer.','',0],['OWASP Dependency-Track','Miễn phí (OSS).','',0]]},

S({
id:'container',g:'sw',no:27,folder:'27. Container - Kubernetes - Cloud Native Security',abbr:'CNAPP/Container',
name:'Giải pháp bảo mật Container/Kubernetes/Cloud Native',layer:'Cloud-native workload',csf:['PR','DE','ID'],
nts:'Qualys TotalCloud (Container Security, KSPM, CSPM), OpenText Fortify (IaC scanning), Sophos/Kaspersky (bảo vệ node)',
src:{f:'Quét image, kiểm soát cấu hình container và Kubernetes, phát hiện rủi ro runtime, kiểm soát workload và chính sách bảo mật môi trường Cloud Native'},
what:`<p>Bảo mật cloud-native bảo vệ toàn bộ vòng đời ứng dụng container: <b>Build</b> (quét image tìm lỗ hổng, malware, secret, cấu hình Dockerfile/IaC), <b>Deploy</b> (admission control – chỉ cho phép image đã ký, đã quét, cấu hình an toàn), <b>Run</b> (giám sát runtime bằng eBPF phát hiện hành vi bất thường trong container: shell lạ, leo thang đặc quyền, đào tiền ảo), cùng <b>KSPM</b> (Kubernetes Security Posture – CIS Benchmark cho K8s, RBAC quá quyền) và <b>network policy/ microsegmentation</b>.</p>
<p>Gartner gom các mảng CSPM + CWPP + KSPM + CIEM + IaC scanning thành <b>CNAPP</b> (Cloud-Native Application Protection Platform). Với hệ thống như VNeID chạy trên private cloud/Kubernetes on-prem, cần giải pháp hỗ trợ triển khai on-prem/air-gapped. Tham chiếu: NIST SP 800-190, NSA/CISA Kubernetes Hardening Guide.</p>`,
feat:['Quét image trong registry & CI (CVE OS/thư viện, malware, secret, cấu hình), SBOM image.','Admission controller: chặn image chưa quét/ có lỗi nghiêm trọng/ chạy root/ privileged; xác thực chữ ký image (cosign).','KSPM: đánh giá cluster theo CIS Kubernetes Benchmark, NSA guide; phát hiện RBAC quá quyền, secret không mã hoá.','Runtime protection (eBPF/agent): phát hiện & chặn hành vi bất thường, drift container, reverse shell, cryptomining.','Network visibility & policy: bản đồ giao tiếp pod, đề xuất NetworkPolicy, microsegmentation.','CSPM/CIEM cho cloud công cộng (nếu dùng), IaC scanning (Terraform, Helm, YAML).','Tuân thủ (PCI, NIST, CIS), báo cáo; tích hợp SIEM/SOAR, ticket.','Hỗ trợ OpenShift, Rancher, Tanzu, EKS/AKS/GKE, K8s vanilla.'],
pain:['Đội phát triển dùng image công cộng chứa hàng trăm lỗ hổng; không kiểm soát được image nào lên production.','Cấu hình Kubernetes phức tạp, dễ sai (dashboard public, pod privileged, RBAC cluster-admin).','Công cụ bảo mật truyền thống (AV, IPS) không nhìn thấy bên trong container, workload thay đổi liên tục.'],
risk:['Chiếm quyền cluster → kiểm soát toàn bộ ứng dụng & dữ liệu.','Container escape lên node, lây lan.','Cryptojacking, lộ secret trong cluster.'],
uc:[['Pipeline image an toàn cho microservices VNeID','Image phải qua quét, ký số; admission controller trên OpenShift/K8s chỉ chấp nhận image đã ký từ registry nội bộ.'],
['Đánh giá cluster theo CIS','KSPM chấm điểm cluster hằng ngày, cảnh báo khi có namespace tạo pod privileged.'],
['Phát hiện tấn công runtime','Container web bỗng sinh shell và tải xmrig → runtime chặn tiến trình và cảnh báo SOC.'],
['Microsegmentation','Tự sinh NetworkPolicy chỉ cho service A gọi service B.']],
tech:[['CNAPP','Nền tảng hợp nhất.','Wiz (Google), Palo Alto Prisma Cloud / Cortex Cloud, CrowdStrike Falcon Cloud Security, Microsoft Defender for Cloud, Check Point CloudGuard, Orca, Sysdig, Aqua, Qualys TotalCloud, Trend Vision One, Tenable Cloud'],
['Image scanning (OSS)','Quét image.','Trivy, Grype, Clair'],
['Runtime eBPF','Giám sát kernel.','Falco (CNCF), Sysdig Secure, Aqua Tracee, Tetragon (Cilium)'],
['Policy-as-code admission','Kiểm soát triển khai.','OPA Gatekeeper, Kyverno'],
['Supply chain','Ký & xác thực image.','Sigstore cosign, Notary'],
['Network policy / service mesh','Phân đoạn.','Cilium, Calico, Istio']],
dia:{cols:[[{t:'Code & IaC',s:'Dockerfile · Helm · Terraform',k:'ext'}],[{t:'CI: Quét image & IaC',s:'CVE · Secret · Misconfig',k:'hl'}],[{t:'Registry nội bộ',s:'Image đã ký'}],[{t:'Admission Control',s:'OPA/Kyverno · Chữ ký',k:'hl'}],[{t:'Kubernetes cluster',s:'Runtime eBPF · KSPM · NetPol',k:'hl'}]],ctl:{t:'CNAPP Console · SIEM/SOAR',s:'Posture, cảnh báo runtime, tuân thủ',to:[1,3,4]}},
model:`<p><b>Nguyên lý:</b> Shift-left – quét sớm trong CI → chỉ image đạt chuẩn được đẩy & ký vào registry → admission controller kiểm tra chính sách khi triển khai → sensor (DaemonSet/eBPF) trên mỗi node giám sát syscall, tiến trình, mạng của container → engine so với hồ sơ hành vi/ rule → cảnh báo/chặn; KSPM định kỳ đánh giá cấu hình cluster.</p>

v:[['Qualys TotalCloud / Container Security','Theo số host/ container node + gói CSPM/ KSPM; chung Qualys Cloud Agent.','NTS phân phối',1],['OpenText Fortify (IaC scanning)','Trong license Fortify SAST.','NTS phân phối',1],['Wiz','Theo workload/ tài nguyên cloud (SaaS).','',0],['Palo Alto Prisma Cloud','Credit-based theo workload & module.','',0],['Sysdig Secure / Aqua','Theo node/ host.','',0],['Red Hat Advanced Cluster Security','Theo core/ node OpenShift.','',0]]},

S({
id:'apisec',g:'sw',no:28,folder:'28. API Security',abbr:'API Security',
name:'Giải pháp bảo mật API – API Security',layer:'Ứng dụng & API',csf:['ID','DE','PR'],
nts:'Barracuda (API Protection/ WaaS), Penta WAPPLES, OpenText Fortify (API DAST/SAST) – nền tảng API Security chuyên dụng chưa có trong danh mục NTS',
src:{f:'Phát hiện API, đánh giá rủi ro, kiểm soát truy cập, phát hiện hành vi bất thường, API abuse và các hình thức khai thác API'},
what:`<p><b>API Security</b> (khác với API Gateway – lớp thực thi) là nền tảng <b>khám phá – đánh giá – phát hiện – phản ứng</b> cho toàn bộ API: tự động <b>phát hiện API</b> (kể cả shadow/zombie API) từ lưu lượng, phân loại dữ liệu nhạy cảm API trả về, <b>đánh giá rủi ro</b> (thiếu xác thực, lộ dữ liệu, không tuân thủ spec), <b>kiểm thử bảo mật API</b>, và đặc biệt là <b>phát hiện tấn công/lạm dụng logic nghiệp vụ</b> bằng phân tích hành vi – những tấn công hợp lệ về cú pháp nên WAF/Gateway không chặn được: <b>BOLA</b> (đổi ID để xem hồ sơ người khác), lạm dụng luồng nghiệp vụ, scraping, credential stuffing qua API.</p>
<p>Tham chiếu chính: <b>OWASP API Security Top 10 (2023)</b> và <b>NIST SP 800-228</b>.</p>`,
feat:['API discovery liên tục từ lưu lượng (mirror từ gateway/LB/K8s/cloud), từ mã nguồn & spec; inventory với owner, môi trường, mức nhạy cảm.','Phân loại dữ liệu nhạy cảm trong request/response (CCCD, SĐT, token).','Posture management: phát hiện API không xác thực, lộ dữ liệu thừa, sai lệch so với OpenAPI, endpoint deprecated vẫn hoạt động.','Phát hiện tấn công runtime bằng AI/ hành vi: BOLA/IDOR, BFLA, mass assignment, enumeration, scraping, lạm dụng nghiệp vụ.','Phản ứng: chặn qua WAF/Gateway/ CDN (tích hợp), gửi cảnh báo SIEM/SOAR.','Kiểm thử bảo mật API trong CI/CD (API DAST, fuzzing theo spec).','Báo cáo tuân thủ OWASP API Top 10, quản trị vòng đời API.'],
pain:['Không biết tổ chức đang có bao nhiêu API, API nào trả dữ liệu cá nhân; API cũ vẫn chạy.','WAF chặn tốt SQLi/XSS nhưng không phát hiện kẻ tấn công dùng token hợp lệ để lần lượt tra hồ sơ người khác (BOLA – rủi ro số 1 OWASP API).','API là kênh trao đổi dữ liệu chính giữa VNeID và các hệ thống ngoài.'],
risk:['Lộ dữ liệu cá nhân hàng loạt qua API (nhiều vụ lộ dữ liệu lớn toàn cầu do BOLA).','Lạm dụng nghiệp vụ (tạo tài khoản ảo, săn mã OTP).','Shadow API không được bảo vệ.'],
uc:[['Phát hiện BOLA trên API tra cứu','Một client hợp lệ gọi /citizens/{id} tăng dần ID → mô hình hành vi nhận diện enumeration, chặn token qua gateway.'],
['Kiểm kê API toàn hệ thống','Sau 2 tuần phân tích lưu lượng phát hiện 40 API không có trong tài liệu, 6 API trả về số CCCD không che.'],
['Kiểm thử API trước phát hành','Fuzzing theo OpenAPI tìm lỗi phân quyền giữa vai trò.']],

S({
id:'tip',g:'sw',no:29,folder:'29. Threat Intelligence Platform - TIP',abbr:'TIP',
name:'Nền tảng quản lý thông tin mối đe dọa – Threat Intelligence Platform (TIP)',layer:'SOC – Tình báo mối đe doạ',csf:['ID','DE'],
nts:'Kaspersky Threat Intelligence (feeds, portal, APT reports), NETSCOUT ATLAS Intelligence Feed, Proofpoint Emerging Threats (ET) Intelligence, Stellar Cyber (TI tích hợp)',
src:{f:'Tổng hợp, chuẩn hóa và khai thác IOC, TTP và thông tin về các chiến dịch, nhóm tấn công và mối đe dọa'},
what:`<p><b>Threat Intelligence (TI)</b> là thông tin có ngữ cảnh về mối đe doạ: <b>IOC</b> (IP, domain, URL, hash), <b>TTP</b> (chiến thuật, kỹ thuật theo MITRE ATT&CK), chiến dịch, nhóm APT, lỗ hổng đang bị khai thác. <b>TIP</b> là nền tảng <b>thu thập</b> TI từ nhiều nguồn (feed thương mại, OSINT, cơ quan chuyên trách, ISAC, nội bộ), <b>chuẩn hoá & khử trùng lặp</b> (STIX 2.1), <b>chấm điểm độ tin cậy & tuổi thọ</b>, <b>làm giàu</b>, rồi <b>phân phối</b> tự động tới các công cụ phòng thủ (NGFW, IPS, proxy, EDR, SIEM, SOAR) qua TAXII/API, đồng thời hỗ trợ analyst nghiên cứu & chia sẻ.</p>
<p>TI chia 3 cấp: <b>chiến lược</b> (cho lãnh đạo: xu hướng, nhóm tấn công nhắm vào ngành), <b>chiến thuật/kỹ thuật</b> (TTP cho threat hunting, detection engineering), <b>tác nghiệp</b> (IOC để chặn). Tham chiếu NIST SP 800-150 về chia sẻ thông tin mối đe doạ.</p>`,
feat:['Thu thập đa nguồn: feed thương mại, OSINT, MISP community, CERT/ cơ quan chuyên trách, sandbox nội bộ, báo cáo PDF (trích IOC tự động).','Chuẩn hoá STIX 2.1/ TAXII 2.1, khử trùng lặp, chấm điểm, hết hạn (decay) IOC.','Làm giàu: whois, passive DNS, geo, liên kết thực thể, đồ thị quan hệ.','Ánh xạ MITRE ATT&CK, hồ sơ nhóm tấn công, chiến dịch.','Phân phối tự động tới NGFW/IPS/DNS/EDR/SIEM theo danh sách chặn; tích hợp SOAR.','Không gian làm việc analyst, quản lý yêu cầu tình báo (PIR), báo cáo.','Chia sẻ có kiểm soát (TLP), cộng đồng ngành; chia sẻ với hệ thống giám sát quốc gia.','Digital risk protection (theo dõi dark web, lộ lọt thông tin đăng nhập, giả mạo thương hiệu – tuỳ nền tảng).'],
pain:['SOC nhận IOC rải rác qua email/ PDF từ nhiều nguồn, nhập thủ công từng thiết bị.','Feed chất lượng thấp gây chặn nhầm, IOC hết hạn không được gỡ.','Không biết nhóm tấn công nào đang nhắm vào cơ quan/ ngành mình để ưu tiên phòng thủ.'],
risk:['Chậm chặn hạ tầng tấn công đã được biết.','Mù thông tin về chiến dịch APT nhắm vào hệ thống quốc gia.','Lãng phí nguồn lực xử lý cảnh báo giả.'],
uc:[['Tự động hoá chặn IOC từ cơ quan chuyên trách','Cảnh báo kèm IOC được nạp vào TIP → chấm điểm → tự đẩy xuống NGFW/DNS firewall/EDR trong 5 phút.'],
['Săn mối đe doạ theo TTP','Báo cáo APT mô tả kỹ thuật DLL side-loading; detection engineer viết rule SIEM/EDR từ TTP.'],
['Làm giàu cảnh báo SIEM','Mỗi cảnh báo có IP đích được gắn nhãn "C2 của nhóm APT X" giúp ưu tiên xử lý.'],
['Giám sát lộ lọt thông tin đăng nhập','Phát hiện tài khoản email công vụ xuất hiện trong dữ liệu rò rỉ → buộc đổi mật khẩu.']],
tech:[['TIP thương mại','Quản lý & phân phối TI.','ThreatConnect, Anomali ThreatStream, EclecticIQ, ThreatQuotient (Securonix), Cyware, Google Threat Intelligence'],
['TIP mã nguồn mở','Chia sẻ & quản lý TI.','MISP, OpenCTI (Filigran), YETI'],
['Threat intel feeds/ services','Nguồn TI chất lượng.','Kaspersky TI, Recorded Future (Mastercard), Mandiant/ Google, CrowdStrike, Group-IB, Proofpoint ET, NETSCOUT ATLAS, Cisco Talos'],
['Chuẩn chia sẻ','STIX 2.1, TAXII 2.1, TLP 2.0.','OASIS CTI, FIRST'],
['Digital Risk Protection','Dark web, brand.','Recorded Future, ZeroFox, Group-IB, Kaspersky Digital Footprint']],
dia:{cols:[[{t:'Nguồn TI',s:'Feed TM · OSINT · CERT · Sandbox',k:'ext'}],[{t:'TIP',s:'Chuẩn hoá · Chấm điểm · MITRE',k:'hl'}],[{t:'Analyst',s:'Nghiên cứu · Báo cáo'}],[{t:'Công cụ phòng thủ',s:'NGFW · DNS · EDR · SIEM · SOAR'}]],ctl:{t:'Chia sẻ STIX/TAXII · Cộng đồng · Hệ thống giám sát quốc gia',s:'',to:[1]}},
model:`<p><b>Nguyên lý:</b> Connector kéo dữ liệu theo lịch hoặc nhận đẩy (TAXII) → parser chuẩn hoá thành đối tượng STIX → hợp nhất, chấm điểm theo nguồn/độ tin cậy/tuổi → làm giàu → luật phân phối (ví dụ: IP điểm ≥ 80, tuổi < 30 ngày → đẩy danh sách chặn NGFW) → phản hồi từ công cụ (hit) quay về TIP để đánh giá hiệu quả feed.</p>
<ul><li>Triển khai on-prem hoặc SaaS; kết nối ra Internet để lấy feed (qua proxy), kết nối nội bộ tới công cụ phòng thủ.</li></ul>`,
lic:{gen:['TIP: theo số người dùng analyst và/hoặc số integration/ nguồn, hoặc gói.','Feed TI: subscription năm theo loại feed (IP/URL/hash/APT/mobile), số thiết bị tiêu thụ hoặc quy mô tổ chức.','Báo cáo APT/ portal: theo gói số người dùng/ lượt tra cứu.'],
v:[['Kaspersky Threat Intelligence','Subscription theo feed (Malicious URL, IP Reputation, APT IOC, Ransomware…), TI Portal theo lượt/ người dùng, APT Intelligence Reporting theo năm.','NTS phân phối – ưu tiên',1],['NETSCOUT ATLAS Intelligence Feed','Subscription trên AED/ OCI.','NTS phân phối',1],['Proofpoint ET Intelligence','Subscription feed (ET Pro ruleset, ET Intelligence reputation).','NTS phân phối',1],['ThreatConnect / Anomali / EclecticIQ','Theo user/ module.','',0],['Recorded Future','Theo module & user.','',0],['MISP / OpenCTI','Miễn phí (OSS).','',0]]},
pre:[['Yêu cầu tình báo','Xác định PIR: mối đe doạ ưu tiên với hệ thống, ngành.'],['Tích hợp','Danh sách công cụ nhận IOC & API; SIEM/SOAR.'],['Nhân sự','Analyst CTI (có thể dùng dịch vụ TI có báo cáo phân tích).'],['Chia sẻ','Thoả thuận chia sẻ với cơ quan chuyên trách/ cộng đồng (TLP).']],
mkt:{rank:`<p>Tham chiếu <b>Forrester Wave™ External Threat Intelligence Service Providers</b> và Gartner Market Guide for Security Threat Intelligence Products & Services. Nhà cung cấp TI hàng đầu: <b>Google Threat Intelligence (Mandiant + VirusTotal), Recorded Future (thuộc Mastercard từ 12/2024), CrowdStrike, Microsoft</b>, Kaspersky, Group-IB, Palo Alto Unit 42, Cisco Talos. TIP: ThreatConnect, Anomali, EclecticIQ, ThreatQuotient, Cyware, OpenCTI/MISP.</p>`,

S({
id:'pki',g:'sw',no:30,folder:'30. PKI - Certificate Management - KMS',abbr:'PKI/CLM/KMS',
name:'Giải pháp quản lý chứng thư số và vòng đời khóa – PKI/Certificate Management/KMS',layer:'Mật mã & tin cậy',csf:['PR','ID'],
nts:'Penta Security (D\'Amo KMS, iSign PKI-based), OpenText Voltage (quản lý khoá cho mã hoá dữ liệu) – CLM chuyên dụng chưa có trong danh mục NTS',
src:{f:'Quản lý tập trung chứng thư, khóa mã hóa và vòng đời certificate; cảnh báo hết hạn và tích hợp với HSM'},
what:`<p>Nhóm giải pháp gồm 3 thành phần: (1) <b>PKI/CA</b> – hạ tầng phát hành chứng thư số nội bộ/ chuyên dùng (Root CA offline, Sub CA, RA, OCSP/CRL) cho máy chủ, thiết bị, người dùng, mTLS đối tác; (2) <b>CLM (Certificate Lifecycle Management)</b> – khám phá toàn bộ chứng thư trong tổ chức (kể cả chứng thư công cộng), theo dõi hạn, tự động gia hạn & triển khai (ACME, SCEP, EST), thu hồi, báo cáo; (3) <b>KMS (Key Management System)</b> – quản lý tập trung khoá mã hoá dữ liệu (DEK/KEK) cho CSDL, storage, ứng dụng, cloud (BYOK/HYOK) theo chuẩn KMIP, khoá gốc trong HSM.</p>
<p>Xu hướng quan trọng: CA/Browser Forum đã thông qua lộ trình rút ngắn hạn chứng thư TLS công cộng xuống <b>200 ngày (03/2026), 100 ngày (03/2027) và 47 ngày (03/2029)</b> → tự động hoá CLM là bắt buộc. Ngoài ra là <b>crypto-agility</b> để chuyển đổi sang mật mã hậu lượng tử.</p>`,
feat:['CA nội bộ/ chuyên dùng: Root/Sub CA, template chứng thư, RA, OCSP, CRL, HSM bảo vệ khoá CA.','Khám phá chứng thư qua quét mạng, tích hợp CA, load balancer, cloud, Kubernetes (cert-manager).','Kiểm kê & cảnh báo hết hạn, chứng thư yếu (SHA-1, RSA-1024), wildcard rủi ro, CA không tin cậy.','Tự động hoá gia hạn & triển khai: ACME, SCEP, EST, agent, API tới F5/Kemp/NGINX/IIS/Apache.','KMS: sinh, lưu, xoay, thu hồi, huỷ khoá; KMIP cho storage/DB/ VMware; BYOK/HYOK cloud.','Chính sách & phân quyền, workflow phê duyệt; audit log; tích hợp HSM.','Hỗ trợ machine identity cho container/ service mesh; quản lý khoá SSH.','Crypto inventory & sẵn sàng PQC.'],
pain:['Chứng thư hết hạn đột ngột gây sập dịch vụ (nhiều sự cố lớn toàn cầu do chứng thư hết hạn).','Hàng nghìn chứng thư rải rác, quản lý bằng Excel; không biết khoá riêng nằm ở đâu.','Khoá mã hoá CSDL lưu cùng máy chủ DB → mã hoá vô nghĩa.','Cần CA chuyên dùng để cấp chứng thư mTLS cho đối tác kết nối API.'],
risk:['Gián đoạn dịch vụ do chứng thư hết hạn.','Lộ khoá riêng → giả mạo máy chủ, giải mã lưu lượng.','Không đáp ứng yêu cầu quản lý khoá theo quy định mật mã/ PCI DSS.'],
uc:[['Tự động gia hạn chứng thư toàn hệ thống','CLM khám phá 3.200 chứng thư, tự gia hạn qua ACME cho web/ LB, cảnh báo trước 30 ngày cho phần còn lại.'],
['CA chuyên dùng cho đối tác API','Sub CA cấp chứng thư mTLS cho ngân hàng/ telco kết nối VNeID; thu hồi tức thời qua OCSP.'],
['KMS cho mã hoá CSDL & storage','Khoá TDE/ mã hoá cột/ ổ đĩa được quản lý tập trung qua KMIP, khoá gốc trong HSM, xoay khoá định kỳ.'],
['Lộ trình PQC','Kiểm kê thuật toán đang dùng, lập kế hoạch chuyển đổi ML-KEM/ML-DSA.']],
tech:[['PKI/CA software','Phát hành chứng thư.','Microsoft AD CS, EJBCA (Keyfactor), Entrust, DigiCert Trust Lifecycle, Sectigo, Nexus, Venafi Firefly'],
['CLM','Quản lý vòng đời chứng thư.','CyberArk (Venafi), Keyfactor Command, DigiCert Trust Lifecycle Manager, Sectigo Certificate Manager, AppViewX, Entrust'],
['KMS / EKM','Quản lý khoá doanh nghiệp.','Thales CipherTrust Manager, Entrust KeyControl, Fortanix DSM, Utimaco ESKM, IBM GKLM, Penta D\'Amo KMS, OpenText Voltage KMS'],
['Cloud KMS','Quản lý khoá cloud.','AWS KMS, Azure Key Vault, Google Cloud KMS'],
['Protocols','ACME, SCEP, EST, KMIP, OCSP.','IETF/ OASIS'],
['CA công cộng & chuyên dùng tại VN','Chứng thư số công cộng & Chính phủ.','VNPT-CA, Viettel-CA, BKAV-CA, FPT-CA…; Ban Cơ yếu Chính phủ (CA chuyên dùng Chính phủ)']],
dia:{cols:[[{t:'Root CA (offline)',s:'HSM riêng',k:'hl'}],[{t:'Sub CA / RA',s:'OCSP · CRL',k:'hl'}],[{t:'CLM',s:'Discovery · ACME · Auto-renew',k:'hl'}],[{t:'Máy chủ · LB · Thiết bị · K8s · Đối tác',s:'Chứng thư TLS / mTLS',k:'ext'}]],ctl:{t:'KMS (KMIP) + HSM',s:'Khoá mã hoá DB · Storage · App · Cloud',to:[1,2]}},
model:`<p><b>Nguyên lý PKI:</b> Đối tượng sinh cặp khoá → gửi CSR → RA xác minh → CA ký phát hành chứng thư → bên dựa vào (relying party) kiểm tra chuỗi tin cậy & trạng thái thu hồi (OCSP/CRL). <b>CLM:</b> khám phá → kiểm kê → chính sách → tự động gia hạn/ triển khai → giám sát. <b>KMS:</b> ứng dụng/ DB yêu cầu khoá qua KMIP/API → KMS cấp khoá (được bao gói bởi khoá gốc trong HSM) → xoay & thu hồi theo chính sách.</p>
<ul><li>Root CA offline trong phòng an toàn, chỉ bật khi ký Sub CA; Sub CA online cụm HA + HSM.</li><li>CLM/ KMS cụm HA tại DC chính và DR.</li></ul>`,

pre:[['Chính sách','Chính sách chứng thư (CP/CPS), vòng đời khoá, phân quyền; với hệ thống Chính phủ xem xét dùng CA chuyên dùng của Ban Cơ yếu.'],['Danh mục','Kiểm kê chứng thư & khoá hiện tại, ứng dụng dùng mã hoá.'],['HSM','Có HSM cho Root/Sub CA và KMS (xem mục 8).'],['Hạ tầng','Máy chủ HA, phòng an toàn cho Root CA, quy trình key ceremony.'],['Tích hợp','LB/ web server/ thiết bị hỗ trợ ACME/ API để tự động hoá.']],
mkt:{rank:`<p>Không có MQ Gartner riêng (CLM nằm trong Hype Cycle/ Market Guide Machine Identity Management). Hãng dẫn đầu CLM: <b>CyberArk (Venafi – mua 2024), Keyfactor, DigiCert, Sectigo, AppViewX, Entrust</b>. KMS: <b>Thales CipherTrust, Entrust, Fortanix, Utimaco</b>, IBM, cloud KMS. Thị trường chứng thư số công cộng tại Việt Nam do các CA được cấp phép cung cấp.</p>`,
v:[['CyberArk (Venafi)','Certificate Manager / Firefly','Dẫn đầu CLM'],['Keyfactor','Command, EJBCA','CLM + PKI'],['DigiCert','Trust Lifecycle Manager','CA + CLM'],['Sectigo','Certificate Manager',''],['Thales','CipherTrust Manager','Dẫn đầu KMS'],['Fortanix','Data Security Manager','KMS + HSM-as-a-Service'],['Penta Security','D\'Amo KMS','NTS phân phối'],['OpenText','Voltage','NTS phân phối']]},

S({
id:'fim',g:'sw',no:31,folder:'31. FIM - File Integrity Monitoring',abbr:'FIM',
name:'Giải pháp kiểm soát tính toàn vẹn tệp – File Integrity Monitoring (FIM)',layer:'Máy chủ & cấu hình',csf:['DE','PR'],
nts:'Qualys File Integrity Monitoring (Cloud Agent), SecPod SanerNow (giám sát thay đổi), Kaspersky (Integrity Monitoring cho server), Sophos (giám sát thay đổi trên máy chủ)',
src:{f:'Giám sát thay đổi đối với file hệ thống, file cấu hình và các thành phần quan trọng; cảnh báo thay đổi trái phép'},
what:`<p><b>FIM</b> theo dõi <b>mọi thay đổi</b> trên các đối tượng quan trọng của máy chủ: file hệ thống/ binary, file cấu hình (sshd_config, web.config), thư mục web (phát hiện web shell/ deface), registry Windows, quyền & chủ sở hữu file, dịch vụ, tài khoản cục bộ. FIM tính <b>hash</b> (SHA-256) và thuộc tính của đối tượng theo baseline, ghi nhận ai/ tiến trình nào/ khi nào thay đổi gì, phân biệt <b>thay đổi được phép</b> (theo change ticket/ cửa sổ bảo trì) với <b>thay đổi trái phép</b>.</p>
<p>FIM là yêu cầu bắt buộc của <b>PCI DSS (11.5)</b>, được khuyến nghị trong NIST SP 800-53 (SI-7 Software, Firmware & Information Integrity), và rất hữu ích để phát hiện sớm web shell, rootkit, backdoor, sửa đổi cấu hình trái phép.</p>`,
feat:['Giám sát thời gian thực (agent, hook kernel/ ETW/ auditd/ eBPF) hoặc theo lịch (so sánh hash).','Thư viện chính sách sẵn có theo OS/ ứng dụng (PCI, CIS) – chọn đối tượng cần giám sát, giảm nhiễu.','Ghi nhận chi tiết: user, tiến trình, giá trị trước/sau (diff nội dung file cấu hình), thời gian.','Đối chiếu thay đổi với change ticket (ServiceNow/ SMAX) – tự động phân loại được phép/ trái phép.','Phát hiện file thay đổi khớp hash mã độc (threat intel), web shell trong thư mục web.','Giám sát registry, quyền file, dịch vụ, tài khoản, cài đặt phần mềm.','Cảnh báo, dashboard, báo cáo tuân thủ; tích hợp SIEM/SOAR.','Hỗ trợ Windows, Linux, Unix, thiết bị mạng (cấu hình), DB, container.'],
pain:['Website/ cổng thông tin bị chèn web shell hoặc deface mà quản trị không biết cho tới khi người dân phản ánh.','Cấu hình máy chủ bị sửa trái phép (mở SSH root, thêm tài khoản) không ai phát hiện.','Yêu cầu tuân thủ PCI DSS, kiểm toán thay đổi trên hệ thống quan trọng.'],
risk:['Backdoor/ rootkit tồn tại lâu dài trên máy chủ.','Deface cổng thông tin – ảnh hưởng uy tín cơ quan.','Không truy vết được thay đổi gây sự cố.'],
uc:[['Phát hiện web shell','File .aspx/.php mới xuất hiện trong thư mục web ngoài cửa sổ triển khai → FIM cảnh báo Critical trong vài giây, SOAR cách ly.'],
['Kiểm soát thay đổi cấu hình máy chủ định danh','Mọi thay đổi /etc trên cụm máy chủ VNeID được đối chiếu với ticket; thay đổi không có ticket → cảnh báo.'],
['Tuân thủ PCI DSS cho cổng thanh toán','Báo cáo FIM hằng tuần cho đánh giá viên QSA.'],
['Điều tra sự cố','Xác định chính xác file nào bị thay đổi, bởi tiến trình nào, lúc nào.']],
tech:[['FIM enterprise (agent)','Giám sát real-time có ngữ cảnh.','Tripwire Enterprise (Fortra), Qualys FIM, Netwrix Change Tracker, CimTrak, Trellix Change Control'],
['FIM trong EDR/ CWPP','Module của nền tảng endpoint/server.','Trend Micro Deep Security/ Vision One (Integrity Monitoring), Kaspersky Security for Windows Server, Microsoft Defender for Cloud (FIM), CrowdStrike Falcon FileVantage'],
['FIM mã nguồn mở','HIDS kèm FIM.','Wazuh, OSSEC, AIDE, Samhain'],
['Linux kernel auditing','auditd, eBPF, fanotify.','Linux'],
['Change reconciliation','Đối chiếu với ITSM.','Tripwire, Netwrix, Qualys + ServiceNow']],
dia:{cols:[[{t:'Máy chủ quan trọng',s:'File · Registry · Config · Web dir',k:'ext'}],[{t:'FIM Agent',s:'Hash · Real-time · Ai/Tiến trình',k:'hl'}],[{t:'FIM Console',s:'Chính sách · Phân loại thay đổi',k:'hl'}],[{t:'Cảnh báo',s:'Trái phép → SOC'}]],ctl:{t:'ITSM (change ticket) · SIEM · SOAR',s:'Đối chiếu & phản ứng',to:[2,3]}},
model:`<p><b>Nguyên lý:</b> Thiết lập baseline (hash + thuộc tính) cho đối tượng được giám sát → agent theo dõi sự kiện thay đổi theo thời gian thực → ghi nhận chi tiết & tính hash mới → gửi về console → so với chính sách (đối tượng, mức độ, cửa sổ bảo trì, ticket) → phân loại & cảnh báo → khi thay đổi được phê duyệt, cập nhật baseline mới.</p>
<ul><li>Dùng chung agent với VM/SCM (Qualys Cloud Agent, SanerNow) để giảm số agent trên máy chủ.</li><li>Chọn lọc đối tượng giám sát (không giám sát toàn ổ đĩa) để giảm nhiễu & tài nguyên.</li></ul>`,
lic:{gen:['Theo <b>số máy chủ/ node/ agent</b> được giám sát mỗi năm.','Thường là module bổ sung trên nền VM/ EDR/ CWPP.','Mã nguồn mở (Wazuh/OSSEC) miễn phí, tốn chi phí vận hành.'],
v:[['Qualys FIM','Theo số asset (module trên Cloud Agent).','NTS phân phối – ưu tiên',1],['SecPod SanerNow','Giám sát thay đổi/ tuân thủ trong gói theo thiết bị.','NTS phân phối',1],['Kaspersky Security for Windows Server / Linux','Integrity monitoring trong license server.','NTS phân phối',1],['Tripwire Enterprise (Fortra)','Theo node + module.','',0],['Netwrix Change Tracker','Theo node.','',0],['Wazuh','Miễn phí (OSS), Wazuh Cloud theo agent.','',0]]},
pre:[['Phạm vi','Danh sách máy chủ & đối tượng cần giám sát (theo vai trò: web, DB, AD, ứng dụng).'],['Quy trình thay đổi','Change management có ticket để đối chiếu; cửa sổ bảo trì chuẩn.'],['Hạ tầng','Cài agent (OS hỗ trợ), kết nối tới console; tài nguyên agent.'],['Tinh chỉnh','Giai đoạn học 1–2 tuần để loại trừ file thay đổi thường xuyên (log, cache, temp).']],
mkt:{rank:`<p>Không có MQ riêng. Hãng tiêu biểu: <b>Tripwire (Fortra)</b> – thương hiệu FIM lâu đời nhất; <b>Qualys FIM</b>, Netwrix, CimTrak, Trellix; FIM trong nền tảng CWPP/EDR: Trend Micro, Microsoft Defender for Cloud, CrowdStrike FileVantage, Kaspersky; mã nguồn mở: Wazuh, OSSEC, AIDE.</p>`,
v:[['Fortra','Tripwire Enterprise','FIM truyền thống mạnh nhất'],['Qualys','File Integrity Monitoring','Cloud agent – NTS phân phối'],['Trend Micro','Deep Security / Vision One IM',''],['CrowdStrike','Falcon FileVantage',''],['Netwrix','Change Tracker',''],['Kaspersky','Integrity Monitoring (server)','NTS phân phối'],['Wazuh','Wazuh (OSS)','Miễn phí']]},
cmp:{h:['Tiêu chí','Qualys FIM','Tripwire Enterprise','Wazuh','CrowdStrike FileVantage'],r:[['Real-time','Có','Có','Có','Có'],['Đối chiếu ticket','Tích hợp ITSM','Rất mạnh','Hạn chế','Có'],['Chung agent','Qualys Cloud Agent (VM/PC/EDR)','Riêng','Wazuh agent (HIDS)','Falcon agent (EDR)'],['Chi phí','TB','Cao','Miễn phí','TB']]},
ref:[['NIST SP 1800-26 – Data Integrity: Detecting & Responding','https://csrc.nist.gov/pubs/sp/1800/26/final'],['NIST SP 800-53r5 – SI-7','https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final'],['PCI DSS v4.0.1','https://www.pcisecuritystandards.org/document_library/'],['Qualys FIM','https://www.qualys.com/apps/file-integrity-monitoring/'],['Wazuh FIM','https://documentation.wazuh.com/current/user-manual/capabilities/file-integrity/index.html']]

S({
id:'platform',g:'sw',no:32,folder:'32. Nen tang dieu hanh ATTT tap trung',abbr:'Security Ops Platform',
name:'Nền tảng quản lý và điều hành an ninh mạng tập trung',layer:'Điều hành – Quản lý',csf:['GV','ID','DE','RS','RC'],
nts:'Stellar Cyber Open XDR (Autonomous SOC), OpenText ArcSight + SMAX (ITSM) + NOM, Kaspersky XDR Expert/KUMA',
src:{f:'Cung cấp dashboard, quản trị chính sách, theo dõi trạng thái bảo vệ và báo cáo tình hình an ninh mạng phục vụ quản lý, điều hành'},
what:`<p><b>Nền tảng điều hành an ninh mạng tập trung</b> là "tầng điều hành" đứng trên các hệ thống kỹ thuật (SIEM, SOAR, EDR, NDR, VM, PAM, DLP…), cung cấp <b>bức tranh thống nhất (single pane of glass)</b> về tình hình an ninh mạng cho lãnh đạo và trung tâm điều hành: chỉ số rủi ro tổng thể, trạng thái bảo vệ của từng phân hệ/ đơn vị, sự cố đang xử lý, mức độ tuân thủ, lỗ hổng tồn đọng, độ phủ các biện pháp bảo vệ, xu hướng tấn công.</p>
<p>Về chức năng, nền tảng thường hợp nhất: <b>Security Operations</b> (SOC platform/ Open XDR), <b>Exposure & Posture management</b> (CTEM, CSPM), <b>quản trị chính sách tập trung</b> (firewall policy, endpoint policy), <b>GRC</b> (quản trị rủi ro & tuân thủ – theo TCVN 11930, ISO 27001, NIST CSF 2.0), <b>ITSM/ quy trình</b>, và <b>báo cáo điều hành</b> tới các cấp, kết nối với hệ thống giám sát an ninh mạng quốc gia (mô hình 4 lớp theo Chỉ thị 14/CT-TTg).</p>`,
feat:['Dashboard điều hành nhiều cấp: lãnh đạo (chỉ số rủi ro, KPI), trung tâm điều hành (sự cố, cảnh báo), kỹ thuật (chi tiết).','Hợp nhất dữ liệu từ SIEM, EDR, NDR, VM, PAM, DLP, FW… qua connector/API; chuẩn hoá & tương quan.','Chỉ số tư thế an ninh (security posture score) theo đơn vị/ phân hệ; độ phủ biện pháp (EDR/VM/backup coverage).','Quản lý sự cố & quy trình ứng cứu thống nhất (case, SLA, phân công nhiều đơn vị).','Quản trị tuân thủ: ánh xạ biện pháp kỹ thuật với yêu cầu (TCVN 11930 cấp độ, NIST CSF 2.0, ISO 27001), theo dõi gap.','Quản trị chính sách tập trung (tuỳ nền tảng): policy firewall, endpoint, cấu hình chuẩn.','Báo cáo tự động định kỳ/ đột xuất theo mẫu cơ quan quản lý; kết nối chia sẻ thông tin với hệ thống quốc gia.','Đa tenant/ đa đơn vị, phân quyền theo vai trò; AI hỗ trợ tóm tắt tình hình.'],
pain:['Mỗi hệ thống bảo mật một console; lãnh đạo không có bức tranh tổng thể, báo cáo phải tổng hợp thủ công.','Nhiều đơn vị/ phân hệ, không đo được mức độ an toàn tương đối để ưu tiên đầu tư.','Yêu cầu báo cáo tình hình an ninh mạng định kỳ/ đột xuất cho cấp trên & cơ quan chuyên trách.','Quy trình phối hợp ứng cứu giữa nhiều bộ phận không thống nhất.'],
risk:['Ra quyết định thiếu dữ liệu, đầu tư dàn trải.','Phản ứng chậm do thiếu điều phối.','Không chứng minh được hiệu quả đầu tư ATTT và mức độ tuân thủ.'],
uc:[['Trung tâm điều hành an ninh mạng hệ thống định danh','Màn hình lớn hiển thị: tình trạng DDoS biên, sự cố đang mở, top rủi ro, độ phủ EDR, lỗ hổng KEV tồn đọng – cập nhật real-time.'],
['Báo cáo lãnh đạo hằng tuần tự động','Báo cáo 1 trang: chỉ số rủi ro, sự cố nổi bật, tiến độ khắc phục, so sánh tuần trước.'],
['Đo lường tuân thủ theo cấp độ','Ánh xạ trạng thái các hệ thống kỹ thuật với yêu cầu TCVN 11930 cấp độ 4 → hiển thị % đáp ứng & gap.'],
['Điều phối ứng cứu liên đơn vị','Sự cố lớn được mở case chung, phân công đội mạng/ hệ thống/ ứng dụng/ pháp chế, theo dõi SLA.']],
tech:[['Open XDR / Autonomous SOC platform','Hợp nhất SIEM+NDR+UEBA+SOAR+dashboard.','Stellar Cyber, Palo Alto Cortex XSIAM, Google SecOps, Microsoft Defender XDR+Sentinel, CrowdStrike Falcon Next-Gen SIEM'],
['Exposure management / CTEM','Tư thế & rủi ro hợp nhất.','Tenable One, Qualys ETM, XM Cyber, Armis'],
['GRC / IRM','Quản trị rủi ro & tuân thủ.','ServiceNow IRM, Archer, MetricStream, OneTrust'],
['ITSM & quy trình','Ticket, change, CMDB.','OpenText SMAX, ServiceNow, Jira Service Management'],
['Security data lake & BI','Lưu trữ & phân tích báo cáo.','Snowflake, Databricks, Elastic, Grafana, Power BI'],
['Nền tảng trong nước','Giải pháp SOC/ giám sát nội địa.','Viettel Cyber Security, VNPT, FPT, VNCS, BKAV (theo dự án)']],
dia:{cols:[[{t:'Hệ thống kỹ thuật',s:'SIEM · EDR · NDR · VM · PAM · DLP · FW',k:'ext'}],[{t:'Lớp tích hợp dữ liệu',s:'Connector · API · Data lake'}],[{t:'Nền tảng điều hành tập trung',s:'Posture · Sự cố · Tuân thủ · Chính sách',k:'hl'}],[{t:'Dashboard lãnh đạo',s:'KPI · Rủi ro'},{t:'Trung tâm điều hành SOC',s:'Sự cố · Cảnh báo'}]],ctl:{t:'Kết nối hệ thống giám sát ANM quốc gia · Báo cáo cơ quan quản lý',s:'Mô hình 4 lớp (Chỉ thị 14/CT-TTg)',to:[2,3]}},
model:`<p><b>Nguyên lý:</b> Thu thập dữ liệu trạng thái & sự kiện từ các hệ thống kỹ thuật → chuẩn hoá về mô hình dữ liệu chung (tài sản, lỗ hổng, sự cố, biện pháp) → tính toán chỉ số (độ phủ, rủi ro, tuân thủ, MTTD/MTTR) → hiển thị theo vai trò → điều phối quy trình (case, ticket) → xuất báo cáo/ chia sẻ ra ngoài.</p>

S({
id:'bsg',g:'hw',no:33,folder:'33. Bilateral Security Gateway - Truyen du lieu bao mat',abbr:'Security Gateway (BSG)',
name:'Thiết bị truyền dữ liệu bảo mật chuyên dụng – Bilateral Security Gateway',layer:'Kết nối liên vùng IT/OT',csf:['PR'],
nts:'OPSWAT MetaDefender NetWall Bilateral Security Gateway (MD-NW-BIL-10GBPS), MetaDefender Core/Kiosk/MFT (kiểm tra file)',
list2:[[6,'Thiết bị truyền dữ liệu bảo mật chuyên dụng','Opswat','MD-NW-BIL-10GBPS']],
src:{f:'Truyền dữ liệu có kiểm soát giữa các vùng mạng có mức độ tin cậy khác nhau (IT ↔ OT, mạng nội bộ ↔ mạng chuyên dùng), ngắt giao thức, không cho phép kết nối trực tiếp hai chiều',d:'Đặt tại ranh giới giữa vùng mạng mức an toàn cao và vùng mức thấp hơn; thay thế/ bổ sung firewall tại điểm kết nối liên vùng; triển khai HA'},
what:`<p><b>Bilateral Security Gateway (BSG)</b> là thiết bị cô lập mạng chuyên dụng, cho phép trao đổi dữ liệu <b>có kiểm soát</b> giữa hai vùng mạng có mức tin cậy khác nhau mà <b>không tạo kết nối mạng trực tiếp</b>. Hai phía là hai máy chủ độc lập nối với nhau bằng liên kết riêng (PCIe/cáp dữ liệu chuyên dụng); dữ liệu được <b>ngắt giao thức (protocol break)</b> – tách payload khỏi giao thức gốc, kiểm tra, rồi dựng lại giao thức ở phía bên kia. Khác với firewall (chỉ lọc gói, vẫn định tuyến IP xuyên qua), BSG không định tuyến IP, nên mã độc/kẻ tấn công không thể "đi xuyên" qua kết nối.</p>
<p>Khác với <b>data diode thuần một chiều</b> (mục 34), BSG theo thiết kế vẫn chủ yếu là luồng một chiều nhưng có <b>cơ chế phản hồi hai chiều có kiểm soát</b> (bilateral) để hỗ trợ các ứng dụng cần xác nhận/ trả lời như <b>sao chép CSDL SQL, historian công nghiệp</b> (AVEVA PI), giao dịch request-response – điều mà diode thuần không làm được. OPSWAT MetaDefender NetWall BSG đạt chứng nhận IEC 62443, hỗ trợ giao thức IT và OT (Modbus, OPC UA/DA, MQTT, IEC 104, DNP3, ICCP), truyền file (SMB, SFTP), log/SNMP/Syslog, cập nhật AV/WSUS; dòng 10 Gbps chạy trên máy chủ enterprise.</p>`,
feat:['Cô lập vật lý/ logic hai vùng: hai máy chủ độc lập, không định tuyến IP, ngắt giao thức (protocol break) cho mọi luồng.','Truyền đa giao thức: TCP/UDP (unicast/multicast), HTTP/HTTPS, SMTP, NTP, luồng video/audio, chuyển tiếp gói Ethernet.','Giao thức công nghiệp: Modbus, OPC UA/DA/A&E, MQTT (SparkplugB), IEC 60870-5-104, DNP3, ICCP, AVEVA PI historian.','Sao chép CSDL SQL và historian với cơ chế phản hồi bilateral – không cần truyền lại, đảm bảo toàn vẹn.','Truyền file: FTP/FTPS/SFTP, SMB/CIFS; tích hợp MetaDefender Core để quét đa engine + Deep CDR trước khi file sang vùng tin cậy.','Chuyển log/giám sát: Syslog, SNMP trap, SPAN, tích hợp SIEM; cập nhật chữ ký AV và bản vá WSUS vào vùng cô lập.','HA (active/standby), khoá USB bảo mật cho quản trị, giao diện quản trị riêng; không cần cấu hình/ kiểm toán rule firewall.','Hiệu năng: nền tảng 100 Mbps nâng cấp lên 1 Gbps; tuỳ chọn 10 Gbps trên máy chủ enterprise; độ trễ thử nghiệm ~0,6 ms (TCP).'],
pain:['Mạng chuyên dùng/ mạng OT/ mạng lõi CSDL cần nhận dữ liệu từ vùng khác (bản vá, chữ ký AV, dữ liệu nghiệp vụ) hoặc gửi dữ liệu ra (log, báo cáo, replication) nhưng quy định yêu cầu cách ly.','Firewall tại điểm liên vùng có hàng trăm rule, cấu hình sai là mở đường cho tấn công; firewall cũng có lỗ hổng.','Các giao thức công nghiệp (Modbus, OPC) không có xác thực, dễ bị lạm dụng nếu kết nối trực tiếp.','Diode một chiều không đáp ứng được ứng dụng cần phản hồi (sao chép CSDL, historian).'],
risk:['Lây nhiễm ransomware từ mạng IT sang mạng điều khiển/ mạng lõi (kịch bản Colonial Pipeline, các vụ tấn công nhà máy).','Rò rỉ dữ liệu mật từ vùng cô lập ra ngoài.','Không đáp ứng yêu cầu phân vùng/ cách ly của hồ sơ cấp độ và tiêu chuẩn IEC 62443, NERC CIP.'],
uc:[['Đồng bộ dữ liệu CSDL lõi sang vùng khai thác','CSDL định danh ở vùng lõi sao chép một chiều có xác nhận sang vùng khai thác/ báo cáo qua BSG; vùng khai thác không thể kết nối ngược vào lõi.'],
['Đưa bản vá và chữ ký AV vào mạng cô lập','WSUS/ chữ ký AV được chuyển qua BSG, file được MetaDefender Core quét đa engine + CDR trước khi vào vùng cô lập.'],
['Kết nối OT – IT ở nhà máy điện/ trạm biến áp','Dữ liệu historian (AVEVA PI), OPC UA từ SCADA sang mạng doanh nghiệp để báo cáo; không một gói nào từ IT đi vào OT.'],
['Chuyển log ra SOC','Syslog/SNMP từ vùng cô lập được đẩy ra SIEM tập trung mà không mở kết nối vào.']],
tech:[['Protocol break / proxy hai máy chủ','Ngắt giao thức, tái tạo phía bên kia.','OPSWAT NetWall BSG/USG, Waterfall Unidirectional Gateway, Owl, Advenica'],
['Bilateral/ controlled return path','Cơ chế phản hồi có kiểm soát cho SQL/ historian.','OPSWAT BSG, Waterfall (FLIP – reversible), Hirschmann/Belden'],
['Deep CDR & multiscanning','Làm sạch file khi qua ranh giới.','OPSWAT MetaDefender Core, Votiro, Glasswall'],
['Cross Domain Solution (CDS)','Giải pháp chuyển dữ liệu giữa các miền phân loại mật.','Owl Cyber Defense, Forcepoint, Everfox, BAE Systems'],
['Tiêu chuẩn','IEC 62443-3-3 (zones & conduits), NERC CIP, NIST SP 800-82r3.','ISA/IEC, NIST']],
dia:{cols:[[{t:'Vùng tin cậy cao',s:'CSDL lõi · OT/SCADA',k:'ext'}],[{t:'NetWall BSG – phía cao',s:'Protocol break',k:'hl'}],[{t:'Liên kết chuyên dụng',s:'PCIe · không IP'}],[{t:'NetWall BSG – phía thấp',s:'Tái tạo giao thức',k:'hl'}],[{t:'Vùng tin cậy thấp',s:'IT · Khai thác · SOC',k:'ext'}]],ctl:{t:'MetaDefender Core (quét file) · Quản trị · SIEM',s:'Kiểm tra nội dung, log',to:[1,3]},note:'Luồng chính một chiều; phản hồi bilateral chỉ cho xác nhận ứng dụng (SQL/historian)'},
model:`<p><b>Nguyên lý:</b> Ứng dụng phía nguồn gửi dữ liệu tới BSG như tới một máy chủ thông thường (proxy) → BSG phía nguồn kết thúc phiên, trích payload → chuyển qua liên kết chuyên dụng không mang IP → BSG phía đích tái tạo phiên/ giao thức và gửi tới ứng dụng đích. Với ứng dụng cần phản hồi (SQL, historian), BSG truyền thông tin xác nhận theo kênh có kiểm soát, không cho phép lệnh tuỳ ý đi ngược.</p>
<ul><li>Đặt tại "conduit" giữa các zone theo IEC 62443; có thể đặt kèm firewall nhưng BSG là điểm cưỡng chế.</li><li>HA: cặp thiết bị active/standby.</li><li>File đi vào vùng cao luôn qua MetaDefender Core (multiscan + Deep CDR) hoặc Kiosk.</li></ul>`,
lic:{gen:['Tính theo <b>model phần cứng & thông lượng</b> (100 Mbps / 1 Gbps / 10 Gbps) – nâng cấp bằng license.','Theo <b>gói giao thức/ connector</b> (OT, SQL replication, file) tuỳ hãng.','Bảo trì/ support theo năm; module quét file (Core) tính riêng theo engine/ node.'],

S({
id:'diode',g:'hw',no:34,folder:'34. Data Diode - Cong mot chieu',abbr:'Data Diode',
name:'Thiết bị data diode – cổng truyền dữ liệu một chiều',layer:'Kết nối liên vùng IT/OT',csf:['PR'],
nts:'OPSWAT MetaDefender Optical Diode / NetWall USG, Owl Cyber Defense (Talon, OPDS)',
list2:[[7,'Thiết bị data diode','Opswat','MD-NW-BIL-10GBPS (*)']],
src:{f:'Bảo đảm dữ liệu chỉ đi theo một chiều bằng cơ chế phần cứng, cách ly tuyệt đối vùng mạng cần bảo vệ',d:'Đặt tại ranh giới vùng mạng mật/ vùng điều khiển với vùng bên ngoài; chiều dữ liệu được xác định theo yêu cầu bảo vệ (xuất dữ liệu ra hoặc nhập dữ liệu vào)'},
what:`<p><b>Data diode</b> là thiết bị bảo đảm dữ liệu <b>chỉ đi theo một chiều bằng vật lý</b> – thường dùng một sợi quang chỉ có bộ phát ở một đầu và bộ thu ở đầu kia, nên về mặt vật lý không tồn tại đường quay lại. Đây là mức cách ly cao nhất ("deterministic"), không phụ thuộc phần mềm hay cấu hình. Kèm theo là <b>proxy phần mềm hai phía</b> để chuyển đổi các giao thức hai chiều (TCP, file, OPC, historian…) thành luồng một chiều và tái tạo ở phía nhận.</p>
<p>Hai hướng sử dụng: <b>xuất dữ liệu ra</b> (bảo vệ mạng OT/ mạng mật khỏi tấn công từ ngoài – vẫn gửi được log, dữ liệu vận hành ra ngoài) và <b>nhập dữ liệu vào</b> (bảo vệ bí mật – dữ liệu chỉ vào, không bao giờ ra được). OPSWAT MetaDefender Optical Diode đạt <b>Common Criteria EAL4+</b>, có dạng 1U (100 Mbps nâng lên 1 Gbps, tuỳ chọn 10 Gbps) và DIN-rail công nghiệp; Owl Cyber Defense là hãng diode lâu đời phục vụ quốc phòng – hạ tầng trọng yếu, đạt CC EAL4+.</p>
<div class="src-note">⚠ <span><b>Lưu ý list NTS:</b> hạng mục 6 và 7 cùng ghi mã <b>MD-NW-BIL-10GBPS</b> – đây là mã của <b>Bilateral Security Gateway</b>. Nếu hạng mục 7 cần đúng "data diode" thì mã nên là dòng <b>MetaDefender Optical Diode / NetWall USG</b> (hoặc Owl). Đề nghị kiểm tra lại BOM với OPSWAT.</span></div>`,
feat:['Một chiều cưỡng chế bằng phần cứng (optical TX/RX), không phụ thuộc phần mềm – không thể bị cấu hình sai hay khai thác để mở chiều ngược.','Proxy hai phía chuyển đổi giao thức: TCP/UDP, HTTP(S), SMTP, file (FTP/SFTP/SMB), Syslog/SNMP, luồng video, chuyển tiếp gói Ethernet.','Giao thức OT: Modbus, OPC UA/DA/A&E, MQTT, IEC 104, DNP3, ICCP, AVEVA PI historian replication.','Cơ chế đảm bảo toàn vẹn khi không có ACK: FEC, gửi lặp, đánh số gói, kiểm tra checksum.','Tích hợp quét file (MetaDefender Core/ Kiosk) cho chiều nhập dữ liệu.','HA active/standby; dạng rack 1U và DIN-rail chịu nhiệt –40…70°C cho hiện trường.','Chứng nhận Common Criteria EAL4+; hỗ trợ tuân thủ IEC 62443, NERC CIP, NIST CSF.','Quản trị bằng khoá USB/ console riêng, log hoạt động.'],
pain:['Vùng điều khiển (SCADA điện, nước), mạng mật hoặc vùng dữ liệu lõi phải cách ly nhưng vẫn cần chia sẻ dữ liệu vận hành/ log ra ngoài.','Firewall không đủ mức đảm bảo cho hệ thống cấp độ cao/ hạ tầng trọng yếu; kiểm toán rule tốn công.','Quy định ngành (điện lực, quốc phòng) yêu cầu cách ly vật lý.'],
risk:['Tấn công từ Internet/ mạng doanh nghiệp vào hệ thống điều khiển gây gián đoạn vật lý.','Rò rỉ dữ liệu mật qua kênh kết nối.','Vi phạm quy định cách ly của hạ tầng trọng yếu.'],
uc:[['Xuất dữ liệu SCADA ra mạng doanh nghiệp','Trạm biến áp/ nhà máy gửi dữ liệu historian, cảnh báo, log ra mạng IT qua optical diode; không có đường vào mạng điều khiển.'],
['Mạng mật nhận dữ liệu từ bên ngoài','Mạng chuyên dùng nhận bản tin, cập nhật, dữ liệu tổng hợp qua diode chiều vào; dữ liệu mật không thể ra ngoài.'],
['Giám sát an ninh mạng OT từ SOC','Bản sao lưu lượng/ log OT được đẩy một chiều ra NDR/SIEM.'],
['Sao lưu dữ liệu sang vùng cô lập (immutable)','Bản sao lưu chỉ đi vào vùng lưu trữ cô lập, ransomware không thể truy cập ngược.']],
tech:[['Optical data diode','Một chiều bằng phần cứng quang.','OPSWAT Optical Diode, Owl (DualDiode, Talon), Waterfall, Fox Crypto DataDiode, Advenica'],
['Software unidirectional gateway','Một chiều bằng cơ chế phần mềm/ phần cứng chuyên dụng.','OPSWAT NetWall USG'],
['Protocol proxy','Chuyển đổi giao thức hai chiều sang một chiều.','Tất cả hãng diode'],
['CDS – Cross Domain Solution','Chuyển dữ liệu giữa miền phân loại.','Owl XD, Everfox'],
['Chuẩn chứng nhận','Common Criteria EAL4+/7, NATO.','CCRA']],
dia:{cols:[[{t:'Vùng cần bảo vệ',s:'OT/SCADA · Mạng mật',k:'ext'}],[{t:'Proxy gửi (TX)',s:'Chuyển đổi giao thức'}],[{t:'Optical Diode',s:'Một chiều vật lý',k:'hl'}],[{t:'Proxy nhận (RX)',s:'Tái tạo giao thức'}],[{t:'Vùng nhận',s:'IT · SOC · Báo cáo',k:'ext'}]],ctl:{t:'Quản trị khoá USB · Log · SIEM',s:'Không có đường quay về',to:[2]}},
model:`<p><b>Nguyên lý:</b> Máy chủ proxy phía nguồn nhận dữ liệu từ ứng dụng (đóng vai trò máy chủ đích) → đóng gói thành luồng một chiều kèm mã sửa lỗi → phát qua sợi quang chỉ có chiều TX → proxy phía nhận kiểm tra toàn vẹn, tái tạo giao thức và chuyển tới ứng dụng đích. Không có tín hiệu nào quay ngược, nên mọi tấn công từ phía nhận về phía nguồn là bất khả thi về mặt vật lý.</p>
<ul><li>Xác định chiều theo mục tiêu bảo vệ: <b>tính toàn vẹn/ sẵn sàng</b> (OT → ra) hay <b>tính bí mật</b> (vào → mạng mật).</li><li>Kết hợp BSG (mục 33) khi có ứng dụng bắt buộc phản hồi.</li></ul>`,
lic:{gen:['Chủ yếu theo <b>model phần cứng & thông lượng</b> (10/50 Mbps DIN-rail, 100 Mbps–1 Gbps–10 Gbps rack).','Một số hãng tính thêm theo <b>connector/ giao thức</b> (OPC, PI, SQL, file).','Support/ bảo hành theo năm.'],
v:[['OPSWAT MetaDefender Optical Diode / NetWall USG','Theo model (1U, DIN-rail) & thông lượng nâng cấp bằng license; tích hợp Core/Kiosk tính riêng.','NTS phân phối',1],['Owl Cyber Defense','Theo model (Talon, OPDS-100/1000, XD) & thông lượng; connector theo ứng dụng.','NTS phân phối',1],['Waterfall Security','Theo model + connector.','',0]]},
pre:[['Chiều dữ liệu','Xác định rõ chiều và loại dữ liệu cần truyền; ứng dụng nào cần phản hồi thì cân nhắc BSG.'],['Ứng dụng','Danh sách giao thức, dung lượng/ tần suất; cấu hình ứng dụng trỏ tới proxy.'],['Hạ tầng','Vị trí rack/ tủ điện DIN-rail, nguồn, nhiệt độ môi trường (hiện trường OT).'],['Pháp lý','Yêu cầu chứng nhận (CC EAL4+), quy định cách ly của ngành/ cơ quan.']],
