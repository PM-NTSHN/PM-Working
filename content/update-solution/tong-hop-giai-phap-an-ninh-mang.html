/* ============ PM Hub — NTS Hà Nội ============ */
:root {
  --nts-blue: #0b5cad;
  --nts-blue-2: #1673d1;
  --nts-navy: #061f42;
  --nts-navy-2: #0a2d5c;
  --nts-orange: #f37021;
  --nts-orange-2: #ff9a4d;

  --bg: #f4f6fa;
  --surface: #ffffff;
  --surface-2: #f8fafd;
  --text: #0e1a2b;
  --muted: #5a6a82;
  --faint: #8a98ad;
  --border: #e3e8f0;
  --border-2: #d3dbe7;
  --ring: rgba(11, 92, 173, .28);
  --hover: #eef3fa;
  --accent: var(--nts-blue);
  --accent-soft: #e6f0fb;
  --mark: #ffe1c7;
  --shadow-sm: 0 1px 2px rgba(14, 26, 43, .06), 0 1px 1px rgba(14, 26, 43, .04);
  --shadow: 0 1px 2px rgba(14, 26, 43, .05), 0 8px 24px -8px rgba(14, 26, 43, .12);
  --shadow-lg: 0 24px 64px -16px rgba(6, 31, 66, .35);

  --sb-bg: linear-gradient(180deg, #06204a 0%, #072a5a 55%, #08305f 100%);
  --sb-text: #c9d6ea;
  --sb-muted: #7f95b6;
  --sb-hover: rgba(255, 255, 255, .07);
  --sb-active: rgba(255, 255, 255, .12);

  --radius: 14px;
  --radius-sm: 10px;
  --sb-w: 272px;
  --top-h: 60px;
  --font: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #070f1d; --surface: #0e1a2e; --surface-2: #0b1627; --text: #e5ecf6; --muted: #93a3bb; --faint: #6b7d97;
    --border: #1b2a42; --border-2: #253855; --hover: #13233b; --accent: #4d9bf0; --accent-soft: rgba(77, 155, 240, .13);
    --mark: rgba(243, 112, 33, .38); --ring: rgba(77, 155, 240, .35);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -8px rgba(0, 0, 0, .5);
    --sb-bg: linear-gradient(180deg, #050d1b 0%, #071430 100%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #070f1d; --surface: #0e1a2e; --surface-2: #0b1627; --text: #e5ecf6; --muted: #93a3bb; --faint: #6b7d97;
  --border: #1b2a42; --border-2: #253855; --hover: #13233b; --accent: #4d9bf0; --accent-soft: rgba(77, 155, 240, .13);
  --mark: rgba(243, 112, 33, .38); --ring: rgba(77, 155, 240, .35);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -8px rgba(0, 0, 0, .5);
  --sb-bg: linear-gradient(180deg, #050d1b 0%, #071430 100%);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14.5px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
[hidden] { display: none !important; }
.ic { width: 18px; height: 18px; flex: none; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
kbd { font: 600 11px/1 var(--font); padding: 3px 6px; border-radius: 6px; border: 1px solid var(--border-2); background: var(--surface-2); color: var(--muted); }

/* ============ APP SHELL ============ */
.app { display: flex; height: 100vh; height: 100dvh; }
.sidebar {
  width: var(--sb-w); flex: none; display: flex; flex-direction: column; background: var(--sb-bg); color: var(--sb-text);
  border-right: 1px solid rgba(255, 255, 255, .06); transition: width .25s, transform .25s; position: relative; z-index: 30;
}
.sb-head { display: flex; align-items: center; gap: 12px; padding: 18px 16px 14px; }
.sb-logo { width: 40px; height: 40px; border-radius: 11px; background: #fff; display: grid; place-items: center; flex: none; box-shadow: 0 4px 14px rgba(0, 0, 0, .3); }
.sb-logo img { width: 32px; }
.sb-brand { min-width: 0; flex: 1; }
.sb-brand b { display: block; color: #fff; font-size: 16px; letter-spacing: -.01em; }
.sb-brand span { font-size: 12px; color: var(--sb-muted); }
.sb-icon-btn { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--sb-muted); }
.sb-icon-btn:hover { background: var(--sb-hover); color: #fff; }
.sb-search {
  margin: 4px 14px 10px; height: 40px; border-radius: 10px; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 12px;
  background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .09); color: var(--sb-muted); text-align: left;
}
.sb-search:hover { background: rgba(255, 255, 255, .1); color: #fff; }
.sb-search .lbl { flex: 1; }
.sb-search > span:not(.lbl), .top-search > span:not(.lbl) { display: grid; }
.sb-search kbd { background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .12); color: var(--sb-muted); }
.nav { flex: 1; overflow-y: auto; padding: 6px 10px 16px; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .15) transparent; }
.nav-group { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--sb-muted); padding: 16px 10px 6px; }
.nav-item {
  display: flex; align-items: center; gap: 11px; width: 100%; padding: 8px 10px; border-radius: 9px; color: var(--sb-text); font-weight: 500; text-align: left; position: relative;
}
.nav-item:hover { background: var(--sb-hover); color: #fff; }
.nav-item.active { background: var(--sb-active); color: #fff; }
.nav-item.active::before { content: ''; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--nts-orange); }
.nav-item .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item .count { font-size: 11.5px; color: var(--sb-muted); font-weight: 600; }
.nav-item .caret { width: 22px; height: 22px; margin-right: -4px; border-radius: 6px; display: grid; place-items: center; color: var(--sb-muted); transition: transform .2s; }
.nav-item .caret:hover { background: rgba(255, 255, 255, .1); }
.nav-item .caret .ic { width: 14px; height: 14px; }
.nav-node.open > .nav-item .caret { transform: rotate(90deg); }
.nav-item .lock { width: 14px; height: 14px; color: var(--nts-orange-2); }
.nav-children { display: none; margin: 2px 0 4px 20px; padding-left: 10px; border-left: 1px solid rgba(255, 255, 255, .1); }
.nav-node.open > .nav-children { display: block; }
.nav-children .nav-item { padding: 6px 10px; font-size: 13.5px; font-weight: 450; color: #aebfd8; }
.nav-children .nav-item.active::before { left: -11px; }
.nav-children .nav-item.soon { opacity: .55; }
.pill { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 99px; background: rgba(243, 112, 33, .18); color: var(--nts-orange-2); letter-spacing: .02em; white-space: nowrap; }
.sb-foot { padding: 12px 14px; border-top: 1px solid rgba(255, 255, 255, .08); display: flex; align-items: center; gap: 10px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; background: linear-gradient(135deg, var(--nts-orange), #ffb067); flex: none; }
.sb-user { flex: 1; min-width: 0; font-size: 12.5px; line-height: 1.3; }
.sb-user b { display: block; color: #fff; font-size: 13.5px; }
.sb-user span { color: var(--sb-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

.app.sb-collapsed .sidebar { width: 72px; }
.app.sb-collapsed .sb-brand, .app.sb-collapsed .sb-search .lbl, .app.sb-collapsed .sb-search kbd, .app.sb-collapsed .nav-group,
.app.sb-collapsed .nav-item .label, .app.sb-collapsed .nav-item .count, .app.sb-collapsed .nav-item .caret, .app.sb-collapsed .nav-item .pill,
.app.sb-collapsed .nav-children, .app.sb-collapsed .sb-user, .app.sb-collapsed .sb-foot .sb-icon-btn:not(#btnTheme) { display: none !important; }
.app.sb-collapsed .sb-head { flex-direction: column; padding: 16px 10px 10px; }
.app.sb-collapsed .sb-search { justify-content: center; padding: 0; margin: 4px 14px 10px; }
.app.sb-collapsed .nav-item { justify-content: center; padding: 10px; }
.app.sb-collapsed .nav-group { height: 10px; }
.app.sb-collapsed .sb-foot { flex-direction: column; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: var(--top-h); flex: none; display: flex; align-items: center; gap: 10px; padding: 0 18px;
  background: color-mix(in srgb, var(--surface) 85%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); position: relative; z-index: 10;
}
.icon-btn { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; color: var(--muted); flex: none; }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.icon-btn.on { color: var(--nts-orange); }
.icon-btn.on .ic { fill: currentColor; }
.only-mobile { display: none; }
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; font-size: 14px; color: var(--muted); }
.crumbs a:hover { color: var(--text); }
.crumbs .sep { width: 14px; height: 14px; color: var(--faint); }
.crumbs b { color: var(--text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumbs > * { flex: none; }
.crumbs > b { flex: 0 1 auto; }
.top-search {
  height: 38px; width: 360px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--faint);
  display: flex; align-items: center; gap: 10px; padding: 0 8px 0 12px;
}
.top-search:hover { border-color: var(--border-2); color: var(--muted); }
.top-search .lbl { flex: 1; text-align: left; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { display: flex; align-items: center; gap: 2px; }
.divider-v { width: 1px; height: 22px; background: var(--border); margin: 0 6px; }

.view { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
.page { max-width: 1240px; margin: 0 auto; padding: 28px 28px 64px; animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } }

.frame-view { flex: 1; position: relative; background: var(--surface); }
.frame-host, .frame-host iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
.frame-loading { position: absolute; inset: 0; display: grid; place-items: center; background: var(--surface); color: var(--muted); z-index: 2; gap: 12px; align-content: center; justify-items: center; font-size: 13.5px; }
.frame-loading .spinner { border-color: var(--border-2); border-top-color: var(--accent); width: 26px; height: 26px; }

/* ============ COMMON UI ============ */
.page-head { display: flex; align-items: flex-start; gap: 18px; margin-bottom: 24px; }
.page-icon { width: 54px; height: 54px; border-radius: 15px; display: grid; place-items: center; flex: none; color: #fff; background: linear-gradient(135deg, var(--nts-blue-2), var(--nts-navy-2)); box-shadow: 0 10px 24px -10px rgba(11, 92, 173, .7); }
.page-icon .ic { width: 26px; height: 26px; }
.page-head h1 { margin: 2px 0 4px; font-size: 26px; letter-spacing: -.02em; line-height: 1.2; }
.page-head p { margin: 0; color: var(--muted); max-width: 760px; }
.page-head .grow { flex: 1; min-width: 0; }
.h2 { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; margin: 34px 0 14px; letter-spacing: -.01em; }
.h2 .ic { color: var(--accent); }
.h2 .more { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--accent); }
.muted { color: var(--muted); }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm);
  transition: transform .18s, box-shadow .18s, border-color .18s;
}
a.card:hover, button.card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--border-2); }
.grid { display: grid; gap: 14px; }
.g-tiles { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.g-cards { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }

.tile { display: flex; flex-direction: column; gap: 12px; padding: 18px; position: relative; overflow: hidden; text-align: left; }
.tile .t-icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: var(--c, var(--accent)); background: color-mix(in srgb, var(--c, var(--accent)) 13%, transparent); }
.tile .t-icon .ic { width: 22px; height: 22px; }
.tile h3 { margin: 0; font-size: 15.5px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.tile p { margin: 0; color: var(--muted); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile .go { position: absolute; top: 18px; right: 16px; color: var(--faint); transition: transform .2s, color .2s; }
.tile:hover .go { color: var(--c, var(--accent)); transform: translateX(3px); }
.tile .lock-badge { position: absolute; top: 16px; right: 16px; color: var(--nts-orange); }
.tile.soon { opacity: .6; cursor: default; }
.tile.soon:hover { transform: none; box-shadow: var(--shadow-sm); }
.tile::after { content: ''; position: absolute; right: -40px; bottom: -40px; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--c, var(--accent)) 16%, transparent), transparent 70%); pointer-events: none; }

.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 99px; color: var(--c, var(--muted)); background: color-mix(in srgb, var(--c, var(--muted)) 12%, transparent); white-space: nowrap; }
.badge .ic { width: 12px; height: 12px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 11.5px; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 99px; font-size: 13px; font-weight: 500;
  border: 1px solid var(--border); background: var(--surface); color: var(--muted); transition: .15s;
}
.chip:hover { border-color: var(--border-2); color: var(--text); }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.chip .n { font-size: 11.5px; opacity: .7; }
.chip .ic { width: 15px; height: 15px; }

.btn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 15px; border-radius: 10px; font-weight: 600; font-size: 13.5px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
.btn:hover { background: var(--hover); }
.btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.accent:hover { filter: brightness(1.08); }
.btn .ic { width: 16px; height: 16px; }

.filterbar { display: flex; flex-direction: column; gap: 12px; margin-bottom: 22px; }
.filter-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.filter-row > .lbl { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); width: 74px; flex: none; }
.local-search { position: relative; flex: 1; min-width: 220px; max-width: 420px; }
.local-search .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.local-search input { width: 100%; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); padding: 0 12px 0 38px; outline: none; }
.local-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--ring); }
.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); }
.seg button { height: 32px; padding: 0 12px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
.seg .ic { width: 15px; height: 15px; }

.empty { padding: 48px 20px; text-align: center; color: var(--muted); border: 1.5px dashed var(--border-2); border-radius: var(--radius); }
.empty .ic { width: 34px; height: 34px; color: var(--faint); margin-bottom: 8px; }

/* ============ HOME ============ */
.hero {
  position: relative; overflow: hidden; border-radius: 22px; padding: 34px 34px 30px; color: #fff; margin-bottom: 10px;
  background:
    radial-gradient(600px 300px at 100% 0%, rgba(243, 112, 33, .45), transparent 60%),
    radial-gradient(500px 300px at 0% 100%, rgba(64, 160, 255, .35), transparent 60%),
    linear-gradient(135deg, #062250, #0b4a92);
  box-shadow: var(--shadow-lg);
}
.hero::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(255, 255, 255, .12) 1px, transparent 1px); background-size: 22px 22px; mask-image: linear-gradient(90deg, transparent, #000 60%); }
.hero > * { position: relative; }
.hero .hello { font-size: 13.5px; color: rgba(225, 236, 255, .8); display: flex; align-items: center; gap: 8px; }
.hero h1 { margin: 6px 0 4px; font-size: 30px; letter-spacing: -.02em; line-height: 1.2; }
.hero p { margin: 0 0 22px; color: rgba(225, 236, 255, .8); }
.hero-search {
  display: flex; align-items: center; gap: 12px; width: 100%; max-width: 640px; height: 54px; padding: 0 12px 0 18px; border-radius: 14px; text-align: left;
  background: rgba(255, 255, 255, .96); color: #5a6a82; box-shadow: 0 16px 40px -12px rgba(0, 0, 0, .5); font-size: 15px;
}
.hero-search .lbl { flex: 1; }
.hero-search .ic { color: var(--nts-blue); width: 20px; height: 20px; }
.hero-search kbd { background: #eef2f8; border-color: #d8e0eb; }
.hero .quick { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12.5px; color: rgba(225, 236, 255, .7); }
.hero .quick button { padding: 4px 11px; border-radius: 99px; background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .16); color: #fff; font-size: 12.5px; }
.hero .quick button:hover { background: rgba(255, 255, 255, .2); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 18px; }
.stat { padding: 16px 18px; display: flex; align-items: center; gap: 14px; }
.stat .t-icon { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); }
.stat b { display: block; font-size: 22px; line-height: 1.1; letter-spacing: -.02em; }
.stat span { font-size: 12.5px; color: var(--muted); }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.list-card { padding: 6px; }
.list-card .empty-mini { padding: 22px; text-align: center; color: var(--faint); font-size: 13px; }
.row-link { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; }
.row-link:hover { background: var(--hover); }
.row-link .r-icon { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex: none; color: var(--c, var(--accent)); background: color-mix(in srgb, var(--c, var(--accent)) 12%, transparent); }
.row-link .r-icon .ic { width: 17px; height: 17px; }
.row-link .r-main { flex: 1; min-width: 0; }
.row-link .r-main b { display: block; font-weight: 600; font-size: 13.8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-link .r-main span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.row-link .r-side { font-size: 12px; color: var(--faint); flex: none; }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.cat-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.cat-card .t-icon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); flex: none; }
.cat-card b { font-size: 13.5px; font-weight: 600; display: block; line-height: 1.3; }
.cat-card span { font-size: 12px; color: var(--muted); }

/* ============ SALE GUIDE ============ */
.vendor-card { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.vendor-top { display: flex; align-items: center; gap: 12px; }
.v-avatar { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; font-weight: 800; font-size: 16px; color: #fff; flex: none; letter-spacing: -.02em;
  background: linear-gradient(135deg, color-mix(in srgb, var(--c, var(--nts-blue)) 80%, #061f42), color-mix(in srgb, var(--c, var(--nts-blue)) 40%, #061f42)); box-shadow: 0 8px 18px -8px var(--c, var(--nts-blue)); text-shadow: 0 1px 2px rgba(0,0,0,.25); }
.vendor-top h3 { margin: 0; font-size: 16.5px; letter-spacing: -.01em; }
.vendor-top span { font-size: 12.5px; color: var(--muted); }
.vendor-sols { display: flex; flex-direction: column; gap: 6px; }
.vendor-sols div { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.vendor-sols i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; }
.vendor-foot { display: flex; gap: 6px; flex-wrap: wrap; padding-top: 12px; border-top: 1px dashed var(--border); }
.sol-block { margin-bottom: 18px; overflow: hidden; }
.sol-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--border); background: linear-gradient(90deg, color-mix(in srgb, var(--c) 8%, transparent), transparent 60%); }
.sol-head .t-icon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--c); background: color-mix(in srgb, var(--c) 15%, transparent); }
.sol-head h3 { margin: 0; font-size: 15.5px; }
.sol-head span { font-size: 12.5px; color: var(--muted); }
.doc-row { display: flex; align-items: center; gap: 14px; padding: 13px 18px; border-bottom: 1px solid var(--border); }
.doc-row:last-child { border-bottom: 0; }
.doc-row:hover { background: var(--hover); }
.doc-row .r-icon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none; color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); }
.doc-row .r-main { flex: 1; min-width: 0; }
.doc-row .r-main b { display: block; font-weight: 600; font-size: 14px; margin-bottom: 3px; }
.doc-row .r-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.doc-row .go { color: var(--faint); }
.doc-row:hover .go { color: var(--accent); }
.related-tools { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; }

/* ============ LOCK / BOM ============ */
.lock-screen { min-height: 100%; display: grid; place-items: center; padding: 30px 16px;
  background: radial-gradient(600px 400px at 50% 0%, color-mix(in srgb, var(--nts-orange) 10%, transparent), transparent 70%); }
.lock-card { width: 100%; max-width: 400px; padding: 30px 28px; text-align: center; box-shadow: var(--shadow); }
.lock-card .lock-ic { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 18px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #ff8a3d, #d9550c); box-shadow: 0 14px 30px -10px rgba(243, 112, 33, .7); }
.lock-card .lock-ic .ic { width: 30px; height: 30px; }
.lock-card h2 { margin: 0 0 6px; font-size: 20px; }
.lock-card p { margin: 0 0 20px; color: var(--muted); font-size: 13.5px; }
.lock-card form { text-align: left; }
.lock-card .input input { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); }
.lock-card .input input::placeholder { color: var(--faint); }
.lock-card .input .ic { color: var(--faint); }
.lock-card .input input:focus { border-color: var(--nts-orange); box-shadow: 0 0 0 4px rgba(243, 112, 33, .15); background: var(--surface); }
.lock-card .input .eye { color: var(--faint); }
.lock-card .input .eye:hover { background: var(--hover); }
.lock-card .field label { color: var(--muted); }
.lock-card .login-err { color: #d9480f; }
.unlock-bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; margin-bottom: 20px; font-size: 13.5px;
  background: color-mix(in srgb, #16a34a 9%, var(--surface)); border: 1px solid color-mix(in srgb, #16a34a 28%, transparent); }
.unlock-bar .ic { color: #16a34a; }
.unlock-bar.locked { background: color-mix(in srgb, var(--nts-orange) 8%, var(--surface)); border-color: color-mix(in srgb, var(--nts-orange) 30%, transparent); }
.unlock-bar.locked .ic { color: var(--nts-orange); }
.unlock-bar span { flex: 1; }

/* ============ PALETTE ============ */
.search-pop { position: fixed; z-index: 60; }
@keyframes fadeIn { from { opacity: 0; } }
.pal { width: 100%; max-height: 70vh; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow-lg); overflow: hidden; animation: pop .18s cubic-bezier(.2, .8, .2, 1); }
@keyframes pop { from { opacity: 0; transform: translateY(-8px) scale(.98); } }
.pal-input { display: flex; align-items: center; gap: 12px; padding: 0 18px; height: 62px; border-bottom: 1px solid var(--border); flex: none; }
.pal-input .ic { width: 21px; height: 21px; color: var(--accent); }
.pal-input input { flex: 1; height: 100%; border: 0; outline: none; background: none; font-size: 17px; }
.pal-input input::placeholder { color: var(--faint); }
.pal-sugg { padding: 10px 18px 4px; display: flex; flex-direction: column; gap: 8px; flex: none; }
.pal-sugg .line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--faint); }
.pal-sugg .line > span { width: 112px; flex: none; font-weight: 600; }
.pal-sugg button { font-size: 12.5px; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--border); color: var(--muted); background: var(--surface-2); }
.pal-sugg button:hover { border-color: var(--accent); color: var(--accent); }
.pal-sugg button.syn { border-style: dashed; }
.pal-body { overflow-y: auto; padding: 6px 8px 10px; flex: 1; }
.pal-group { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: 12px 12px 6px; display: flex; justify-content: space-between; }
.pal-item { display: flex; gap: 12px; padding: 10px 12px; border-radius: 11px; align-items: flex-start; cursor: pointer; }
.pal-item.sel { background: var(--accent-soft); }
.pal-item .r-icon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none; color: var(--c, var(--accent)); background: color-mix(in srgb, var(--c, var(--accent)) 12%, transparent); }
.pal-item .r-main { flex: 1; min-width: 0; }
.pal-item .r-main b { display: block; font-weight: 600; font-size: 14px; }
.pal-item .r-meta { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 1px; }
.pal-item .snip { font-size: 12.5px; color: var(--muted); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pal-item .enter { opacity: 0; color: var(--faint); align-self: center; }
.pal-item.sel .enter { opacity: 1; }
.pal-foot { display: flex; gap: 16px; padding: 10px 18px; border-top: 1px solid var(--border); font-size: 12px; color: var(--faint); flex: none; background: var(--surface-2); }
.pal-foot span { display: inline-flex; gap: 6px; align-items: center; }
.pal-foot .right { margin-left: auto; }
.pal-empty { padding: 40px 20px; text-align: center; color: var(--muted); }

/* ============ RELATED DRAWER ============ */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 360px; max-width: 92vw; z-index: 40; background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; transform: translateX(105%); transition: transform .25s cubic-bezier(.2, .8, .2, 1); }
.drawer.open { transform: none; }
.drawer-head { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px 20px; border-bottom: 1px solid var(--border); }
.drawer-head b { flex: 1; font-size: 15px; }
.drawer-body { overflow-y: auto; padding: 10px; flex: 1; }
.drawer .info { padding: 10px 12px 14px; font-size: 13px; color: var(--muted); border-bottom: 1px dashed var(--border); margin-bottom: 8px; }
.drawer .info .tags { margin-top: 10px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; z-index: 70; padding: 10px 16px; border-radius: 10px; background: #0e1a2b; color: #fff; font-size: 13.5px; box-shadow: var(--shadow-lg); transition: .25s; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%); }
.scrim { position: fixed; inset: 0; background: rgba(4, 12, 26, .45); z-index: 25; }

/* Toàn màn hình nội dung */
.app.focus .sidebar, .app.focus .topbar { display: none; }

/* ============ RESPONSIVE ============ */
@media (max-width: 1100px) { .top-search { width: 220px; } .stats { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 860px) {
  .sidebar { position: fixed; top: 0; bottom: 0; left: 0; transform: translateX(-100%); width: 284px !important; box-shadow: var(--shadow-lg); }
  .app.sb-open .sidebar { transform: none; }
  .only-mobile { display: grid; }
  .top-search { width: 40px; padding: 0; justify-content: center; }
  .top-search kbd { display: none; }
  .top-search .lbl { flex: 0 0 0; width: 0; }
  .two-col { grid-template-columns: 1fr; }
  .page { padding: 20px 16px 48px; }
  .hero { padding: 24px 20px; border-radius: 18px; }
  .hero h1 { font-size: 24px; }
  .topbar { padding: 0 10px; }
  .divider-v, .hide-sm { display: none; }
}
@media (max-width: 560px) {
  .stats { grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { padding: 12px; }
  .page-head { flex-direction: column; gap: 12px; }
  .filter-row > .lbl { width: 100%; }
  .login-title { font-size: 34px; }
  .login-logo { width: 124px; height: 124px; border-radius: 30px; }
  .login-logo img { width: 98px; }
  .pal-sugg .line > span { width: 100%; }
  .crumbs a, .crumbs .sep { display: none; }
}

/* ============ Ô tìm kiếm gõ trực tiếp ============ */
.sb-search, .top-search, .hero-search { cursor: text; }
.search-input { flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: none; padding: 0; font: inherit; color: inherit; }
.sb-search .search-input { color: #fff; font-size: 13.5px; }
.sb-search .search-input::placeholder { color: var(--sb-muted); }
.sb-search:focus-within { background: rgba(255, 255, 255, .13); border-color: rgba(255, 154, 77, .6); }
.top-search .search-input { color: var(--text); font-size: 13.5px; }

<script>
const SOL=[];function S(o){SOL.push(o)}
S({
id:'ddos',g:'hw',no:1,folder:'01. DDoS Protection',abbr:'Anti-DDoS',
name:'Thiết bị phòng chống tấn công DDoS chuyên dụng',layer:'Biên Internet',csf:['PR','DE','RS'],
nts:'NETSCOUT Arbor Edge Defense (AED), Arbor Sightline + TMS',
src:{f:'Phát hiện và ngăn chặn các cuộc tấn công DDoS ở lớp mạng và lớp ứng dụng; phân tích bất thường lưu lượng; giảm thiểu lưu lượng tấn công trước khi đi vào hệ thống',d:'Bố trí tại lớp biên kết nối Internet; triển khai HA; có khả năng phối hợp với giải pháp chống DDoS của nhà cung cấp đường truyền khi cần thiết'},
what:`<p><b>Anti-DDoS</b> là thiết bị (appliance/virtual) chuyên dụng đặt ở biên Internet, có nhiệm vụ <b>phát hiện và lọc bỏ lưu lượng tấn công từ chối dịch vụ phân tán</b> (Distributed Denial of Service) trước khi lưu lượng này chạm tới firewall, load balancer và máy chủ ứng dụng. Khác với NGFW/IPS (stateful, có bảng phiên hữu hạn), thiết bị Anti-DDoS được thiết kế <b>stateless / ít trạng thái</b>, xử lý hàng triệu gói tin/giây nên không bị "ngộp" bởi chính cuộc tấn công.</p>
<p>Hệ sinh thái gồm 2 mô hình bổ trợ nhau: (1) <b>On-premise</b> (CPE) – thiết bị inline tại DC của khách hàng, chặn tấn công lớp ứng dụng và tấn công "low & slow", phản ứng trong vài giây; (2) <b>Cloud/ISP scrubbing</b> – trung tâm làm sạch của nhà mạng/nhà cung cấp cloud, chống tấn công volumetric hàng trăm Gbps–Tbps vượt quá băng thông đường truyền. Hai lớp phối hợp qua cơ chế <b>Cloud Signaling (RFC 8782 – DOTS)</b>: khi lưu lượng sắp bão hoà đường truyền, thiết bị on-prem tự động "gọi" nhà mạng chuyển hướng (BGP diversion) lưu lượng sang scrubbing center.</p>`,
feat:['Phát hiện tấn công volumetric (UDP/ICMP flood, amplification DNS/NTP/Memcached/CLDAP/SSDP), protocol (SYN/ACK flood, fragment, TCP state exhaustion) và lớp ứng dụng (HTTP/HTTPS flood, Slowloris, DNS water-torture, SIP flood).',
'Phân tích lưu lượng theo baseline (học hành vi bình thường theo giờ/ngày), phát hiện bất thường theo ngưỡng động; hỗ trợ NetFlow/IPFIX/sFlow + phân tích gói tin.',
'Bộ đối sách (countermeasures) nhiều lớp: lọc theo chữ ký, rate-limit, challenge (TCP SYN authentication, HTTP redirect/JS challenge, DNS authentication), malformed packet filter, geo-IP, danh sách đen/trắng động.',
'Chặn theo Threat Intelligence: danh sách IP botnet, C2, scanner cập nhật liên tục (ví dụ NETSCOUT ATLAS Intelligence Feed) – chặn cả tấn công inbound và kết nối outbound tới C2.',
'Giải mã TLS (tuỳ chọn, có module tăng tốc mã hoá) để chống HTTPS flood; hỗ trợ TLS 1.3.',
'Cloud Signaling/DOTS tự động phối hợp với ISP/Cloud scrubbing khi băng thông vượt ngưỡng.',
'Báo cáo thời gian thực, bằng chứng tấn công (PCAP), thống kê top attacker, top target; API REST và syslog/SNMP tích hợp SIEM/SOAR.',
'Chế độ triển khai inline, out-of-path (diversion/re-injection), giám sát (monitor/SPAN); bypass phần cứng khi mất nguồn (fail-open).'],
pain:['Hệ thống cung cấp dịch vụ công trực tuyến (cổng định danh, cổng thanh toán, ngân hàng số) luôn là mục tiêu DDoS của nhóm hacktivist/tống tiền; các đợt cao điểm (kỳ thi, đóng thuế, sự kiện chính trị) thường đi kèm tấn công.',
'Firewall/IPS/WAF và load balancer là thiết bị stateful: bảng phiên bị lấp đầy bởi SYN flood khiến chính thiết bị bảo mật trở thành điểm nghẽn.',
'Băng thông Internet hữu hạn (1–10–40 Gbps) trong khi tấn công volumetric hiện đại đạt hàng trăm Gbps tới vài Tbps.',
'Tấn công lớp ứng dụng (HTTP flood dùng botnet IoT, carpet-bombing vào cả dải IP) khó phân biệt với người dùng thật nếu chỉ dùng ngưỡng tĩnh.',
'Thiếu khả năng quan sát: khi dịch vụ chậm không biết là do tấn công, do lỗi ứng dụng hay do đường truyền.'],
risk:['Gián đoạn dịch vụ diện rộng (cổng dịch vụ công, ứng dụng định danh trên di động) – ảnh hưởng hàng triệu người dùng và uy tín cơ quan.',
'DDoS được dùng làm "màn khói" che giấu xâm nhập thực sự hoặc đánh cắp dữ liệu.',
'Thiệt hại tài chính, phạt SLA, bị tống tiền (Ransom DDoS).',
'Không đáp ứng yêu cầu bảo đảm tính sẵn sàng theo hồ sơ đề xuất cấp độ (TCVN 11930:2017 / Thông tư 12/2022) với hệ thống cấp độ 4–5.'],
uc:[['Cổng dịch vụ quốc gia bị HTTP flood giờ cao điểm','Botnet hàng chục nghìn IP gửi request hợp lệ về mặt giao thức. AED áp dụng HTTP rate-limit theo nguồn, JS/redirect challenge và chặn theo IP reputation, giữ cho người dùng thật vẫn đăng nhập bình thường; WAF phía sau không bị quá tải.'],
['Tấn công volumetric 300 Gbps vượt đường truyền','AED phát hiện đường truyền vượt 80% → gửi Cloud Signal tới nhà mạng (Viettel/VNPT/FPT) để kích hoạt scrubbing; lưu lượng sạch quay về qua GRE/đường riêng. Không cần thao tác thủ công lúc 2h sáng.'],
['Bảo vệ firewall & VPN gateway','Tấn công SYN/IPsec IKE flood nhắm vào VPN concentrator. Đặt Anti-DDoS trước NGFW giúp bảng phiên firewall không bị cạn, kênh quản trị từ xa vẫn hoạt động.'],
['Nhà mạng/ISP bảo vệ khách hàng (Clean-pipe)','ISP dùng Sightline (phát hiện bằng flow toàn mạng) + TMS (làm sạch) để bán dịch vụ chống DDoS cho doanh nghiệp/cơ quan – mô hình triển khai tại các nhà mạng lớn.'],
['Chặn kết nối outbound tới C2','Máy chủ nội bộ bị nhiễm mã độc cố kết nối ra C2 đã biết. Bộ lọc threat intelligence ở biên chặn kết nối ra và cảnh báo SOC.']],
tech:[['Flow-based detection (NetFlow/IPFIX/sFlow)','Phân tích luồng ở router biên/ISP để phát hiện volumetric quy mô lớn, chi phí thấp, không cần nằm inline.','NETSCOUT Sightline, Kentik, Radware DefenseFlow, A10 aGalaxy, Huawei ATIC'],
['Inline packet inspection stateless','Kiểm tra từng gói ở tốc độ đường truyền, áp dụng countermeasure tức thời, chặn tấn công lớp 7.','NETSCOUT AED, Radware DefensePro, A10 Thunder TPS, Fortinet FortiDDoS, Corero SmartWall, Huawei AntiDDoS'],
['Behavioral baseline / ML','Học profile lưu lượng bình thường, phát hiện bất thường không cần chữ ký; giảm false positive.','Radware (behavioral DoS), NETSCOUT AED auto-protection, Corero'],
['Scrubbing center + BGP diversion','Chuyển hướng prefix bị tấn công qua BGP, làm sạch rồi re-inject qua GRE/VRF.','NETSCOUT TMS, Akamai Prolexic, Cloudflare Magic Transit, Imperva DDoS, Radware Cloud'],
['DOTS / Cloud Signaling (RFC 8782/8783)','Chuẩn báo hiệu giữa CPE và nhà cung cấp mitigation.','NETSCOUT Cloud Signaling, Radware, A10, Huawei'],
['Threat intelligence feed','Danh sách IP/domain botnet, reflector, C2 cập nhật liên tục.','NETSCOUT ATLAS AIF, Radware ERT, Akamai'],
['TLS decryption offload','Giải mã HTTPS để phân tích flood lớp 7.','NETSCOUT AED + HSM/CAM module, Radware, F5 Silverline']],
dia:{cols:[[{t:'Internet / Botnet',s:'Attacker',k:'ext'}],[{t:'ISP / Cloud Scrubbing',s:'BGP diversion · DOTS',k:'ext'}],[{t:'Router biên',s:'NetFlow → Sightline'}],[{t:'Anti-DDoS (AED)',s:'Inline · HA · Bypass',k:'hl'}],[{t:'NGFW / IPS',s:'Cluster'}],[{t:'WAF / LB → DMZ',s:'Web · API · VNeID'}]],ctl:{t:'Quản trị tập trung · SIEM/SOC',s:'Syslog · API · Dashboard tấn công',to:[3,4]},note:'Cloud Signal: AED → ISP khi đường truyền vượt ngưỡng'},
model:`<p><b>Nguyên lý hoạt động:</b> (1) Thiết bị học baseline lưu lượng cho từng nhóm bảo vệ (Protection Group: web, DNS, VPN…). (2) Mọi gói tin đi qua được kiểm tra bởi chuỗi countermeasure: lọc IP reputation → lọc gói dị dạng → xác thực TCP/DNS/HTTP → rate-limit theo nguồn/đích → chữ ký tấn công. (3) Lưu lượng sạch được chuyển tiếp; lưu lượng xấu bị drop, nguồn vi phạm bị đưa vào danh sách chặn tạm thời. (4) Khi tổng lưu lượng vượt ngưỡng băng thông, thiết bị phát Cloud Signal để ISP làm sạch ở thượng nguồn.</p>
<p><b>Các mô hình triển khai:</b></p><ul>
<li><b>Inline tại biên (khuyến nghị cho Enterprise/Gov):</b> giữa router biên và NGFW, cặp HA active-standby hoặc active-active, có bypass phần cứng.</li>
<li><b>Out-of-path (ISP/DC lớn):</b> Sightline phát hiện qua flow, đẩy route BGP để chuyển lưu lượng bị tấn công qua TMS làm sạch rồi re-inject.</li>
<li><b>Hybrid:</b> On-prem AED + dịch vụ scrubbing của nhà mạng/Cloud (Arbor Cloud, Akamai Prolexic…), liên kết bằng Cloud Signaling.</li>
<li><b>Monitor mode:</b> giai đoạn đầu chạy SPAN/TAP để học baseline 1–2 tuần trước khi chuyển sang chặn.</li></ul>`,
lic:{gen:['Tính theo <b>năng lực xử lý sạch (mitigation capacity)</b> – Gbps và Mpps; thiết bị phần cứng có dải license nâng cấp được bằng key (pay-as-you-grow).','Thường gồm: phần cứng + license capacity + gói subscription (threat intelligence feed, TLS/HTTPS mitigation) + hỗ trợ kỹ thuật/bảo hành (1/3/5 năm).','Dịch vụ cloud scrubbing tính theo băng thông sạch (clean bandwidth), số prefix/IP bảo vệ, số lần mitigation hoặc gói "always-on/on-demand".','Bản virtual (vAED, vDefensePro) tính theo throughput + vCPU.'],
v:[['NETSCOUT AED','Appliance (AED 2600/8100, model mới) + license throughput bậc (ví dụ 1–100 Gbps tuỳ model); ATLAS Intelligence Feed (AIF) subscription; MasterCare support; Cloud Signaling miễn phí với Arbor Cloud.','NTS phân phối – ưu tiên',1],
['NETSCOUT Sightline/TMS (ISP)','Sightline tính theo số router/flow source & managed object; TMS tính theo năng lực mitigation (Gbps).','NTS phân phối',1],
['Radware DefensePro','Appliance theo dải throughput (license nâng cấp), subscription ERT Active Attackers Feed, Cloud DDoS service theo băng thông sạch.','',0],
['A10 Thunder TPS','Appliance + license throughput, aGalaxy quản trị tính riêng; subscription Threat Intel.','',0],
['Fortinet FortiDDoS','Theo model phần cứng (throughput cố định) + FortiCare; không tính theo số IP.','',0],
['Akamai Prolexic / Cloudflare','Subscription theo băng thông sạch, số /24 bảo vệ, Always-On/On-Demand; hợp đồng năm.','',0]]},
pre:[['Mạng','Sơ đồ IP/BGP biên (AS, prefix, ISP); xác định link Internet (1/10/40/100G, quang/đồng) để chọn interface & bypass; thống nhất vị trí đặt giữa router và firewall.'],
['Hạ tầng','Rack 1–2U, nguồn kép, cổng quản trị out-of-band; đặt cặp HA; NTP, DNS, syslog, SNMP.'],
['Phối hợp ISP','Hợp đồng/biểu mẫu với nhà mạng cho dịch vụ scrubbing, thoả thuận Cloud Signaling, quy trình liên lạc khẩn khi tấn công vượt đường truyền.'],
['Dữ liệu sizing','Băng thông đường truyền hiện tại & dự phòng 3–5 năm, peak pps, % HTTPS, danh sách dịch vụ cần bảo vệ (web, DNS, VPN, API).'],
['Vận hành','Chạy chế độ học/giám sát 1–2 tuần, tinh chỉnh ngưỡng; kịch bản ứng cứu DDoS (runbook), diễn tập định kỳ; đầu mối SOC 24/7.'],
['TLS','Nếu cần giải mã HTTPS: cung cấp chứng thư/khoá (hoặc tích hợp HSM).']],
mkt:{rank:`<p>Không có Gartner Magic Quadrant riêng cho DDoS. Tham chiếu: <b>Forrester Wave™ DDoS Mitigation Solutions (Q1/2021)</b> xếp Akamai, Cloudflare, Imperva ở nhóm Leaders (theo thông cáo của các hãng). Ở phân khúc <b>on-premise / nhà mạng</b>, NETSCOUT Arbor là thương hiệu dẫn đầu lâu năm (đa số ISP cấp 1 toàn cầu dùng Sightline/TMS; NETSCOUT nhận giải Frost & Sullivan Global Competitive Strategy Leadership 2025), tiếp theo là Radware, A10, Huawei, Fortinet, Corero.</p>`,
v:[['NETSCOUT (Arbor)','AED, Sightline, TMS, Arbor Cloud','Top 1 on-prem & ISP – NTS phân phối'],['Radware','DefensePro, DefenseFlow, Cloud DDoS','Top 3 on-prem, mạnh behavioral'],['Akamai','Prolexic','Leader cloud scrubbing'],['Cloudflare','Magic Transit, Spectrum','Leader cloud, mạng Anycast lớn'],['Imperva (Thales)','DDoS Protection','Leader cloud'],['A10 Networks','Thunder TPS','Hiệu năng cao, giá cạnh tranh'],['Fortinet','FortiDDoS','Phù hợp khách hàng đã dùng Fortinet'],['Huawei','AntiDDoS8000','Phổ biến ở nhà mạng châu Á']]},
cmp:{h:['Tiêu chí','NETSCOUT AED','Radware DefensePro','A10 Thunder TPS','Fortinet FortiDDoS'],r:[
['Định vị','Chuyên DDoS + threat intel biên, hệ sinh thái ISP lớn nhất','Chuyên DDoS, mạnh behavioral/ML','DDoS hiệu năng cao giá tốt','Tích hợp Security Fabric'],
['Phát hiện lớp 7','HTTP/HTTPS, DNS, SIP; TLS decrypt có module','Behavioral L7, SSL inspection','HTTP/DNS, TLS offload','HTTP/DNS, không giải mã TLS đầy đủ'],
['Threat intel','ATLAS AIF (dữ liệu từ ~500 ISP)','ERT Active Attackers Feed','Threat Intel Service','FortiGuard IP reputation'],
['Phối hợp cloud','Cloud Signaling + Arbor Cloud + ISP dùng TMS','DefenseFlow + Radware Cloud','aGalaxy + đối tác cloud','Hạn chế'],
['Chặn outbound C2','Có (dùng AIF)','Có','Có','Có (qua FortiGate)'],
['Điểm mạnh','Tương thích tự nhiên với nhà mạng VN dùng Arbor; UI đơn giản, auto-protection','Giảm false positive tốt','Tỷ lệ giá/Gbps tốt','Đơn giản, chi phí thấp'],
['Lưu ý','Giá cao hơn phân khúc thấp','Cấu hình phức tạp hơn','Hệ sinh thái nhỏ hơn','Ít tính năng nâng cao']]},
ref:[['NETSCOUT AED product page','https://www.netscout.com/product/arbor-edge-defense'],['NETSCOUT Threat Intelligence Report','https://www.netscout.com/threatreport'],['RFC 8782 – DOTS Signal Channel','https://www.rfc-editor.org/rfc/rfc8782'],['NIST SP 800-189 – Resilient Interdomain Traffic Exchange','https://csrc.nist.gov/pubs/sp/800/189/final'],['Forrester Wave DDoS Mitigation Q1 2021 (Imperva blog)','https://www.imperva.com/blog/forrester-wave-ranks-imperva-leader-dDoS-mitigation-providers/'],['NTS Hà Nội – NETSCOUT AED','https://ntshanoi.com.vn/san-pham/netscout-arbor-edge-defense-chong-tan-cong-ddos']]
});

S({
id:'ngfw',g:'hw',no:2,folder:'02. NGFW - Next Generation Firewall',abbr:'NGFW',
name:'Tường lửa thế hệ mới – Next Generation Firewall',layer:'Biên & phân vùng',csf:['PR','DE'],
nts:'Sophos Firewall (XGS), Barracuda CloudGen Firewall',
src:{f:'Kiểm soát lưu lượng vào/ra hệ thống; phân vùng mạng; kiểm soát ứng dụng, người dùng, giao thức; phát hiện và ngăn chặn truy cập trái phép',d:'Triển khai tại các vùng biên và giữa các vùng mạng quan trọng; thiết kế HA/Cluster'},
what:`<p><b>NGFW</b> là tường lửa kiểm soát trạng thái (stateful) được mở rộng thêm khả năng <b>nhận diện ứng dụng (App-ID), người dùng (User-ID), nội dung</b>, tích hợp IPS, lọc URL, chống mã độc, giải mã TLS và VPN trong cùng một nền tảng. Nếu firewall truyền thống chỉ quyết định dựa trên 5-tuple (IP nguồn/đích, cổng, giao thức), NGFW quyết định dựa trên <i>"ai, dùng ứng dụng gì, truy cập dữ liệu gì"</i>.</p>
<p>Từ 2025, Gartner gom thị trường thành <b>Hybrid Mesh Firewall (HMF)</b> – một mặt phẳng quản trị chính sách thống nhất cho firewall phần cứng, firewall ảo trên private/public cloud, firewall-as-a-service và tác tử microsegmentation.</p>`,
feat:['Stateful firewall, NAT, định tuyến (static/OSPF/BGP), SD-WAN, VLAN/VRF, zone-based policy.','Nhận diện & kiểm soát ứng dụng lớp 7 (hàng nghìn ứng dụng), kiểm soát theo người dùng/nhóm AD/LDAP/RADIUS.','IPS tích hợp, chống mã độc (AV, sandbox cloud/on-prem), lọc URL/DNS theo danh mục, chặn C2.','Giải mã kiểm tra TLS/SSL (TLS 1.3) với ngoại lệ cho dữ liệu nhạy cảm (ngân hàng, y tế).','VPN IPsec site-to-site, SSL/IPsec remote access, ZTNA agent.','Phân vùng mạng (segmentation) Internet–DMZ–App–DB–Quản trị; microsegmentation.','HA active-passive/active-active, clustering, cập nhật không gián đoạn.','Quản trị tập trung, log/báo cáo, API, tích hợp SIEM/SOAR/XDR (chia sẻ IOC, cách ly tự động).'],
pain:['Ứng dụng hiện đại chạy trên HTTPS/443 – firewall theo cổng không phân biệt được ứng dụng hợp lệ và shadow IT/tunnel.','Hơn 90% lưu lượng web đã mã hoá, mã độc ẩn trong TLS.','Mạng phẳng (flat network): một máy bị nhiễm có thể di chuyển ngang tới cơ sở dữ liệu.','Nhiều thiết bị rời rạc (FW + IPS + proxy + VPN) khó quản trị, chính sách mâu thuẫn.','Yêu cầu tuân thủ: phân vùng, kiểm soát truy cập, lưu log theo TCVN 11930 / Thông tư 12/2022.'],
risk:['Truy cập trái phép từ Internet vào vùng máy chủ, rò rỉ dữ liệu qua kênh ẩn.','Ransomware lây lan ngang toàn mạng do không phân vùng.','Không có log truy vết khi xảy ra sự cố, không đáp ứng kiểm tra đánh giá ATTT.'],
uc:[['Phân vùng hệ thống định danh quốc gia','Tách Internet-DMZ / App / DB / Quản trị / Kết nối bộ ngành; chỉ mở đúng luồng App→DB cổng cần thiết; quản trị chỉ từ vùng PAM/Jump host.'],

S({
id:'ips',g:'hw',no:3,folder:'03. IPS-IDS',abbr:'IPS/IDS',
name:'Thiết bị phòng chống xâm nhập IPS/IDS',layer:'Biên & nội bộ',csf:['DE','PR'],
nts:'Sophos (IPS tích hợp XGS), Barracuda, Stellar Cyber Sensor (IDS), NETSCOUT Omnis IDS, Wedge Networks',
src:{f:'Phát hiện và ngăn chặn các hành vi khai thác lỗ hổng, dò quét, tấn công mạng và các mẫu lưu lượng bất thường',d:'Có thể triển khai độc lập hoặc tích hợp trong NGFW tùy kiến trúc; các vùng quan trọng cần bảo đảm năng lực IPS phù hợp lưu lượng thực tế'},
what:`<p><b>IDS (Intrusion Detection System)</b> giám sát lưu lượng (thụ động, qua SPAN/TAP) và cảnh báo khi phát hiện dấu hiệu tấn công. <b>IPS (Intrusion Prevention System)</b> đặt <b>inline</b>, có khả năng chặn gói/phiên độc hại theo thời gian thực. Công nghệ cốt lõi là phân tích sâu gói tin (DPI) với bộ <b>chữ ký</b> (signature) cho lỗ hổng/khai thác đã biết, kết hợp phân tích giao thức và bất thường.</p>
<p>Hiện nay IPS phần lớn được <b>tích hợp trong NGFW</b>; IPS độc lập vẫn được dùng ở vùng có lưu lượng rất lớn (core DC, trước cụm máy chủ quan trọng) hoặc khi yêu cầu tách biệt thiết bị/hãng theo kiến trúc defense-in-depth.</p>`,
feat:['Bộ chữ ký hàng chục nghìn rule (CVE, exploit kit, worm, C2, scan), cập nhật hằng ngày; hỗ trợ rule tuỳ biến (Snort/Suricata syntax).','Virtual patching: chặn khai thác lỗ hổng trên máy chủ chưa kịp vá.','Phát hiện dò quét (port scan, sweep), brute-force, tấn công giao thức (SMB, RDP, DNS, HTTP, SCADA/OT như Modbus, DNP3).','Phân tích bất thường giao thức (protocol anomaly), giải phân mảnh/chuẩn hoá luồng chống né tránh (evasion).','Hành động: alert, drop, reset, quarantine IP, rate-limit; chính sách theo vùng/máy chủ.','Fail-open (bypass) phần cứng, độ trễ thấp (micro giây).','Lưu PCAP bằng chứng, xuất log CEF/syslog sang SIEM; tích hợp threat intel.'],
pain:['Hệ thống có nhiều máy chủ/ứng dụng chưa thể vá ngay (ứng dụng cũ, yêu cầu ổn định), cửa sổ khai thác zero-day/n-day ngắn.','Tấn công khai thác lỗ hổng biết trước (Log4Shell, ProxyShell, lỗ hổng VPN) diễn ra tự động hàng loạt.','Không có cơ chế phát hiện dò quét nội bộ, di chuyển ngang.','Khi bật IPS trên NGFW, hiệu năng giảm mạnh, không đáp ứng lưu lượng core.'],
risk:['Bị khai thác lỗ hổng từ xa (RCE) → chiếm quyền máy chủ.','Lây lan worm/ransomware qua SMB/RDP.','Không có cảnh báo sớm cho SOC, phát hiện muộn hàng tháng.'],
uc:[['Virtual patching khi có lỗ hổng nghiêm trọng','Hãng công bố CVE nghiêm trọng trên ứng dụng web nội bộ; trong lúc chờ vá, IPS áp rule chặn khai thác cho cụm máy chủ đó.'],
['IPS chuyên dụng trước cụm DB/App','Lưu lượng east-west 40–100 Gbps giữa App và DB; IPS độc lập inline đáp ứng hiệu năng mà NGFW nội bộ không gánh nổi khi bật đầy đủ profile.'],
['IDS giám sát qua Packet Broker','Sensor IDS (Suricata/Stellar sensor/Omnis IDS) nhận lưu lượng từ NPB, gửi cảnh báo về SIEM để tương quan với log endpoint.'],
['Bảo vệ hệ thống OT/SCADA','Rule chuyên biệt cho Modbus/IEC-104 phát hiện lệnh ghi bất thường tới PLC.']],
tech:[['Signature-based (Snort/Suricata)','So khớp mẫu gói tin, chuẩn rule mở được dùng rộng rãi.','Cisco (Snort 3), Suricata (OISF), Stellar Cyber, NETSCOUT Omnis IDS, Trend TippingPoint'],
['Protocol decoding & normalization','Giải mã ứng dụng, chống né tránh (fragmentation, encoding).','Tất cả IPS thương mại'],
['Vulnerability-based filters','Rule viết theo bản chất lỗ hổng (không phải từng exploit) → giảm bỏ sót.','Trend Micro TippingPoint (ZDI), Palo Alto, Fortinet'],
['ML/Anomaly','Phát hiện C2, DNS tunneling, beacon.','Palo Alto ATP, Check Point, Vectra (NDR)'],
['Phần cứng tăng tốc','FPGA/ASIC/NPU đạt 40–100 Gbps inline.','TippingPoint TX, Fortinet NP7, Cisco Firepower']],
dia:{cols:[[{t:'Internet / vùng khác',s:'',k:'ext'}],[{t:'NGFW',s:'IPS tích hợp'}],[{t:'IPS inline (HA/bypass)',s:'Trước vùng quan trọng',k:'hl'}],[{t:'Vùng App / DB',s:'Máy chủ cần bảo vệ'}]],ctl:{t:'IDS sensor ← TAP/NPB · SIEM',s:'Giám sát thụ động, cảnh báo',to:[2,3]}},
model:`<p><b>Nguyên lý:</b> Gói tin được ráp luồng (stream reassembly), giải mã giao thức, chuẩn hoá rồi so khớp với bộ rule (pattern + điều kiện ngữ cảnh). Nếu khớp rule có hành động "block", IPS drop gói và có thể reset phiên/chặn IP nguồn trong thời gian cấu hình. IDS chỉ sinh cảnh báo.</p>
<ul><li><b>Inline IPS:</b> bump-in-the-wire giữa 2 thiết bị mạng, có bypass phần cứng; đặt sau NGFW biên hoặc trước vùng máy chủ quan trọng.</li>
<li><b>IDS thụ động:</b> nhận bản sao lưu lượng từ SPAN/TAP/NPB; không ảnh hưởng dịch vụ.</li>
<li><b>Tích hợp NGFW:</b> bật IPS profile trên rule firewall; cần sizing "Threat Protection throughput".</li>
<li><b>Lộ trình chuẩn:</b> chạy IDS/monitor 2–4 tuần → tinh chỉnh false positive → bật chặn các nhóm rule mức Critical/High → mở rộng dần.</li></ul>`,
lic:{gen:['Thiết bị độc lập: phần cứng theo throughput (2/10/40/100 Gbps) + subscription chữ ký (Digital Vaccine/IPS signature) theo năm + support.','IPS tích hợp NGFW: nằm trong bundle subscription của firewall (Threat Prevention).','IDS phần mềm/sensor: tính theo số sensor, băng thông giám sát hoặc theo nền tảng SIEM/XDR (Stellar Cyber tính theo dung lượng dữ liệu/asset).'],
v:[['Sophos XGS','IPS nằm trong Xstream/Standard Protection bundle của firewall.','NTS phân phối',1],
['Stellar Cyber Sensor','Sensor IDS/NDR đi kèm license nền tảng Open XDR (tính theo GB/ngày hoặc asset).','NTS phân phối',1],
['NETSCOUT Omnis IDS','Thành phần của Omnis Cyber Intelligence, tính theo sensor/băng thông.','NTS phân phối',1],
['Trend Micro TippingPoint','Appliance TX/TPS theo throughput license + Digital Vaccine subscription.','',0],
['Cisco Secure IPS','Firepower appliance + Threat license (Smart Licensing).','',0]]},
pre:[['Mạng','Xác định điểm đặt inline, tốc độ link, loại cổng; nếu IDS thì cần TAP/NPB hoặc SPAN.'],['Sizing','Lưu lượng peak cần kiểm tra (Gbps), số phiên, % lưu lượng mã hoá (IPS không thấy nội dung TLS nếu không giải mã).'],['Danh mục tài sản','Danh sách OS/ứng dụng máy chủ để chọn profile rule phù hợp, giảm false positive.'],['Vận hành','Quy trình tinh chỉnh rule, SOC theo dõi cảnh báo; tích hợp SIEM.']],
mkt:{rank:`<p>Gartner đã ngừng MQ riêng cho IDPS từ 2018 vì IPS hội tụ vào NGFW. Thị trường IPS độc lập còn các hãng: Trend Micro TippingPoint, Cisco Secure IPS, Trellix (McAfee) Intrusion Prevention, Hillstone, NSFOCUS; IPS tích hợp trong NGFW: Palo Alto, Fortinet, Check Point (Leaders HMF 2025). IDS mã nguồn mở Suricata/Snort/Zeek là nền tảng của nhiều giải pháp NDR/XDR.</p>`,

S({
id:'waf',g:'hw',no:4,folder:'04. WAF - Web Application Firewall',abbr:'WAF',
name:'Thiết bị Web Application Firewall – WAF',layer:'Ứng dụng (DMZ)',csf:['PR','DE'],
nts:'Penta Security WAPPLES, Barracuda WAF, Progress Kemp LoadMaster (WAF)',
src:{f:'Bảo vệ các ứng dụng web khỏi các hình thức tấn công vào lớp ứng dụng; kiểm soát truy cập, phiên làm việc và các yêu cầu bất thường',d:'Bố trí trước các cụm ứng dụng/web cung cấp dịch vụ ra bên ngoài; triển khai HA'},
what:`<p><b>WAF</b> là reverse-proxy chuyên phân tích giao dịch HTTP/HTTPS giữa người dùng và ứng dụng web/API để chặn các tấn công lớp 7 như <b>OWASP Top 10</b> (SQL Injection, XSS, path traversal, SSRF, RCE, lỗi xác thực/phiên…), bot xấu và lạm dụng nghiệp vụ. WAF hiểu cấu trúc request (URL, header, cookie, tham số, JSON/XML body) chứ không chỉ gói tin như IPS.</p>
<p>Xu hướng hiện nay là <b>WAAP (Web Application & API Protection)</b>: WAF + bảo vệ API + quản lý bot + chống DDoS L7, triển khai dạng appliance, ảo, container (ingress) hoặc dịch vụ cloud.</p>`,
feat:['Chặn OWASP Top 10, CVE ứng dụng phổ biến (CMS, framework), web shell upload.','Mô hình bảo mật âm (signature/rule) + dương (positive security: học cấu trúc URL/tham số hợp lệ); WAPPLES dùng engine logic (COCEP) giảm phụ thuộc chữ ký.','Bảo vệ phiên: cookie signing/encryption, chống CSRF, session hijacking, chống brute-force/credential stuffing.','Bảo vệ API: kiểm tra schema OpenAPI/JSON/XML, rate-limit, xác thực token.','Bot management: phân biệt bot tốt/xấu, CAPTCHA/JS challenge, fingerprint thiết bị.','Chống DDoS lớp 7, giới hạn tốc độ theo URL/IP/phiên.','Chống rò rỉ dữ liệu trong response (số thẻ, CCCD, stack trace), che giấu thông tin máy chủ.','SSL/TLS offload, cân bằng tải, HA; virtual patching; log chi tiết, tích hợp SIEM; quản trị tập trung nhiều node.'],
pain:['Ứng dụng web/cổng dịch vụ công phát triển nhanh, nhiều lỗ hổng logic & lỗi lập trình; không thể sửa code ngay khi phát hiện lỗ hổng.','Firewall/IPS không hiểu ngữ cảnh ứng dụng, bỏ sót SQLi/XSS được mã hoá/làm rối.','Tấn công credential stuffing, bot cào dữ liệu, spam đăng ký tài khoản.','Yêu cầu tuân thủ: PCI DSS 6.4, TCVN 11930 (cấp độ ≥3 yêu cầu bảo vệ ứng dụng web), kiểm tra ATTT định kỳ.'],
risk:['Lộ lọt cơ sở dữ liệu công dân/khách hàng qua SQL Injection – rủi ro pháp lý theo Luật Bảo vệ dữ liệu cá nhân 2025.','Thay đổi giao diện (deface) cổng thông tin cơ quan nhà nước – ảnh hưởng uy tín.','Cài web shell, chiếm quyền máy chủ làm bàn đạp vào mạng nội bộ.'],
uc:[['Bảo vệ cổng dịch vụ công & VNeID web portal','WAF HA trước cụm web; chính sách chặn OWASP Top 10, bot challenge cho trang đăng nhập/OTP, rate-limit API tra cứu.'],
['Virtual patching lỗ hổng CMS','Cổng thông tin chạy CMS cũ có lỗ hổng RCE; WAF áp rule chặn trong lúc chờ nâng cấp.'],
['Chống credential stuffing','Phát hiện hàng nghìn lần đăng nhập thất bại từ IP xoay vòng; WAF áp challenge + khoá theo fingerprint.'],
['Ẩn thông tin và chống rò rỉ','Che số CCCD/số thẻ trong response lỗi, xoá header phiên bản máy chủ.'],
['Đảm bảo kết quả pentest/đánh giá ATTT','Đơn vị đánh giá chỉ ra lỗi XSS; WAF chặn tạm thời, đội dev sửa code sau.']],
tech:[['Reverse proxy + TLS termination','WAF đứng giữa, giải mã TLS, kiểm tra rồi chuyển tiếp.','F5 BIG-IP AWAF, Imperva, FortiWeb, Barracuda, WAPPLES, Kemp'],
['Negative model (rule/signature)','OWASP CRS, chữ ký hãng.','ModSecurity/Coraza + OWASP CRS, tất cả hãng'],
['Positive model / auto-learning','Học hành vi hợp lệ của ứng dụng.','F5, Imperva, Barracuda, FortiWeb (ML)'],
['Logic-based detection','Phân tích ngữ nghĩa tấn công thay vì chữ ký.','Penta WAPPLES (COCEP engine)'],
['Bot management','Fingerprint, behavioral, CAPTCHA.','Akamai Bot Manager, Cloudflare, Imperva ABP, F5 Distributed Cloud Bot Defense'],
['API discovery/schema validation','Học & enforce OpenAPI.','Cloudflare API Shield, Imperva API Security, F5'],
['WAF-as-a-service / Edge','WAF trên mạng CDN toàn cầu.','Cloudflare, Akamai App & API Protector, AWS WAF, Azure Front Door']],
dia:{cols:[[{t:'Người dùng / Bot',s:'Internet',k:'ext'}],[{t:'Anti-DDoS · NGFW',s:'L3/L4'}],[{t:'WAF (HA)',s:'Reverse proxy · TLS',k:'hl'}],[{t:'Load Balancer / ADC',s:''}],[{t:'Web / App servers',s:'Portal · API'}]],ctl:{t:'WAF Manager · SIEM',s:'Log tấn công · báo cáo',to:[2]}},
model:`<p><b>Nguyên lý:</b> WAF nhận request của client (đóng vai trò máy chủ với client), giải mã TLS, chuẩn hoá (decode URL/Unicode/Base64), phân tích từng thành phần theo chính sách; request hợp lệ được chuyển tới backend, request vi phạm bị chặn/ghi log/trả trang lỗi; response từ backend cũng được kiểm tra trước khi trả về.</p>
<ul><li><b>Reverse proxy (phổ biến nhất):</b> DNS trỏ về VIP của WAF; hỗ trợ đầy đủ tính năng.</li>
<li><b>Transparent bridge / inline:</b> không đổi IP, dễ triển khai nhưng hạn chế tính năng phiên.</li>
<li><b>Out-of-band (monitor):</b> nhận bản sao lưu lượng (cần khoá TLS) – chỉ cảnh báo.</li>
<li><b>Cloud WAF:</b> trỏ DNS qua nhà cung cấp; kết hợp chống DDoS & CDN.</li>
<li><b>Tích hợp ADC:</b> WAF module trên load balancer (F5, Kemp, Citrix).</li></ul>`,
lic:{gen:['Appliance theo throughput HTTP(S) hoặc số request/giây; một số hãng tính theo <b>số ứng dụng/website (FQDN)</b> được bảo vệ.','Bản ảo theo vCPU/throughput; cloud WAF theo số domain + lượng request/băng thông.','Subscription: cập nhật chữ ký, IP reputation, bot, API protection; support theo năm.'],
v:[['Penta Security WAPPLES','Appliance/WAPPLES SA (ảo) theo throughput model; không giới hạn số website trên 1 thiết bị; maintenance theo năm. Cloud: Cloudbric.','NTS phân phối',1],

pre:[['Ứng dụng','Danh mục website/API cần bảo vệ (FQDN, cổng, công nghệ, lượng truy cập), chứng thư số + khoá riêng để giải mã TLS.'],['Mạng','Quy hoạch VIP, DNS, vị trí WAF giữa NGFW và LB; HA và đồng bộ cấu hình.'],['Phối hợp dev','Môi trường staging để chạy learning mode, danh sách URL/tham số đặc biệt (upload file lớn, rich text) để tạo ngoại lệ.'],['Vận hành','Chạy detection mode 2–4 tuần, tinh chỉnh false positive rồi chuyển blocking; quy trình xử lý khi người dùng bị chặn nhầm.']],

S({
id:'apigw',g:'hw',no:5,folder:'05. API Security Gateway',abbr:'API Gateway',
name:'Thiết bị/giải pháp bảo vệ API – API Security Gateway',layer:'Lớp cung cấp API',csf:['PR','DE'],
nts:'Barracuda WAF/WaaS (API protection), Penta WAPPLES, Progress Kemp LoadMaster',
src:{f:'Kiểm soát, xác thực, giới hạn tần suất, phát hiện bất thường và bảo vệ các API kết nối giữa VNeID với các hệ thống bên ngoài',d:'Bố trí tại lớp cung cấp API; tích hợp với hệ thống quản lý định danh, giám sát và WAF'},
what:`<p><b>API Security Gateway</b> là điểm vào duy nhất (single entry point) cho mọi lời gọi API từ đối tác/bộ ngành/ứng dụng di động tới hệ thống lõi. Gateway thực thi <b>chính sách ở runtime</b>: xác thực (mTLS, OAuth 2.0/OIDC, JWT, API key), uỷ quyền theo scope, <b>giới hạn tần suất/hạn ngạch (rate-limit/quota)</b>, kiểm tra schema, chuyển đổi giao thức (REST/SOAP/gRPC), định tuyến và ghi log từng giao dịch.</p>
<p>Khác với nhóm "API Security" (mục phần mềm số 16 – tập trung khám phá API, đánh giá rủi ro, phát hiện lạm dụng bằng phân tích hành vi), API Gateway là <b>lớp thực thi (enforcement)</b>; trong kiến trúc chuẩn hai lớp này phối hợp với WAF và IAM. Tham chiếu: NIST SP 800-228 (2025) – Guidelines for API Protection for Cloud-Native Systems.</p>`,
feat:['Xác thực đa cơ chế: mTLS (chứng thư số đối tác), OAuth 2.0 client credentials, OIDC, JWT validation (chữ ký, hạn, audience), API key, HMAC request signing.','Uỷ quyền chi tiết theo đối tác/ứng dụng/scope/endpoint; tích hợp IAM/IdP (Keycloak, OpenText NetIQ, Okta…).','Rate limiting, throttling, quota theo ngày/tháng, spike arrest; chống lạm dụng tra cứu hàng loạt.','Kiểm tra request/response theo OpenAPI/JSON Schema/XSD, chặn mass assignment, trường thừa, kích thước bất thường.','Che/mặt nạ dữ liệu nhạy cảm trong response (CCCD, SĐT) theo đối tác; mã hoá trường.','Định tuyến, cân bằng tải, circuit-breaker, caching, chuyển đổi SOAP↔REST.','Quản lý vòng đời API & cổng nhà phát triển (developer portal), versioning.','Log đầy đủ từng lời gọi (ai, gọi gì, khi nào, kết quả) phục vụ truy vết & đối soát; đẩy về SIEM.'],
pain:['Hệ thống định danh phải kết nối với hàng trăm hệ thống bộ ngành, ngân hàng, viễn thông qua API – mỗi bên một cách xác thực, khó kiểm soát.','API trả dữ liệu công dân là "cửa sau" nếu bị lạm dụng: tra cứu hàng loạt, dò ID tuần tự (BOLA).','Không có số liệu thống kê ai gọi API nào, tần suất bao nhiêu → không đối soát, không phát hiện bất thường.','API cũ (zombie/shadow API) vẫn mở sau khi nâng cấp phiên bản.'],
risk:['Rò rỉ dữ liệu cá nhân quy mô lớn qua API – vi phạm Luật BVDLCN 2025, Nghị định 13/2023.','Đối tác bị lộ API key → kẻ tấn công giả mạo đối tác.','Quá tải hệ thống lõi do đối tác gọi sai/vòng lặp.'],
uc:[['Kết nối VNeID với ngân hàng xác thực eKYC','Ngân hàng gọi API xác thực thông tin công dân qua mTLS + OAuth client credentials; gateway giới hạn 50 req/s/ngân hàng, chỉ trả trường được phép, log để đối soát phí.'],
['Chặn tra cứu hàng loạt','Một đối tác bất thường gọi 100.000 lượt tra cứu/giờ ngoài khung giờ; quota chặn + cảnh báo SOC.'],
['Hợp nhất API nội bộ – bên ngoài','Ẩn kiến trúc microservices, chỉ công bố API đã phê duyệt qua gateway; tách gateway nội bộ và gateway đối tác.'],
['Thu hồi truy cập tức thời','Khi đối tác vi phạm, thu hồi chứng thư/clients trên IdP, gateway từ chối ngay lập tức.']],
tech:[['API Gateway / API Management','Thực thi chính sách, vòng đời API, developer portal.','Google Apigee, Kong, MuleSoft, Azure APIM, IBM API Connect, Axway, WSO2, Tyk, Red Hat 3scale'],
['mTLS & PKI','Xác thực hai chiều bằng chứng thư số.','Tất cả gateway; tích hợp PKI/HSM'],
['OAuth 2.0 / OIDC / FAPI','Chuẩn uỷ quyền, FAPI cho tài chính.','Keycloak, Ping, Okta, ForgeRock, NetIQ'],
['WAAP (WAF + API)','Bảo vệ tấn công lớp 7 cho API.','Barracuda, F5, Imperva, Akamai, Cloudflare, WAPPLES'],
['Service mesh (east-west)','mTLS & policy giữa microservices.','Istio, Linkerd, Consul (NIST SP 800-204A)']],
dia:{cols:[[{t:'Đối tác / Bộ ngành',s:'Bank · Telco · App',k:'ext'}],[{t:'NGFW · WAF',s:'L3-L7'}],[{t:'API Security Gateway',s:'mTLS · OAuth · Quota',k:'hl'}],[{t:'Microservices VNeID',s:'Định danh · Xác thực'}],[{t:'CSDL lõi',s:''}]],ctl:{t:'IdP/IAM · PKI/HSM · SIEM · API Security',s:'Token, chứng thư, log, phân tích hành vi',to:[2]}},
model:`<p><b>Luồng xử lý một lời gọi:</b> TLS handshake (mTLS kiểm tra chứng thư đối tác) → xác thực token (JWT verify bằng public key IdP/JWKS) → uỷ quyền theo scope/endpoint → kiểm tra quota/rate-limit → validate schema → định tuyến tới backend → kiểm tra/mặt nạ response → ghi log/metrics.</p>
<ul><li><b>Hai tầng gateway:</b> External gateway (DMZ, cho đối tác) và Internal gateway (giữa các phân hệ).</li><li><b>Triển khai:</b> appliance/VM cụm HA active-active sau load balancer; hoặc container trên Kubernetes (ingress gateway).</li><li><b>Tích hợp:</b> IdP cấp token, HSM giữ khoá ký, SIEM nhận log, API Security (Salt/Traceable…) nhận bản sao lưu lượng để phân tích hành vi.</li></ul>`,
lic:{gen:['Theo <b>số lời gọi API (API calls/tháng)</b>, số gateway/core/instance, hoặc throughput.','On-prem thường theo số core CPU hoặc số node gateway + gói enterprise (portal, analytics).','Cloud API management theo tier & số request.','Mã nguồn mở (Kong OSS, WSO2, Tyk OSS) miễn phí bản cộng đồng; bản Enterprise theo node/service.'],

S({
id:'ndr',g:'hw',no:6,folder:'06. NDR-NTA',abbr:'NDR/NTA',
name:'Thiết bị phát hiện và phân tích lưu lượng mạng NDR/NTA',layer:'Mạng nội bộ (visibility)',csf:['DE','RS'],
nts:'NETSCOUT Omnis Cyber Intelligence (OCI), Progress Flowmon NDR, Stellar Cyber NDR',
src:{f:'Phân tích hành vi và lưu lượng mạng, phát hiện dấu hiệu xâm nhập, di chuyển ngang, kết nối bất thường và các cuộc tấn công chưa có mẫu nhận diện',d:'Bố trí cảm biến tại các vùng mạng quan trọng; dữ liệu cảnh báo được chuyển về hệ thống giám sát tập trung'},
what:`<p><b>NDR (Network Detection & Response)</b> – trước đây gọi là NTA – thu thập lưu lượng mạng (gói tin qua TAP/NPB, hoặc flow NetFlow/IPFIX), trích xuất metadata giao thức (DNS, HTTP, TLS/JA3, SMB, Kerberos, LDAP…), sau đó dùng <b>phân tích hành vi, học máy, threat intelligence và chữ ký</b> để phát hiện tấn công đã lọt qua lớp biên: di chuyển ngang (lateral movement), C2 beacon, đánh cắp dữ liệu, lạm dụng thông tin đăng nhập.</p>
<p>Điểm mạnh của NDR là <b>"mạng không nói dối"</b>: kẻ tấn công có thể xoá log, tắt EDR, nhưng không thể giao tiếp mà không tạo lưu lượng. NDR cùng EDR và SIEM tạo thành "SOC Visibility Triad" (Gartner). Nhiều NDR còn lưu <b>PCAP/metadata nhiều tuần</b> phục vụ điều tra hồi cứu (retrospective).</p>`,
feat:['Thu thập gói tin tốc độ cao (1–100 Gbps) qua TAP/NPB; hoặc flow-based (NetFlow/IPFIX/sFlow) cho mạng phân tán.','Phân tích sâu > 1.000 giao thức, trích xuất metadata, fingerprint TLS (JA3/JA4), phát hiện trong lưu lượng mã hoá không cần giải mã.','Phát hiện hành vi: scan nội bộ, brute-force, Kerberoasting, Pass-the-Hash, DNS tunneling, beacon C2, exfiltration, kết nối tới domain mới/DGA.','Threat intelligence & chữ ký (Suricata/Snort) kết hợp ML/anomaly; chấm điểm rủi ro theo thực thể (host/user).','Lưu trữ metadata/PCAP để điều tra hồi cứu khi có IOC mới ("time-travel").','Phản ứng: tích hợp NGFW/NAC/EDR/SOAR để chặn IP, cách ly máy; ánh xạ MITRE ATT&CK.','Khám phá tài sản thụ động (asset discovery), phát hiện thiết bị lạ/IoT/OT.','Bảng điều khiển điều tra, timeline sự cố, xuất cảnh báo về SIEM.'],
pain:['Biên mạng đã có NGFW/IPS nhưng không có khả năng nhìn thấy lưu lượng east-west trong DC.','Tấn công APT sử dụng công cụ hợp lệ (living-off-the-land), không có chữ ký.','Thiết bị không cài được EDR (IoT, OT, thiết bị mạng, appliance) là điểm mù.','Khi có IOC mới, không có dữ liệu lịch sử để biết đã bị xâm nhập từ khi nào.'],
risk:['Kẻ tấn công ẩn náu trung bình hàng tuần–tháng trước khi bị phát hiện (dwell time).','Rò rỉ dữ liệu qua kênh mã hoá/DNS không ai phát hiện.','Không đủ bằng chứng điều tra, báo cáo sự cố cho cơ quan quản lý.'],
uc:[['Phát hiện di chuyển ngang tới máy chủ CSDL','Một máy trạm vận hành bỗng quét SMB tới 200 máy chủ và dùng tài khoản dịch vụ đăng nhập DB – NDR cảnh báo "lateral movement" và SOAR cách ly máy.'],
['Phát hiện C2 trong TLS','Phân tích JA3 + chu kỳ kết nối đều đặn 60s tới domain mới đăng ký → beacon Cobalt Strike.'],
['Điều tra hồi cứu khi có IOC','Cơ quan chuyên trách gửi IOC chiến dịch APT; tìm trong 30 ngày metadata xem có máy nào từng kết nối.'],
['Giám sát hiệu năng + an ninh (NETSCOUT)','Cùng dữ liệu gói tin phục vụ cả NOC (độ trễ ứng dụng) và SOC (phát hiện tấn công).']],
tech:[['Deep Packet Inspection & metadata','Trích xuất "smart data" từ gói tin.','NETSCOUT (ASI/Smart Data), Corelight (Zeek), ExtraHop, Gigamon AMI'],
['Flow analytics','NetFlow/IPFIX analytics, nhẹ, phù hợp mạng lớn.','Progress Flowmon, Cisco Secure Network Analytics, Plixer'],
['AI/ML behavioral','Mô hình hoá hành vi bình thường.','Darktrace, Vectra AI, ExtraHop, Stellar Cyber'],
['Encrypted traffic analysis','JA3/JA4, phân tích chuỗi gói không giải mã.','Cisco ETA, Vectra, Corelight, Flowmon'],
['Packet capture & retrospective','Lưu PCAP/metadata nhiều tuần.','NETSCOUT Omnis Cyber Investigator, Arista NDR, Corelight'],
['Open-source','Zeek, Suricata, Arkime.','Corelight (Zeek), Stellar Cyber sensors']],
dia:{cols:[[{t:'Core / Biên / DC',s:'Switch · Router',k:'ext'}],[{t:'TAP / Packet Broker',s:'Sao chép lưu lượng'}],[{t:'NDR Sensor',s:'DPI · metadata · PCAP',k:'hl'}],[{t:'NDR Analytics',s:'ML · TI · MITRE',k:'hl'}],[{t:'SIEM / SOAR',s:'Tương quan · phản ứng'}]],ctl:{t:'Phản ứng: NGFW / NAC / EDR',s:'Chặn IP, cách ly',to:[3,4]}},
model:`<p><b>Nguyên lý:</b> Sensor nhận bản sao lưu lượng (thụ động, không ảnh hưởng dịch vụ) → giải mã giao thức, tạo bản ghi metadata theo phiên → gửi về bộ phân tích trung tâm → áp dụng detector (chữ ký, TI, mô hình hành vi) → sinh cảnh báo kèm ngữ cảnh (host, user, timeline) → chuyển SIEM/SOAR hoặc gọi API chặn.</p>
<ul><li><b>Vị trí sensor:</b> biên Internet (sau firewall), core DC (east-west), vùng máy chủ quan trọng, vùng người dùng, kết nối bộ ngành.</li><li><b>Nguồn dữ liệu:</b> TAP quang + NPB (khuyến nghị), SPAN (dễ mất gói), virtual tap trong cloud/VMware.</li><li><b>Kiến trúc phân tán:</b> sensor tại từng site, analytics tập trung hoặc SaaS (một số hãng).</li></ul>`,
lic:{gen:['Theo <b>băng thông giám sát</b> (Gbps) mỗi sensor, hoặc theo <b>số IP/thiết bị/asset</b> được giám sát, hoặc theo flow/giây (FPS) với NDR flow-based.','Phần cứng sensor/lưu trữ tính riêng; dung lượng lưu PCAP quyết định giá.','Subscription năm (ML model, TI feed) + support; một số tính theo user (Vectra).'],
v:[['NETSCOUT Omnis Cyber Intelligence','Theo sensor InfiniStreamNG/vSTREAM (băng thông, dung lượng lưu) + license OCI; ATLAS feed.','NTS phân phối – ưu tiên',1],
['Progress Flowmon','Flowmon Collector (theo flows/s) + module ADS (Anomaly Detection) + probe theo số cổng/tốc độ.','NTS phân phối',1],
['Stellar Cyber NDR','Sensor đi kèm license Open XDR (theo GB/ngày hoặc asset).','NTS phân phối',1],
['Darktrace','Subscription theo số thiết bị/IP & băng thông, appliance kèm theo.','',0],
['Vectra AI','Theo số IP/host (và user cho identity).','',0],
['ExtraHop RevealX','Theo băng thông (Gbps) sensor, SaaS hoặc on-prem.','',0]]},
pre:[['Hạ tầng thu thập','TAP/NPB tại các điểm cần giám sát; nếu thiếu cần đầu tư NPB (xem mục 12).'],['Sizing','Lưu lượng peak từng điểm, thời gian lưu metadata/PCAP (7/30/90 ngày) → dung lượng lưu trữ.'],['Tích hợp','AD/DHCP/DNS log để gắn IP↔user; SIEM/SOAR; API NGFW/NAC để phản ứng.'],['Vận hành','Thời gian học baseline 2–4 tuần; đội SOC biết điều tra (threat hunting).']],
mkt:{rank:`<p><b>Gartner Magic Quadrant for Network Detection and Response 2025</b> (lần đầu công bố, 05–06/2025): nhóm <b>Leaders gồm Corelight, Darktrace, ExtraHop, Vectra AI</b>. Các hãng khác trên thị trường: NETSCOUT, Cisco, Trend Micro, Fortinet, Arista, Progress Flowmon, Stellar Cyber, Gatewatcher, Lumu…</p>`,
v:[['Vectra AI','Vectra AI Platform','Leader NDR 2025'],['Darktrace','ActiveAI Security Platform','Leader NDR 2025'],['ExtraHop','RevealX','Leader NDR 2025'],['Corelight','Open NDR (Zeek)','Leader NDR 2025'],['NETSCOUT','Omnis Cyber Intelligence','Mạnh DPI & PCAP, NTS phân phối'],['Progress','Flowmon NDR','Flow-based, NTS phân phối'],['Stellar Cyber','NDR trong Open XDR','NTS phân phối'],['Cisco','Secure Network Analytics','Flow-based']]},

S({
id:'sandbox',g:'hw',no:7,folder:'07. Sandbox - Phan tich ma doc',abbr:'Sandbox',
name:'Thiết bị phân tích mã độc/Sandbox',layer:'Biên / Email / Web',csf:['DE','PR'],
nts:'OPSWAT MetaDefender Sandbox (+ MetaDefender Core), Kaspersky Sandbox/KATA, Proofpoint TAP (email)',
src:{f:'Phân tích tập tin, URL, mã thực thi và các đối tượng nghi ngờ trong môi trường cách ly để phát hiện mã độc nâng cao, mã độc chưa có chữ ký nhận diện',d:'Tích hợp với NGFW, WAF, hệ thống giám sát và các nguồn thu thập tập tin nghi vấn'},
what:`<p><b>Sandbox</b> là môi trường thực thi cách ly (máy ảo, giả lập CPU/OS) để <b>"kích nổ"</b> file/URL nghi ngờ và quan sát hành vi thực tế: tạo tiến trình, sửa registry, mã hoá file, kết nối mạng, chèn mã… Từ hành vi đó, sandbox kết luận độc hại hay không và sinh <b>IOC</b> (hash, domain, IP, mutex) chia sẻ cho các lớp bảo vệ khác. Sandbox bổ sung cho antivirus chữ ký vốn bất lực trước mã độc mới (zero-day, đa hình).</p>
<p>Thế hệ mới dùng <b>emulation/adaptive sandbox</b> (ví dụ OPSWAT MetaDefender Sandbox) – phân tích nhanh vài giây, khó bị mã độc phát hiện là đang trong sandbox – kết hợp phân tích tĩnh, ML và threat intel. Thường đi kèm <b>đa engine AV (multiscanning)</b> và <b>CDR (Content Disarm & Reconstruction)</b> để làm sạch file.</p>`,
feat:['Phân tích động: thực thi trên nhiều OS (Windows/Linux/Android/macOS), mô phỏng tương tác người dùng, vượt anti-VM/anti-debug.','Phân tích tĩnh: PE header, macro VBA, PDF JavaScript, script obfuscation, YARA rules.','Phân tích URL: theo dõi chuỗi redirect, phát hiện trang phishing, drive-by download.','Hỗ trợ file nén nhiều lớp, có mật khẩu, tài liệu Office/PDF/HTML/ISO/LNK/OneNote.','Sinh báo cáo hành vi, ánh xạ MITRE ATT&CK, trích IOC, STIX/TAXII.','Tích hợp nguồn file: NGFW, email gateway (MTA/ICAP), web proxy (ICAP), WAF, file share, API, kiosk quét USB.','Chế độ chặn (hold file đến khi có kết quả) hoặc giám sát; chia sẻ IOC tự động cho FW/EDR/SIEM.','On-premise/air-gapped (không gửi file ra cloud) – yêu cầu quan trọng với khối Chính phủ.'],
pain:['Mã độc mới và biến thể xuất hiện hàng trăm nghìn mẫu/ngày, chữ ký AV luôn đi sau.','Email lừa đảo đính kèm tài liệu chứa macro/link độc vẫn là vector xâm nhập số 1.','File do công dân/đối tác tải lên cổng dịch vụ (hồ sơ, ảnh) có thể chứa mã độc.','Không thể gửi file nghi ngờ ra sandbox cloud nước ngoài vì quy định bảo mật dữ liệu.'],
risk:['Ransomware/APT xâm nhập qua 1 file đính kèm.','Lây nhiễm hệ thống nội bộ qua file tải lên cổng dịch vụ.','Không có IOC để săn tìm và chặn trên toàn hệ thống.'],
uc:[['Kiểm tra file công dân tải lên cổng dịch vụ','WAF/ứng dụng chuyển file qua ICAP tới MetaDefender Core (multiscan + CDR) và Sandbox; file nghi ngờ bị chặn, file sạch được lưu.'],
['Email gateway gửi file đính kèm sang sandbox','Tài liệu Word có macro tải PowerShell; sandbox phát hiện hành vi, chặn email, đẩy IOC sang NGFW chặn domain.'],
['Kiosk quét USB khu vực mạng quản trị','Mọi USB đưa vào vùng quản trị/OT phải qua kiosk quét + sandbox (OPSWAT MetaDefender Kiosk).'],
['SOC phân tích mẫu thủ công','Analyst upload mẫu từ EDR lên sandbox để nhận báo cáo hành vi, phục vụ ứng cứu.']],
tech:[['Full virtualization sandbox','Chạy file trên VM thật.','Trellix (FireEye) AX/NX, Fortinet FortiSandbox, Trend Deep Discovery Analyzer, Kaspersky Sandbox'],
['Emulation / adaptive sandbox','Giả lập, nhanh và khó né.','OPSWAT MetaDefender Sandbox, Check Point SandBlast (CPU-level)'],
['Cloud sandbox','Phân tích trên cloud hãng.','Palo Alto WildFire, Zscaler, Check Point ThreatCloud, Cisco Secure Malware Analytics'],
['Multiscanning','Quét bằng 20–30+ engine AV.','OPSWAT MetaDefender Core'],
['CDR – Content Disarm & Reconstruction','Tái tạo file sạch, loại bỏ nội dung chủ động.','OPSWAT Deep CDR, Votiro, Check Point Threat Extraction'],
['Hypervisor-based analysis','Phân tích ngoài máy ảo, khó bị phát hiện.','VMRay, Joe Sandbox']],
dia:{cols:[[{t:'Nguồn file',s:'Email · Web · Upload · USB',k:'ext'}],[{t:'NGFW / Mail GW / WAF',s:'ICAP · API'}],[{t:'Multiscan + CDR',s:'MetaDefender Core'}],[{t:'Sandbox',s:'Emulation · VM · YARA',k:'hl'}],[{t:'Kết luận + IOC',s:'Allow / Block'}]],ctl:{t:'Chia sẻ IOC: NGFW · EDR · SIEM · TIP',s:'STIX/TAXII · API',to:[3,4]}},
model:`<p><b>Nguyên lý:</b> File được trích từ luồng (email, web, upload) → kiểm tra hash/reputation → quét đa engine & phân tích tĩnh → nếu chưa kết luận, đưa vào sandbox thực thi có giám sát (API hooking, memory dump, network capture) → engine chấm điểm hành vi → trả kết quả cho hệ thống nguồn (chặn/cho phép/làm sạch CDR) và phát IOC.</p>
<ul><li><b>On-prem appliance/VM:</b> cho Gov/air-gapped; tích hợp ICAP với proxy, MTA, WAF.</li><li><b>Cloud sandbox:</b> qua NGFW/email security của hãng; nhanh, không cần hạ tầng, nhưng file gửi ra ngoài.</li><li><b>Hybrid:</b> on-prem cho file nhạy cảm, cloud cho phần còn lại.</li></ul>`,
lic:{gen:['Theo <b>số file phân tích/ngày (hoặc giờ)</b>, số VM song song, hoặc throughput của appliance.','Multiscanning tính theo số engine (8/12/16/20+) và số lượt quét/ngày hoặc theo node.','Subscription TI/cập nhật + support năm. Cloud sandbox thường nằm trong bundle NGFW/email.'],
v:[['OPSWAT MetaDefender Sandbox','Theo số lượt phân tích/ngày hoặc instance on-prem/cloud; kết hợp MetaDefender Core (license theo gói engine + số node).','NTS phân phối – ưu tiên',1],
['Kaspersky Sandbox / KATA','Theo số node/endpoint được bảo vệ hoặc appliance.','NTS phân phối',1],
['Proofpoint TAP','Sandbox email tính theo số user mailbox (gói Email Protection/TAP).','NTS phân phối',1],
['Fortinet FortiSandbox','Appliance/VM theo số VM song song + subscription.','',0],
['Trellix (FireEye)','Appliance AX/NX/EX theo throughput hoặc user.','',0],
['Palo Alto WildFire','Subscription theo firewall.','',0]]},
pre:[['Nguồn file','Xác định các điểm trích file (mail gateway, proxy, WAF, file server) và giao thức tích hợp (ICAP, API, SMTP).'],['Sizing','Lượng file/ngày theo loại, kích thước trung bình, yêu cầu thời gian phản hồi.'],['Hạ tầng','Máy chủ/VM đủ CPU/RAM cho sandbox; mạng giả lập Internet hoặc egress có kiểm soát cho phân tích.'],['Chính sách','Loại file bắt buộc phân tích, hành động khi quá thời gian, quy trình xử lý file bị giữ lại.']],
mkt:{rank:`<p>Không có MQ riêng cho sandbox (Gartner xếp vào nhóm Network Sandboxing đã hội tụ vào NGFW/Email/EDR). Hãng tiêu biểu: Trellix (FireEye), Palo Alto WildFire, Fortinet FortiSandbox, Check Point, Trend Micro Deep Discovery, Kaspersky, OPSWAT, VMRay, Joe Security, Cisco. Các đánh giá độc lập: ICSA Labs ATD, AV-Comparatives, SE Labs.</p>`,
v:[['OPSWAT','MetaDefender Sandbox + Core + Deep CDR','Mạnh file security & CDR, NTS phân phối'],['Kaspersky','Sandbox, KATA','NTS phân phối'],['Trellix','Malware Analysis (AX), NX/EX','Truyền thống mạnh'],['Palo Alto','WildFire','Cloud sandbox lớn'],['Fortinet','FortiSandbox','ICSA ATD'],['Check Point','SandBlast/Threat Emulation','CPU-level'],['Trend Micro','Deep Discovery Analyzer',''],['VMRay / Joe Security','VMRay Platform / Joe Sandbox','Phân tích chuyên sâu cho SOC']]},
