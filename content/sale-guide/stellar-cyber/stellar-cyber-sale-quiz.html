<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stellar Cyber - Bài Kiểm Tra Đánh Giá Năng Lực Sale</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

  :root {
    --bg: #09090b;
    --surface: #18181b;
    --surface2: #27272a;
    --border: #3f3f46;
    --primary: #3b82f6; /* Blue */
    --primary-hover: #2563eb;
    --accent: #8b5cf6; /* Purple */
    --text: #f4f4f5;
    --text-muted: #a1a1aa;
    --success: #10b981;
    --success-bg: rgba(16, 185, 129, 0.1);
    --danger: #ef4444;
    --danger-bg: rgba(239, 68, 68, 0.1);
    --warning: #f59e0b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    line-height: 1.6;
    padding-bottom: 5rem;
  }

  /* Header & Progress */
  header {
    background: rgba(24, 24, 27, 0.9);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 1rem 2rem;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo { font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .logo span { color: var(--primary); }

  .progress-container { flex: 1; max-width: 400px; margin: 0 2rem; }
  .progress-bar {
    height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent));
    width: 0%; transition: width 0.3s ease;
  }
  .progress-text { font-size: 0.85rem; color: var(--text-muted); text-align: center; margin-top: 5px; font-weight: 500;}

  /* Quiz Container */
  .container { max-width: 800px; margin: 3rem auto; padding: 0 1.5rem; }
  .intro { text-align: center; margin-bottom: 3rem; }
  .intro h1 { font-size: 2.2rem; margin-bottom: 0.5rem; background: linear-gradient(90deg, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .intro p { color: var(--text-muted); }
  .pass-req { display: inline-block; padding: 0.3rem 0.8rem; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; font-size: 0.85rem; font-weight: 600; color: var(--warning); margin-top: 1rem; }

  /* Question Card */
  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2rem;
    margin-bottom: 1.5rem;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .question-card:hover { border-color: #52525b; box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
  .question-header { display: flex; gap: 15px; margin-bottom: 1.5rem; }
  .q-num {
    background: var(--surface2); color: var(--text); font-weight: 700;
    width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .q-text { font-size: 1.15rem; font-weight: 600; color: #fff; margin-top: 3px; }

  /* Options */
  .options-grid { display: flex; flex-direction: column; gap: 0.8rem; }
  .option-label {
    display: flex; align-items: flex-start; padding: 1rem 1.2rem;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    cursor: pointer; transition: all 0.2s;
  }
  .option-label:hover { background: #3f3f46; border-color: #52525b; }
  
  .option-label input[type="radio"] {
    appearance: none; width: 20px; height: 20px; border: 2px solid var(--text-muted);
    border-radius: 50%; margin-right: 12px; margin-top: 2px; flex-shrink: 0;
    position: relative; transition: all 0.2s; cursor: pointer;
  }
  .option-label input[type="radio"]:checked {
    border-color: var(--primary); background: var(--primary);
  }
  .option-label input[type="radio"]:checked::after {
    content: ''; position: absolute; top: 4px; left: 4px; width: 8px; height: 8px;
    background: #fff; border-radius: 50%;
  }
  .option-label:has(input:checked) {
    background: rgba(59, 130, 246, 0.1); border-color: var(--primary);
  }
  .option-text { font-size: 0.95rem; color: var(--text); line-height: 1.5; }

  /* Review Mode Styles */
  .option-label.correct { background: var(--success-bg); border-color: var(--success); }
  .option-label.correct .option-text { color: var(--success); font-weight: 600; }
  .option-label.wrong { background: var(--danger-bg); border-color: var(--danger); opacity: 0.7; }
  .option-label.wrong .option-text { color: var(--danger); text-decoration: line-through; }
  
  .explanation {
    margin-top: 1.5rem; padding: 1rem 1.2rem; background: rgba(139, 92, 246, 0.1);
    border-left: 4px solid var(--accent); border-radius: 0 8px 8px 0;
    font-size: 0.9rem; color: #cbd5e1; display: none;
  }
  .explanation strong { color: #fff; }

  /* Actions */
  .actions { text-align: center; margin-top: 3rem; }
  .btn-submit {
    background: linear-gradient(90deg, var(--primary), var(--accent));
    color: white; border: none; padding: 1rem 3rem; border-radius: 30px;
    font-size: 1.1rem; font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6); }
  .btn-submit:disabled { background: var(--surface2); color: var(--text-muted); cursor: not-allowed; box-shadow: none; transform: none; }

  /* Modal Result */
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
    display: none; align-items: center; justify-content: center; z-index: 1000;
  }
  .modal-overlay.active { display: flex; animation: fadeIn 0.3s; }
  
  .modal-content {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 3rem; text-align: center; max-width: 500px; width: 90%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }

  .score-ring {
    width: 150px; height: 150px; border-radius: 50%; margin: 0 auto 1.5rem;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.5rem; font-weight: 800; color: #fff; position: relative;
  }
  .score-ring::before {
    content: ''; position: absolute; inset: 10px; background: var(--surface); border-radius: 50%; z-index: 0;
  }
  .score-value { position: relative; z-index: 1; font-family: 'JetBrains Mono', monospace;}

  .pass-ring { background: conic-gradient(var(--success) var(--pct), var(--surface2) 0); }
  .fail-ring { background: conic-gradient(var(--danger) var(--pct), var(--surface2) 0); }

  .res-title { font-size: 1.8rem; margin-bottom: 0.5rem; }
  .res-desc { color: var(--text-muted); margin-bottom: 2rem; }
  .btn-review {
    background: var(--surface2); color: white; border: 1px solid var(--border);
    padding: 0.8rem 2rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s;
  }
  .btn-review:hover { background: #3f3f46; border-color: var(--text-muted); }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  @media (max-width: 768px) {
    header { flex-direction: column; gap: 1rem; padding: 1rem; }
    .progress-container { width: 100%; margin: 0; }
    .container { margin-top: 1.5rem; }
    .modal-content { padding: 2rem 1.5rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    Stellar<span>Cyber</span>
  </div>
  <div class="progress-container">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

<div class="container">

    <p>Kiểm tra kiến thức sản phẩm, USP và kỹ năng tư vấn giải pháp Stellar Cyber.</p>
    <div class="pass-req">Mục tiêu: Đạt tối thiểu 75% (23/30 câu) để Pass</div>

  <form id="quiz-form">

    </div>

</div>

<!-- Result Modal -->
<div class="modal-overlay" id="result-modal">
  <div class="modal-content">
    <div class="score-ring" id="score-ring" style="--pct: 0%;">
      <span class="score-value"><span id="score-text">0</span>%</span>
    </div>
    <h2 class="res-title" id="res-title">Đang chấm điểm...</h2>
    <p class="res-desc" id="res-desc"></p>
    <div style="font-size: 1.1rem; margin-bottom: 1.5rem; color: #fff;">
      Số câu đúng: <strong id="res-correct" style="color: var(--primary);">0</strong> / 30
    </div>
    <button class="btn-review" onclick="closeModal()">Xem Lại Đáp Án & Giải Thích</button>
  </div>
</div>

<script>
const quizData = [
  // Nhóm 1: Tổng quan & Khái niệm
  {
    q: "Bản chất nền tảng cốt lõi của giải pháp Stellar Cyber là gì?",
    options: [

      "Công cụ sao lưu và phục hồi dữ liệu đám mây."
    ],
    answer: 1,
    explanation: "Stellar Cyber định vị là nền tảng Open XDR tự động hóa đầu tiên, gom nhiều công cụ (SIEM, NDR, SOAR) vào một nền tảng duy nhất để đơn giản hóa SOC."
  },
  {
    q: "Thuật ngữ 'Open' (Mở) trong khái niệm Open XDR của Stellar Cyber mang ý nghĩa quan trọng nhất nào?",
    options: [
      "Mã nguồn mở (Open-source) hoàn toàn miễn phí cho người dùng.",
      "Chỉ thu thập được dữ liệu từ các thiết bị mã nguồn mở như Linux.",
      "Khả năng tích hợp linh hoạt với bất kỳ công cụ bảo mật có sẵn nào (Any EDR, Any Firewall) của bên thứ 3.",
      "Dữ liệu của khách hàng sẽ được mở công khai trên Cloud."
    ],
    answer: 2,
    explanation: "Open XDR không khóa chặt khách hàng vào một hãng (Vendor Lock-in). Khách hàng có thể giữ lại các khoản đầu tư cũ (như Firewall Palo Alto, EDR CrowdStrike) và Stellar sẽ lấy dữ liệu từ đó."
  },
  {
    q: "Chữ 'BYOE' trong chiến lược bán hàng của Stellar Cyber là viết tắt của cụm từ nào?",
    options: [
      "Bring Your Own Equipment",
      "Bring Your Own Encryption",
      "Bring Your Own Endpoint / EDR",
      "Build Your Own Environment"
    ],
    answer: 2,
    explanation: "BYOE (Bring Your Own EDR) - Khách hàng không cần mua phần mềm Endpoint của Stellar mà có thể tận dụng lại EDR họ đang sử dụng."
  },
  
  // Nhóm 2: Pain points & Metrics
  {
    q: "Theo tài liệu của hãng, Stellar Cyber giúp cải thiện chỉ số MTTD (Thời gian trung bình để phát hiện) gấp bao nhiêu lần?",
    options: ["2 lần", "10 lần", "20 lần", "50 lần"],
    answer: 2,
    explanation: "Stellar Cyber mang lại sự cải thiện 20X về MTTD và 8X về MTTR (Phản hồi)."
  },
  {
    q: "Một trong những 'Nỗi đau' (Pain point) lớn nhất của đội ngũ SOC hiện nay mà Stellar Cyber giúp giải quyết là gì?",
    options: [
      "Hệ thống mạng chạy quá chậm do cáp quang đứt.",
      "Alert Fatigue (Quá tải cảnh báo rác) và thiếu hụt nhân sự chuyên môn sâu.",
      "Không có chi phí mua Server phần cứng.",
      "Nhân viên không biết cách sử dụng chuột và bàn phím."
    ],
    answer: 1,
    explanation: "Trung bình một nhân sự mất 3 giờ/ngày chỉ để lọc cảnh báo rác. Sự tự động hóa của AI trong Stellar giúp gom các alert thành 1 Case duy nhất, giảm tải khối lượng công việc."
  },
  {
    q: "Khách hàng nói: 'Công ty tôi quy mô tầm trung (Mid-market), team IT chỉ có 2 người, làm sao vận hành được SOC/XDR?'. Lời giải thích tốt nhất là:",
    options: [
      "Stellar Cyber bắt buộc khách hàng phải thuê thêm 5 kỹ sư bảo mật mới vận hành được.",
      "Tính năng Multi-layer AI hoạt động như một SOC Analyst ảo, tự động phân tích và đưa ra Case Summary rõ ràng, giúp team mỏng vẫn quản lý tốt.",
      "Anh chị nên mua giải pháp rẻ hơn chỉ có Anti-virus.",
      "Stellar Cyber sẽ tự động cấp phát nhân sự từ hãng qua ngồi tại văn phòng của khách hàng."

    answer: 1,
    explanation: "Với sức mạnh của Agentic AI và LLM, hệ thống thay thế con người làm các bước tương quan log thủ công phức tạp, rất phù hợp cho doanh nghiệp thiếu nhân sự chuyên trách."

  // Nhóm 3: SIEM vs Legacy & Competitive advantage

    q: "Điểm yếu lớn nhất của SIEM truyền thống (Legacy SIEM) mà tính năng AI-Driven NG-SIEM của Stellar Cyber khắc phục được là:",
    options: [

    answer: 0,
    explanation: "Legacy SIEM phụ thuộc vào con người phải tự định nghĩa rule. Stellar Cyber NG-SIEM dùng Machine Learning và GraphML để tự động gom nhóm sự kiện (Auto-correlation) mà không cần viết rule."

  {
    q: "Đối với thị trường Việt Nam (Khối Chính phủ, Ngân hàng), lợi thế triển khai mang tính 'vũ khí tối thượng' của Stellar Cyber so với nhiều hãng XDR cloud-native khác là gì?",

    explanation: "Nhiều hãng XDR/SIEM lớn hiện nay chỉ có bản SaaS (Cloud). Việc Stellar Cyber hỗ trợ On-Prem hoàn toàn (cài trên VMware, KVM, Hardware) là điểm chốt sale cực mạnh tại VN."

  {

let answers = new Array(quizData.length).fill(null);

const qContainer = document.getElementById('questions-container');
const btnSubmit = document.getElementById('btn-submit');
const progressFill = document.getElementById('progress-fill');
const answeredCount = document.getElementById('answered-count');

// Render Quiz
quizData.forEach((q, index) => {
  const card = document.createElement('div');
  card.className = 'question-card';
  card.id = `q-card-${index}`;

  let optionsHTML = '';
  q.options.forEach((opt, optIndex) => {
    optionsHTML += `
      <label class="option-label" id="label-${index}-${optIndex}">
        <input type="radio" name="q${index}" value="${optIndex}" onchange="selectAnswer(${index}, ${optIndex})">
        <span class="option-text">${opt}</span>
      </label>
    `;
  });

  card.innerHTML = `
    <div class="question-header">
      <div class="q-num">${index + 1}</div>
      <div class="q-text">${q.q}</div>
    </div>
    <div class="options-grid">
      ${optionsHTML}
    </div>
    <div class="explanation" id="exp-${index}">
      <strong>💡 Giải thích:</strong> ${q.explanation}
    </div>
  `;
  qContainer.appendChild(card);
});

function selectAnswer(qIndex, optIndex) {
  answers[qIndex] = optIndex;
  
  // Update progress
  const answered = answers.filter(a => a !== null).length;
  progressFill.style.width = `${(answered / quizData.length) * 100}%`;
  answeredCount.textContent = answered;

  if (answered === quizData.length) {
    btnSubmit.removeAttribute('disabled');
  }
}

// Evaluate
btnSubmit.addEventListener('click', () => {
  let score = 0;
  
  quizData.forEach((q, index) => {
    const userAns = answers[index];
    const correctAns = q.answer;
    
    // Disable inputs
    const inputs = document.getElementsByName(`q${index}`);
    inputs.forEach(input => input.disabled = true);

    // Styling
    const correctLabel = document.getElementById(`label-${index}-${correctAns}`);
    correctLabel.classList.add('correct');

    if (userAns === correctAns) {
      score++;
    } else if (userAns !== null) {
      const wrongLabel = document.getElementById(`label-${index}-${userAns}`);
      wrongLabel.classList.add('wrong');
    }

    // Show explanation
    document.getElementById(`exp-${index}`).style.display = 'block';
  });

  showResult(score);
  btnSubmit.style.display = 'none'; // hide submit button
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

function showResult(score) {
  const pct = Math.round((score / quizData.length) * 100);
  const isPass = pct >= 75;

  document.getElementById('score-text').textContent = pct;
  document.getElementById('res-correct').textContent = score;
  
  const ring = document.getElementById('score-ring');
  ring.style.setProperty('--pct', `${pct}%`);
  ring.className = `score-ring ${isPass ? 'pass-ring' : 'fail-ring'}`;

  const title = document.getElementById('res-title');
  const desc = document.getElementById('res-desc');

  if (pct >= 90) {
    title.textContent = "🏆 Xuất Sắc!";
    title.style.color = "var(--success)";
    desc.textContent = "Bạn đã làm chủ hoàn toàn kiến thức về Stellar Cyber. Sẵn sàng tự tin chinh phục mọi khách hàng khó tính nhất!";
  } else if (isPass) {
    title.textContent = "🎉 Chúc Mừng! Bạn Đã Pass";
    title.style.color = "var(--success)";
    desc.textContent = "Kiến thức bán hàng của bạn rất vững. Hãy xem lại một vài câu sai ở bên dưới để hoàn thiện hơn nhé.";
  } else {
    title.textContent = "💪 Cần Ôn Luyện Thêm";
    title.style.color = "var(--warning)";
    desc.textContent = "Bạn chưa đạt mức 75%. Hãy dành thời gian đọc lại tài liệu Sales Playbook và làm lại bài test này.";
  }

  document.getElementById('result-modal').classList.add('active');
}

function closeModal() {
  document.getElementById('result-modal').classList.remove('active');
}
</script>
