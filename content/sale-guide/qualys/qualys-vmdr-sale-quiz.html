<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qualys VMDR — Sales Certification Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:ital,wght@0,300;0,400;0,600;0,700;1,300&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090d13;
            --bg2: #0d1420;
            --bg3: #111928;
            --border: rgba(255,255,255,0.07);
            --accent: #e8372a;
            --accent2: #ff6b5e;
            --blue: #2d8eff;
            --blue2: #5ab0ff;
            --green: #00e5a0;
            --yellow: #ffc400;
            --text: #e8edf5;
            --muted: #6b7a96;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        .wrapper {
            max-width: 820px;
            margin: 0 auto;
            padding: 48px 24px 80px;
            position: relative;
            z-index: 1;
        }

        /* === HEADER === */
        .quiz-header {
            text-align: center;
            margin-bottom: 48px;
        }

        .quiz-eyebrow {
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            letter-spacing: 4px;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .quiz-title {
            font-size: clamp(28px, 4vw, 42px);
            font-weight: 700;
            letter-spacing: -1px;
            line-height: 1.15;
            margin-bottom: 16px;
        }

        .quiz-title span {
            color: transparent;
            background: linear-gradient(90deg, var(--blue), var(--green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .quiz-meta {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        .meta-pill {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 6px 14px;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 12.5px;
            color: var(--muted);
        }

        .meta-pill .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .dot-red { background: var(--accent); }
        .dot-blue { background: var(--blue); }
        .dot-green { background: var(--green); }

        /* === PROGRESS === */
        .progress-bar-wrap {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .progress-label {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            color: var(--muted);
            white-space: nowrap;
        }

        .progress-track {
            flex: 1;
            height: 4px;
            background: var(--bg3);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--blue), var(--green));
            border-radius: 2px;
            transition: width 0.4s ease;
            width: 0%;
        }

        .progress-count {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            color: var(--text);
            white-space: nowrap;
        }

        /* === QUESTION CARD === */
        .question-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 28px 32px;
            margin-bottom: 16px;
            transition: border-color 0.3s;
            display: none;
        }

        .question-card.active { display: block; }

        .q-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .q-num {
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--accent);
            background: rgba(232,55,42,0.1);
            border: 1px solid rgba(232,55,42,0.2);
            padding: 3px 10px;
            border-radius: 4px;
        }

        .q-topic {
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            letter-spacing: 1px;
            color: var(--muted);
            text-transform: uppercase;
        }

        .q-text {
            font-size: 15.5px;
            font-weight: 600;
            color: var(--text);
            line-height: 1.65;
            margin-bottom: 22px;
        }

        /* === OPTIONS === */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .option-btn {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 13px 16px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            width: 100%;
            color: var(--text);
        }

        .option-btn:hover:not(:disabled) {
            border-color: rgba(45,142,255,0.4);
            background: rgba(45,142,255,0.06);
        }

        .option-btn:disabled { cursor: default; }

        .option-letter {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            background: var(--bg2);
            border: 1px solid var(--border);
            width: 26px;
            height: 26px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 1px;
            transition: all 0.2s;
        }

        .option-text {
            font-size: 14px;
            color: var(--muted);
            line-height: 1.6;
            transition: color 0.2s;
        }

        /* States */
        .option-btn.selected {
            border-color: rgba(45,142,255,0.5);
            background: rgba(45,142,255,0.08);
        }

        .option-btn.selected .option-letter {
            background: var(--blue);
            border-color: var(--blue);
            color: white;
        }

        .option-btn.selected .option-text { color: var(--text); }

        .option-btn.correct {
            border-color: rgba(0,229,160,0.5);
            background: rgba(0,229,160,0.06);
        }

        .option-btn.correct .option-letter {
            background: var(--green);
            border-color: var(--green);
            color: #090d13;
        }

        .option-btn.correct .option-text { color: var(--text); }

        .option-btn.wrong {
            border-color: rgba(232,55,42,0.5);
            background: rgba(232,55,42,0.06);
        }

        .option-btn.wrong .option-letter {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        /* === EXPLANATION === */
        .explanation {
            margin-top: 14px;
            padding: 14px 16px;
            background: rgba(45,142,255,0.06);
            border: 1px solid rgba(45,142,255,0.2);
            border-radius: 8px;
            font-size: 13.5px;
            color: var(--muted);
            line-height: 1.75;
            display: none;
        }

        .explanation.show { display: block; }
        .explanation strong { color: var(--blue2); }

        /* === NAV BUTTONS === */
        .q-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 22px;
            border-radius: 7px;
            font-size: 13.5px;
            font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-ghost {
            background: var(--bg3);
            border: 1px solid var(--border);
            color: var(--muted);
        }

        .btn-ghost:hover { border-color: rgba(255,255,255,0.15); color: var(--text); }

        .btn-primary {
            background: linear-gradient(135deg, var(--blue), #1a6fd4);
            color: white;
            box-shadow: 0 4px 12px rgba(45,142,255,0.25);
        }

        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(45,142,255,0.35); }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        .btn-submit {
            background: linear-gradient(135deg, var(--green), #00b87e);
            color: #090d13;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(0,229,160,0.25);
            display: none;
        }

        .btn-submit:hover { transform: translateY(-1px); }

        /* === RESULT === */
        #result-section {
            display: none;
        }

        .result-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 48px 40px;
            text-align: center;
        }

        .result-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            border-radius: 30px;
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        .badge-pass {
            background: rgba(0,229,160,0.1);
            border: 1px solid rgba(0,229,160,0.35);
            color: var(--green);
        }

        .badge-fail {
            background: rgba(232,55,42,0.1);
            border: 1px solid rgba(232,55,42,0.35);
            color: var(--accent2);
        }

        .result-score {
            font-family: 'Space Mono', monospace;
            font-size: 72px;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 8px;
        }

        .score-pass { color: var(--green); }
        .score-fail { color: var(--accent); }

        .result-label {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 32px;
        }

        .result-stats {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-bottom: 36px;
            flex-wrap: wrap;
        }

        .rstat {
            text-align: center;
        }

        .rstat-val {
            font-family: 'Space Mono', monospace;
            font-size: 26px;
            font-weight: 700;
            display: block;
        }

        .rstat-lbl {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
        }

        .rstat-correct .rstat-val { color: var(--green); }
        .rstat-wrong .rstat-val { color: var(--accent); }
        .rstat-skip .rstat-val { color: var(--yellow); }

        .result-message {
            font-size: 15px;
            color: var(--muted);
            max-width: 480px;
            margin: 0 auto 36px;
            line-height: 1.8;
        }

        .result-message strong { color: var(--text); }

        .pass-threshold {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 12.5px;
            color: var(--muted);
            margin-bottom: 32px;
        }

        .threshold-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--yellow);
        }

        .btn-retry {
            background: var(--bg3);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 28px;
            font-size: 14px;
        }

        .btn-retry:hover { border-color: rgba(255,255,255,0.2); }

        /* Review list */
        .review-section {
            margin-top: 40px;
            text-align: left;
        }

        .review-title {
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            letter-spacing: 3px;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .review-item {
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .review-icon { font-size: 16px; flex-shrink: 0; margin-top: 2px; }
        .review-q { font-size: 13px; color: var(--muted); line-height: 1.6; flex: 1; }
        .review-q strong { color: var(--text); display: block; margin-bottom: 2px; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        @media (max-width: 600px) {
            .question-card { padding: 20px 18px; }
            .result-card { padding: 32px 20px; }
            .result-score { font-size: 52px; }
        }
    </style>
</head>
<body>
<div class="wrapper">

    <!-- HEADER -->
    <div class="quiz-header">
        <div class="quiz-eyebrow">NTS Hanoi · Sales Certification</div>
        <h1 class="quiz-title">Qualys VMDR <span>Knowledge Check</span></h1>
        <div class="quiz-meta">
            <div class="meta-pill"><div class="dot dot-red"></div>30 câu hỏi</div>
            <div class="meta-pill"><div class="dot dot-blue"></div>Mức độ: Sales</div>
            <div class="meta-pill"><div class="dot dot-green"></div>Pass: ≥ 75% (23/30)</div>
        </div>
    </div>

    <!-- PROGRESS -->
    <div class="progress-bar-wrap">
        <span class="progress-label">TIẾN ĐỘ</span>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <span class="progress-count" id="progressCount">0 / 30</span>
    </div>

    <!-- QUIZ SECTION -->
    <div id="quiz-section"></div>

    <!-- RESULT SECTION -->
    <div id="result-section">
        <div class="result-card">
            <div id="result-badge"></div>
            <div class="result-score" id="result-score"></div>
            <div class="result-label" id="result-label"></div>
            <div class="result-stats">
                <div class="rstat rstat-correct">
                    <span class="rstat-val" id="r-correct">0</span>
                    <div class="rstat-lbl">✓ Đúng</div>
                </div>
                <div class="rstat rstat-wrong">
                    <span class="rstat-val" id="r-wrong">0</span>
                    <div class="rstat-lbl">✗ Sai</div>
                </div>
            </div>
            <div class="pass-threshold">
                <div class="threshold-dot"></div>
                Ngưỡng đạt: 23/30 câu đúng (75%)
            </div>
            <div class="result-message" id="result-message"></div>
            <button class="btn btn-retry" onclick="resetQuiz()">🔄 Làm lại từ đầu</button>
            <div class="review-section">
                <div class="review-title">Chi tiết kết quả</div>
                <div id="review-list"></div>
            </div>
        </div>
    </div>

</div>

<script>
const questions = [
    {
        topic: "Tổng quan",
        q: "Qualys VMDR là viết tắt của cụm từ nào?",
        opts: [
            "Vulnerability Monitoring, Detection & Reporting",
            "Vulnerability Management, Detection & Response",
            "Vulnerability Mitigation, Detection & Remediation",
            "Virtual Management, Detection & Response"
        ],
        ans: 1,
        exp: "<strong>VMDR = Vulnerability Management, Detection & Response</strong> — đây là tên chính thức và cũng là câu bạn sẽ cần trả lời ngay khi khách hàng hỏi \"giải pháp này là cái gì\"."
    },
    {
        topic: "Tổng quan",
        q: "Qualys hiện phục vụ bao nhiêu khách hàng doanh nghiệp trên toàn cầu?",
        opts: [
            "Hơn 5.000 khách hàng",
            "Hơn 10.000 khách hàng",
            "Hơn 20.000 khách hàng",
            "Hơn 50.000 khách hàng"
        ],
        ans: 1,
        exp: "Qualys phục vụ <strong>hơn 10.000 khách hàng toàn cầu</strong>, bao gồm đa số Fortune 100 và Forbes Global 100. Con số này là điểm uy tín quan trọng khi pitch khách hàng."
    },
    {
        topic: "Kiến trúc",
        q: "Điểm khác biệt quan trọng nhất về kiến trúc của Qualys so với Rapid7 InsightVM là gì?",
        opts: [
            "Qualys dùng nhiều agent hơn",
            "Qualys yêu cầu server on-premise để xử lý dữ liệu",
            "Qualys là 100% cloud-native, không cần server on-premise",
            "Qualys chỉ hỗ trợ môi trường Windows"
        ],
        ans: 2,
        exp: "Qualys là <strong>100% Cloud-Native</strong> — khách hàng không cần mua hay quản lý server hạ tầng trung tâm nào. Rapid7 InsightVM yêu cầu máy chủ Insight Collector on-premise."
    },
    {
        topic: "Kiến trúc",
        q: "Qualys Cloud Agent sử dụng tối đa bao nhiêu % CPU của máy chủ/máy trạm?",
        opts: [
            "Dưới 5%",
            "Dưới 3%",
            "Dưới 1%",
            "Dưới 10%"
        ],
        ans: 2,
        exp: "Qualys Cloud Agent được thiết kế rất nhẹ — <strong>dưới 1% CPU</strong>. Đây là lợi thế khi khách hàng lo ngại ảnh hưởng hiệu năng hệ thống."
    },
    {
        topic: "Tính năng",
        q: "TruRisk™ chấm điểm rủi ro theo thang điểm nào?",
        opts: [
            "0 – 10 (giống CVSS)",
            "1 – 100",
            "0 – 1000",
            "1 – 500"
        ],
        ans: 2,
        exp: "<strong>TruRisk chấm điểm từ 0 đến 1000</strong>. Thang điểm rộng hơn CVSS cho phép phân biệt chi tiết mức độ rủi ro thực tế, không chỉ mức độ nghiêm trọng lý thuyết."
    },
    {
        topic: "TruRisk",
        q: "TruRisk khác CVSS ở điểm nào cốt lõi nhất?",
        opts: [
            "TruRisk có thang điểm cao hơn",
            "TruRisk tính đến mức độ khai thác thực tế và tầm quan trọng của tài sản bị ảnh hưởng",
            "TruRisk chỉ áp dụng cho lỗ hổng Windows",
            "TruRisk được cập nhật mỗi năm một lần"
        ],
        ans: 1,
        exp: "CVSS đánh giá lý thuyết thuần túy. <strong>TruRisk đánh giá rủi ro thực tế</strong>: lỗ hổng này có bị khai thác chưa? Có Ransomware nào đang dùng không? Tài sản dính lỗi có quan trọng không? Đây là điểm bán hàng cốt lõi."
    },
    {
        topic: "TruRisk",
        q: "Theo Qualys, TruRisk giúp giảm số lỗ hổng cần ưu tiên xử lý đến bao nhiêu %?",
        opts: [
            "50%",
            "65%",
            "75%",
            "85%"
        ],
        ans: 3,
        exp: "TruRisk giúp <strong>giảm 85% số lỗ hổng</strong> cần ưu tiên, tập trung vào 15% lỗ hổng tạo ra 85% rủi ro thực sự. Đây là con số ấn tượng để giải quyết bài toán \"vulnerability fatigue\"."
    },
    {
        topic: "Patching",
        q: "Qualys Patch Management hỗ trợ vá lỗi cho loại nào dưới đây?",
        opts: [
            "Chỉ Windows Server",
            "Windows và Linux Server, KHÔNG bao gồm ứng dụng bên thứ 3",
            "Windows, Linux, macOS và hàng trăm ứng dụng bên thứ 3 như Chrome, Adobe, Zoom",
            "Chỉ ứng dụng Microsoft Office"
        ],
        ans: 2,
        exp: "Qualys PM vá được <strong>Windows, Linux, macOS</strong> và hàng trăm ứng dụng bên thứ 3 (Chrome, Adobe, Zoom…). Đây là điểm vượt trội so với SCCM vốn chủ yếu mạnh về Windows."
    },
    {
        topic: "Patching",
        q: "Tính năng \"Zero-Touch Patching\" của Qualys có nghĩa là gì?",
        opts: [
            "Vá lỗi không cần reboot máy",
            "Tự động triển khai bản vá theo rule mà không cần IT can thiệp thủ công",
            "Vá lỗi chỉ trong môi trường air-gapped",
            "Vá lỗi mà không cần cài agent"
        ],
        ans: 1,
        exp: "<strong>Zero-Touch Patching</strong> = đặt rule (ví dụ: \"tự động vá Chrome trong 24h nếu Critical\") và hệ thống tự làm mọi thứ — IT không cần đụng tay. Rất quan trọng với khách hàng có số lượng endpoint lớn."
    },
    {
        topic: "Patching",
        q: "Tại sao Qualys Patch Management vá được máy tính nhân viên WFH mà không cần VPN?",
        opts: [
            "Vì dùng Remote Desktop Protocol",
            "Vì Cloud Agent tải bản vá trực tiếp từ CDN của Qualys qua Internet",
            "Vì bản vá được đẩy qua email",
            "Vì Qualys tích hợp sẵn với mạng ISP"
        ],
        ans: 1,
        exp: "<strong>Qualys Cloud Agent lấy bản vá từ CDN của Qualys qua Internet</strong> — không phụ thuộc vào hạ tầng mạng nội bộ hay VPN. Đây là lợi thế lớn với xu hướng WFH sau COVID."

let current = 0;
let answers = new Array(questions.length).fill(null);
let answered = new Array(questions.length).fill(false);

function renderQuiz() {
    const container = document.getElementById('quiz-section');
    container.innerHTML = '';
    questions.forEach((q, i) => {
        const card = document.createElement('div');
        card.className = 'question-card' + (i === 0 ? ' active' : '');
        card.id = `q${i}`;

        const letters = ['A', 'B', 'C', 'D'];
        const optsHtml = q.opts.map((opt, j) => `
            <button class="option-btn" id="opt_${i}_${j}" onclick="selectOption(${i}, ${j})">
                <span class="option-letter">${letters[j]}</span>
                <span class="option-text">${opt}</span>
            </button>
        `).join('');

        card.innerHTML = `
            <div class="q-meta">
                <span class="q-num">Q${String(i+1).padStart(2,'0')}</span>
                <span class="q-topic">${q.topic}</span>
            </div>
            <div class="q-text">${q.q}</div>
            <div class="options-list">${optsHtml}</div>
            <div class="explanation" id="exp${i}">${q.exp}</div>
            <div class="q-nav">
                <button class="btn btn-ghost" onclick="navigate(-1)" ${i === 0 ? 'disabled' : ''}>← Trước</button>
                <button class="btn btn-primary" id="nextBtn${i}" onclick="navigate(1)" ${i === questions.length - 1 ? 'style="display:none"' : ''} disabled>Tiếp →</button>
                <button class="btn btn-submit" id="submitBtn${i}" onclick="submitQuiz()" ${i === questions.length - 1 ? '' : 'style="display:none"'}>Nộp bài ✓</button>
            </div>
        `;
        container.appendChild(card);
    });
    updateProgress();
}

function selectOption(qIdx, optIdx) {
    if (answered[qIdx]) return;
    answered[qIdx] = true;
    answers[qIdx] = optIdx;

    const q = questions[qIdx];
    const letters = ['A', 'B', 'C', 'D'];

    // Disable all options
    q.opts.forEach((_, j) => {
        const btn = document.getElementById(`opt_${qIdx}_${j}`);
        btn.disabled = true;
        if (j === q.ans) {
            btn.classList.add('correct');
        } else if (j === optIdx && optIdx !== q.ans) {
            btn.classList.add('wrong');
        }
    });

    // Show explanation
    document.getElementById(`exp${qIdx}`).classList.add('show');

    // Enable next/submit
    const nextBtn = document.getElementById(`nextBtn${qIdx}`);
    const submitBtn = document.getElementById(`submitBtn${qIdx}`);
    if (nextBtn) nextBtn.disabled = false;
    if (submitBtn && qIdx === questions.length - 1) submitBtn.style.display = 'inline-flex';

    updateProgress();
}

function navigate(dir) {
    const cards = document.querySelectorAll('.question-card');
    cards[current].classList.remove('active');
    current = Math.max(0, Math.min(questions.length - 1, current + dir));
    cards[current].classList.add('active');
    cards[current].scrollIntoView({ behavior: 'smooth', block: 'start' });
    updateProgress();
}

function updateProgress() {
    const done = answered.filter(Boolean).length;
    const pct = (done / questions.length) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressCount').textContent = `${done} / ${questions.length}`;
}

function submitQuiz() {
    // Check all answered
    const unanswered = answered.filter(Boolean).length;
    if (unanswered < questions.length) {
        const remaining = questions.length - unanswered;
        if (!confirm(`Còn ${remaining} câu chưa trả lời. Bạn vẫn muốn nộp bài?`)) return;
    }

    let correct = 0;
    questions.forEach((q, i) => {
        if (answers[i] === q.ans) correct++;
    });

    const total = questions.length;
    const pct = Math.round((correct / total) * 100);
    const pass = pct >= 75;

    document.getElementById('quiz-section').style.display = 'none';
    document.querySelector('.progress-bar-wrap').style.display = 'none';
    document.getElementById('result-section').style.display = 'block';

    document.getElementById('result-badge').innerHTML = pass
        ? '<div class="result-badge badge-pass">✓ ĐẠT CHUẨN</div>'
        : '<div class="result-badge badge-fail">✗ CHƯA ĐẠT</div>';

    document.getElementById('result-score').className = 'result-score ' + (pass ? 'score-pass' : 'score-fail');
    document.getElementById('result-score').textContent = pct + '%';
    document.getElementById('result-label').textContent = `${correct} / ${total} câu đúng`;

    document.getElementById('r-correct').textContent = correct;
    document.getElementById('r-wrong').textContent = total - correct;

    document.getElementById('result-message').innerHTML = pass
        ? `<strong>Xuất sắc!</strong> Bạn đã nắm vững kiến thức về Qualys VMDR. Sẵn sàng ra thực chiến với khách hàng.`
        : `Bạn cần ôn lại các phần còn yếu và làm lại bài kiểm tra. Tập trung vào các câu trả lời sai bên dưới.`;

    // Review list
    const reviewList = document.getElementById('review-list');
    reviewList.innerHTML = '';
    questions.forEach((q, i) => {
        const isCorrect = answers[i] === q.ans;
        const skipped = answers[i] === null;
        const icon = skipped ? '⏭' : (isCorrect ? '✅' : '❌');
        const userAns = skipped ? 'Bỏ qua' : q.opts[answers[i]];
        const correctAns = q.opts[q.ans];

        if (!isCorrect) {
            const item = document.createElement('div');
            item.className = 'review-item';
            item.innerHTML = `
                <div class="review-icon">${icon}</div>
                <div class="review-q">
                    <strong>Q${i+1}: ${q.q}</strong>
                    Đáp án đúng: <span style="color:var(--green)">${correctAns}</span>
                    ${!skipped ? `<br>Bạn chọn: <span style="color:var(--accent2)">${userAns}</span>` : ''}
                </div>
            `;
            reviewList.appendChild(item);
        }
    });

    if (correct === total) {
        reviewList.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--green); font-family: Space Mono, monospace; font-size: 13px;">PERFECT SCORE — Không có câu sai nào! 🎯</div>';
    }

    document.getElementById('result-section').scrollIntoView({ behavior: 'smooth' });
}

function resetQuiz() {
    current = 0;
    answers = new Array(questions.length).fill(null);
    answered = new Array(questions.length).fill(false);
    document.getElementById('result-section').style.display = 'none';
    document.getElementById('quiz-section').style.display = 'block';
    document.querySelector('.progress-bar-wrap').style.display = 'flex';
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Init
renderQuiz();
</script>
