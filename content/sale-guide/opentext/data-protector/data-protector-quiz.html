<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Data Protector — Bài kiểm tra kiến thức</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap');

:root {
  --bg: #08090a;
  --bg2: #111214;
  --bg3: #18191c;
  --border: #2a2c30;
  --border2: #3a3c42;
  --text: #f0f0f0;
  --text2: #8a8d95;
  --text3: #5a5d65;
  --blue: #4d9fff;
  --blue2: #1a3a6e;
  --green: #3ecf6e;
  --green2: #0f3320;
  --red: #ff5252;
  --red2: #3a0f0f;
  --amber: #ffb830;
  --amber2: #3a2500;
  --head: 'Syne', sans-serif;
  --body: 'DM Sans', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--body);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── BG PATTERN ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(circle at 20% 20%, rgba(77,159,255,0.06) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(62,207,110,0.04) 0%, transparent 50%),
    repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px),
    repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px);
  pointer-events: none;
  z-index: 0;
}

/* ── PROGRESS BAR ── */
.progress-bar {
  position: fixed;
  top: 0; left: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--blue), var(--green));
  transition: width 0.4s ease;
  z-index: 1000;
  box-shadow: 0 0 12px rgba(77,159,255,0.5);
}

/* ── HEADER ── */
.header {
  position: relative;
  z-index: 1;
  padding: 40px 20px 32px;
  text-align: center;
  border-bottom: 1px solid var(--border);
}
.header-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 100px;
  padding: 6px 14px 6px 8px;
  margin-bottom: 20px;
}
.badge-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px var(--green);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%,100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.badge-text { font-size: 12px; color: var(--text2); font-family: var(--body); letter-spacing: 0.04em; }
.header h1 {
  font-family: var(--head);
  font-size: clamp(24px, 6vw, 36px);
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.02em;
  line-height: 1.1;
  margin-bottom: 10px;
}
.header h1 span { color: var(--blue); }
.header p {
  font-size: 15px;
  color: var(--text2);
  max-width: 480px;
  margin: 0 auto 24px;
  line-height: 1.6;
}
.meta-row {
  display: flex;
  justify-content: center;
  gap: 24px;
  flex-wrap: wrap;
}
.meta-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--text2);
}
.meta-icon {
  width: 20px; height: 20px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
}

/* ── QUIZ WRAP ── */
.quiz-wrap {
  position: relative;
  z-index: 1;
  max-width: 680px;
  margin: 0 auto;
  padding: 24px 16px 80px;
}

/* ── QUESTION CARD ── */
.q-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 16px;
  margin-bottom: 16px;
  overflow: hidden;
  transition: border-color 0.2s;
}
.q-card.answered-correct { border-color: rgba(62,207,110,0.4); }
.q-card.answered-wrong { border-color: rgba(255,82,82,0.4); }

.q-header {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 16px 18px 14px;
  border-bottom: 1px solid var(--border);
}
.q-num {
  font-family: var(--head);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--blue);
  background: var(--blue2);
  padding: 3px 8px;
  border-radius: 5px;
  flex-shrink: 0;
  margin-top: 2px;
}
.q-tag {
  font-size: 10px;
  color: var(--text3);
  background: var(--bg3);
  padding: 3px 7px;
  border-radius: 5px;
  flex-shrink: 0;
  margin-top: 2px;
  border: 1px solid var(--border);
}
.q-text {
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  line-height: 1.55;
  flex: 1;
}

/* ── OPTIONS ── */
.q-options { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; }

.opt {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.opt:hover { border-color: var(--border2); background: #1e2024; }
.opt:active { transform: scale(0.985); }

.opt-letter {
  width: 22px; height: 22px;
  border-radius: 6px;
  background: var(--bg);
  border: 1px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--head);
  font-size: 11px;
  font-weight: 700;
  color: var(--text2);
  flex-shrink: 0;
  margin-top: 1px;
  transition: all 0.15s;
}
.opt-text { font-size: 13px; color: var(--text2); line-height: 1.5; padding-top: 2px; }

/* selected */
.opt.selected { border-color: var(--blue); background: rgba(77,159,255,0.08); }
.opt.selected .opt-letter { background: var(--blue); border-color: var(--blue); color: #fff; }
.opt.selected .opt-text { color: var(--text); }

/* correct */
.opt.correct { border-color: var(--green); background: rgba(62,207,110,0.08); }
.opt.correct .opt-letter { background: var(--green); border-color: var(--green); color: #fff; }
.opt.correct .opt-text { color: var(--text); }

/* wrong */
.opt.wrong { border-color: var(--red); background: rgba(255,82,82,0.08); }
.opt.wrong .opt-letter { background: var(--red); border-color: var(--red); color: #fff; }
.opt.wrong .opt-text { color: var(--text); }

/* missed correct */
.opt.show-correct { border-color: rgba(62,207,110,0.5); background: rgba(62,207,110,0.05); }
.opt.show-correct .opt-letter { border-color: var(--green); color: var(--green); }
.opt.show-correct .opt-text { color: var(--text2); }

/* disabled */
.opt.disabled { cursor: default; pointer-events: none; }

/* ── EXPLANATION ── */
.q-explain {
  margin: 0 14px 14px;
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 13px;
  line-height: 1.6;
  display: none;
}
.q-explain.correct-exp { background: var(--green2); color: #7adfaa; border: 1px solid rgba(62,207,110,0.2); }
.q-explain.wrong-exp { background: var(--red2); color: #ff8a8a; border: 1px solid rgba(255,82,82,0.2); }
.q-explain.show { display: block; }
.q-explain strong { color: #fff; }

/* ── SUBMIT BTN ── */
.submit-wrap {
  text-align: center;
  margin: 28px 0 16px;
}
.btn-submit {
  font-family: var(--head);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.03em;
  padding: 14px 40px;
  background: linear-gradient(135deg, var(--blue), #2d7fff);
  border: none;
  border-radius: 12px;
  color: #fff;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 4px 20px rgba(77,159,255,0.3);
}
.btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(77,159,255,0.4); }
.btn-submit:active { transform: translateY(0); }
.btn-submit:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

/* ── RESULT PANEL ── */
#result-panel {
  display: none;
  position: relative;
  z-index: 1;
  max-width: 680px;
  margin: 0 auto;
  padding: 0 16px 80px;
}

.result-card {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: 20px;
  overflow: hidden;
  margin-bottom: 20px;
}

.result-hero {
  padding: 40px 24px 32px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.result-hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 0%, var(--hero-color, rgba(77,159,255,0.12)) 0%, transparent 70%);
}
.result-score-ring {
  width: 120px; height: 120px;
  margin: 0 auto 20px;
  position: relative;
  z-index: 1;
}
.result-score-ring svg { transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--bg3); stroke-width: 8; }
.ring-fill { fill: none; stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 1.2s cubic-bezier(0.4,0,0.2,1); }
.score-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.score-num {
  font-family: var(--head);
  font-size: 28px;
  font-weight: 800;
  line-height: 1;
}
.score-denom { font-size: 12px; color: var(--text2); margin-top: 2px; }

.result-grade {
  font-family: var(--head);
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 6px;
  position: relative; z-index: 1;
}
.result-msg {
  font-size: 14px;
  color: var(--text2);
  line-height: 1.5;
  position: relative; z-index: 1;
  max-width: 360px;
  margin: 0 auto;
}

.result-stats {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  border-top: 1px solid var(--border);
}
.stat-item {
  padding: 16px;
  text-align: center;
  border-right: 1px solid var(--border);
}
.stat-item:last-child { border-right: none; }
.stat-num { font-family: var(--head); font-size: 20px; font-weight: 700; }
.stat-lbl { font-size: 11px; color: var(--text2); margin-top: 3px; }

/* category breakdown */
.breakdown { padding: 20px; }
.breakdown h3 {
  font-family: var(--head);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--text2);
  text-transform: uppercase;
  margin-bottom: 14px;
}
.cat-row { margin-bottom: 12px; }
.cat-top { display: flex; justify-content: space-between; margin-bottom: 5px; }
.cat-name { font-size: 13px; color: var(--text); }
.cat-score { font-size: 13px; color: var(--text2); }
.cat-bar { height: 5px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
.cat-fill { height: 100%; border-radius: 3px; transition: width 1s ease; }

.btn-retry {
  font-family: var(--head);
  font-size: 14px;
  font-weight: 700;
  padding: 12px 32px;
  border: 1px solid var(--border2);
  border-radius: 10px;
  background: var(--bg3);
  color: var(--text);
  cursor: pointer;
  display: block;
  margin: 0 auto;
  transition: all 0.15s;
}
.btn-retry:hover { background: var(--bg2); border-color: var(--blue); color: var(--blue); }

/* ── STICKY COUNTER ── */
.sticky-counter {
  position: fixed;
  bottom: 20px;
  right: 16px;
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: 12px;
  padding: 10px 14px;
  z-index: 50;
  font-size: 12px;
  color: var(--text2);
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.counter-num { font-family: var(--head); font-size: 16px; font-weight: 700; color: var(--text); }

@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
.q-card { animation: fadeIn 0.3s ease both; }
.q-card:nth-child(n) { animation-delay: calc(n * 0.02s); }
</style>
</head>
<body>

<div class="progress-bar" id="pbar" style="width:0%"></div>

<div class="header">
  <div class="header-badge">
    <div class="badge-dot"></div>
    <span class="badge-text">OpenText Data Protector — Certification Quiz</span>
  </div>
  <h1>Kiểm tra kiến thức<br><span>Data Protector</span></h1>
  <p>30 câu hỏi trắc nghiệm đánh giá toàn diện: kiến trúc, tính năng, tích hợp, bảo mật, licensing và sales.</p>
  <div class="meta-row">
    <div class="meta-item"><div class="meta-icon">📝</div> 30 câu hỏi</div>
    <div class="meta-item"><div class="meta-icon">⚡</div> Kết quả ngay</div>
    <div class="meta-item"><div class="meta-icon">🎯</div> 6 chủ đề</div>
    <div class="meta-item"><div class="meta-icon">📱</div> Mobile-friendly</div>
  </div>
</div>

<div class="quiz-wrap" id="quiz-wrap">
  <!-- Questions injected by JS -->
</div>

<div id="result-panel"></div>

<div class="sticky-counter" id="sticky">
  <span>Đã trả lời</span>
  <span class="counter-num" id="cnt">0</span>
  <span>/ 30</span>
</div>

<script>
const Q = [
  // ── KIẾN TRÚC (5 câu)
  {
    cat: "Kiến trúc",
    q: "Thành phần nào là 'não bộ' trung tâm, quản lý toàn bộ backup policies và catalog trong Data Protector?",
    opts: ["Media Agent", "Disk Agent", "Cell Manager", "Installation Server"],
    ans: 2,
    exp: "<strong>Cell Manager</strong> là thành phần trung tâm, quản lý policies, catalog, scheduling. Nó có thể được cài trên Windows, Linux hoặc HP-UX."
  },
  {
    cat: "Kiến trúc",
    q: "Data Protector Cell Manager có thể được cài đặt trên những hệ điều hành nào?",
    opts: ["Chỉ Windows Server", "Windows và Linux", "Windows, Linux và HP-UX", "Linux và CentOS"],
    ans: 2,
    exp: "<strong>Cell Manager hỗ trợ Windows, Linux và HP-UX.</strong> Còn DP for Cloud Workloads (DP4CW) thì cài trên Linux và CentOS."
  },
  {
    cat: "Kiến trúc",
    q: "Manager of Managers (MoM) được dùng để làm gì?",
    opts: ["Quản lý nhiều Media Agent đồng thời", "Quản lý tập trung nhiều Cell Manager từ một console", "Thay thế Cell Manager trong môi trường lớn", "Backup Cell Manager khi gặp sự cố"],
    ans: 1,
    exp: "<strong>MoM cho phép quản lý tập trung nhiều Cell Manager</strong> từ một console duy nhất — phù hợp với doanh nghiệp lớn, multi-site, cần centralized management."
  },
  {
    cat: "Kiến trúc",
    q: "Thành phần nào trong Data Protector chịu trách nhiệm DI CHUYỂN dữ liệu đến backup device (tape, disk, cloud)?",
    opts: ["Disk Agent (DA)", "Media Agent (MA)", "Cell Manager", "Internal Database (IDB)"],
    ans: 1,
    exp: "<strong>Media Agent (MA)</strong> chịu trách nhiệm di chuyển dữ liệu đến backup device. Còn Disk Agent (DA) là agent cài trên client để backup file system."
  },
  {
    cat: "Kiến trúc",
    q: "Data Protector Internal Database (IDB) lưu trữ thông tin gì?",
    opts: ["Dữ liệu backup của các server", "Encryption keys của backup data", "Metadata về backup sessions, media và objects", "Log file của quá trình backup"],
    ans: 2,
    exp: "<strong>IDB lưu trữ metadata</strong> về backup sessions, media, và objects — là nền tảng cho tính năng tìm kiếm, reporting và restore. IDB cũng nên được backup để đảm bảo continuity."
  },

  // ── TÍNH NĂNG (7 câu)
  {
    cat: "Tính năng",
    q: "Tính năng nào cho phép Data Protector backup VMware mà KHÔNG cần cài agent bên trong từng VM?",
    opts: ["Hardware-assisted backup", "Agentless backup qua native hypervisor integration", "Zero Downtime Backup (ZDB)", "Cached Granular Recovery"],
    ans: 1,
    exp: "<strong>Native integration với VMware và Hyper-V</strong> cung cấp agentless backup — không cần cài agent trong VM. DP cũng hỗ trợ protection policy inheritance khi VM mới được tạo."
  },
  {
    cat: "Tính năng",
    q: "Tính năng 'VM Power On' trong Data Protector cho phép làm gì?",
    opts: ["Tắt VM trước khi backup để đảm bảo consistent", "Khởi động VM trực tiếp từ backup image mà không cần restore trước", "Tự động bật VM sau khi backup hoàn thành", "Kiểm tra VM có đang chạy trước khi backup"],
    ans: 1,
    exp: "<strong>VM Power On</strong> cho phép khởi động VM ngay lập tức từ backup image trên supported device (HPE StoreOnce / Dell EMC DD) — không cần chờ restore xong mới dùng được."
  },
  {
    cat: "Tính năng",
    q: "Data Protector Deduplication (DPD) có khả năng scale đến bao nhiêu dữ liệu nguồn?",
    opts: ["100 TB", "500 TB", "Hơn 1 PB", "10 PB"],
    ans: 2,
    exp: "<strong>DPD có thể scale đến hơn 1 PB source data.</strong> Đây là enterprise feature thường chỉ có trên dedicated dedup appliance, nhưng Data Protector tích hợp sẵn dưới dạng software."
  },
  {
    cat: "Tính năng",
    q: "Trong Federated Deduplication, dữ liệu có thể được deduplicate ở đâu?",
    opts: ["Chỉ trên backup appliance (target)", "Chỉ trên application server (source)", "Tại application server, media server hoặc backup appliance", "Chỉ trên media server"],
    ans: 2,
    exp: "<strong>Federated dedup có thể chạy tại 3 điểm:</strong> application server (source side), media server, hoặc backup appliance (target). Một khi deduplicated, data di chuyển không cần rehydrate."
  },
  {
    cat: "Tính năng",
    q: "Tính năng 'Live Migrate' trong Data Protector VMware protection thực hiện điều gì?",
    opts: ["Di chuyển VM từ host này sang host khác khi backup", "Khởi động VM từ backup image và đồng thời restore về đích — cùng lúc", "Migrate VM sang cloud trong khi đang chạy production", "Tạo live snapshot của VM đang chạy"],
    ans: 1,
    exp: "<strong>Live Migrate</strong> vừa khởi động VM từ backup image (để dùng ngay), vừa đồng thời tiến hành restore VM về destination thực sự — giảm tối đa downtime."
  },
  {
    cat: "Tính năng",
    q: "Operations Orchestration (OO) trong Data Protector dùng để làm gì?",
    opts: ["Tự động scale storage khi đầy", "Tạo workflow tự động hóa các quy trình backup và recovery", "Điều phối traffic mạng trong quá trình backup", "Quản lý license tự động"],
    ans: 1,
    exp: "<strong>Operations Orchestration (OO)</strong> cho phép tạo workflow qua content packs để tự động hóa đa dạng quy trình backup và recovery — giảm tác vụ thủ công cho admin."
  },
  {
    cat: "Tính năng",
    q: "Enhanced Automated Disaster Recovery (EADR) backup những gì ngoài application data?",
    opts: ["Chỉ user data files", "OS files, drivers và files cần thiết cho boot process", "Chỉ database files và transaction logs", "Toàn bộ storage array snapshots"],
    ans: 1,
    exp: "<strong>EADR backup cả OS files, drivers, và boot files</strong> — cho phép phục hồi bare-metal hoàn toàn. Chỉ cần check một checkbox trong GUI để kích hoạt, không tốn thêm chi phí."
  },

  // ── TÍCH HỢP (6 câu)
  {
    cat: "Tích hợp",
    q: "Data Protector hỗ trợ tích hợp application-aware backup với những database/ứng dụng nào sau đây? (chọn nhóm đầy đủ nhất)",
    opts: [
      "Oracle, SQL Server, Exchange",
      "Oracle, SAP HANA, IBM Db2, PostgreSQL, MySQL, Sybase ASE, Exchange, SharePoint",
      "Oracle, SAP HANA, SQL Server, Exchange",
      "Chỉ Oracle và SAP HANA"
    ],
    ans: 1,
    exp: "<strong>Data Protector có support matrix rộng nhất:</strong> Oracle, SAP, SAP HANA, IBM Db2, Sybase ASE, PostgreSQL, MySQL, MS Exchange, MS SharePoint, MS SQL Server — tất cả đều application-aware."
  },
  {
    cat: "Tích hợp",
    q: "Zero Downtime Backup (ZDB) với HPE storage cho phép làm gì đặc biệt?",
    opts: [
      "Backup mà không cần network connection",

// ── SHUFFLE & BUILD ──
let answered = new Array(Q.length).fill(false);
let correct_count = 0;
let answered_count = 0;

function buildQuiz() {
  const wrap = document.getElementById('quiz-wrap');
  wrap.innerHTML = '';
  Q.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = `q${i}`;
    card.style.animationDelay = `${i * 0.04}s`;

    const letters = ['A','B','C','D'];
    const optsHTML = q.opts.map((o, j) => `
      <div class="opt" id="opt_${i}_${j}" onclick="pick(${i},${j})">
        <div class="opt-letter">${letters[j]}</div>
        <div class="opt-text">${o}</div>
      </div>`).join('');

    card.innerHTML = `
      <div class="q-header">
        <div class="q-num">Q${i+1}</div>
        <div class="q-tag">${q.cat}</div>
        <div class="q-text">${q.q}</div>
      </div>
      <div class="q-options">${optsHTML}</div>
      <div class="q-explain" id="exp${i}"></div>
    `;
    wrap.appendChild(card);
  });

  // Submit button
  const submitWrap = document.createElement('div');
  submitWrap.className = 'submit-wrap';
  submitWrap.innerHTML = `<button class="btn-submit" id="submitBtn" onclick="submitQuiz()">Nộp bài và xem kết quả →</button>`;
  wrap.appendChild(submitWrap);
}

function pick(qi, oi) {
  if (answered[qi]) return;
  answered[qi] = true;
  answered_count++;

  const isCorrect = oi === Q[qi].ans;
  if (isCorrect) correct_count++;

  const card = document.getElementById(`q${qi}`);
  const opts = card.querySelectorAll('.opt');

  opts.forEach((opt, j) => {
    opt.classList.add('disabled');
    if (j === oi && isCorrect) opt.classList.add('correct');
    else if (j === oi && !isCorrect) opt.classList.add('wrong');
    else if (j === Q[qi].ans && !isCorrect) opt.classList.add('show-correct');
  });

  card.classList.add(isCorrect ? 'answered-correct' : 'answered-wrong');

  // Show explanation
  const exp = document.getElementById(`exp${qi}`);
  exp.className = `q-explain ${isCorrect ? 'correct-exp' : 'wrong-exp'} show`;
  exp.innerHTML = (isCorrect ? '✓ Đúng! ' : '✗ Chưa đúng. ') + Q[qi].exp;

  // Update counter
  document.getElementById('cnt').textContent = answered_count;
  updateProgress();
}

function updateProgress() {
  const pct = (answered_count / Q.length * 100).toFixed(1);
  document.getElementById('pbar').style.width = pct + '%';
}

function submitQuiz() {
  // Mark unanswered as skipped
  Q.forEach((q, i) => {
    if (!answered[i]) {
      const card = document.getElementById(`q${i}`);
      card.querySelector(`#opt_${i}_${q.ans}`).classList.add('show-correct', 'disabled');
      const opts = card.querySelectorAll('.opt');
      opts.forEach(o => o.classList.add('disabled'));
      const exp = document.getElementById(`exp${i}`);
      exp.className = 'q-explain wrong-exp show';
      exp.innerHTML = '⚪ Bỏ qua. ' + q.exp;
    }
  });

  showResult();
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('sticky').style.display = 'none';
}

        </div>
        <div class="stat-item">
          <div class="stat-num" style="color:var(--red)">${Q.length - correct_count}</div>
          <div class="stat-lbl">Câu sai/bỏ</div>
        </div>
      </div>
      <div class="breakdown">
        <h3>Kết quả theo chủ đề</h3>
        ${catHTML}
      </div>
    </div>
    <button class="btn-retry" onclick="retry()">↺ Làm lại từ đầu</button>
  `;

  // Animate ring
  setTimeout(() => {
    document.getElementById('ring-anim').style.strokeDashoffset = offset;
    // Animate cat bars
    document.querySelectorAll('.cat-fill').forEach(el => {
      el.style.width = '0%';
      setTimeout(() => { el.style.width = el.dataset.w + '%'; }, 100);
    });
  }, 200);

  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function retry() {
  answered = new Array(Q.length).fill(false);
  correct_count = 0;
  answered_count = 0;
  document.getElementById('result-panel').style.display = 'none';
  document.getElementById('pbar').style.width = '0%';
  document.getElementById('cnt').textContent = '0';
  document.getElementById('sticky').style.display = 'flex';
  buildQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

buildQuiz();
</script>
</body>
</html>
